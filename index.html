Object.assign(F,{
/* website terms of use */
"*wt-about":{t:"About These Terms",g:["online"],e:"Who the terms apply to and how they work alongside the privacy and cookie policies.",p:["These terms tell you the rules for using our website [www.●.co.uk] (our site). By using our site you confirm that you accept these terms and agree to comply with them. If you do not agree, you must not use our site.","Our Privacy Policy and Cookie Policy also apply to your use of our site. If you buy from us, our terms of sale will apply to your purchase."]},
"*wt-who":{t:"Who We Are and How to Contact Us",e:"The company details a website must show under the Electronic Commerce (EC Directive) Regulations 2002 and the Companies Act 2006.",p:["Our site is operated by {SN}, a company registered in England and Wales under company number [●], with its registered office at {SA}. Our VAT number is [●].","To contact us, email [●] or call [●]."]},
"*wt-use":{t:"Using Our Site",e:"Access is free and can be suspended, and users are responsible for their own access.",p:["Our site is made available free of charge. We do not guarantee that our site, or any content on it, will always be available or be uninterrupted. We may suspend, withdraw or restrict the availability of all or any part of our site for business or operational reasons.","You are responsible for making all arrangements necessary for you to have access to our site, and for ensuring that anyone who accesses our site through your internet connection is aware of these terms."]},
"*wt-accept":{t:"Acceptable Use",e:"What visitors must not do on the site.",p:[["You may use our site only for lawful purposes. You must not:",["use our site in any way that breaches any applicable law or regulation, or that is fraudulent or harmful","transmit any unsolicited advertising or promotional material","knowingly introduce viruses, trojans, worms or other material that is malicious or technologically harmful","attempt to gain unauthorised access to our site, the server on which it is stored or any connected database","copy, scrape or extract content from our site by automated means, except as permitted by law"]]]},
"*wt-ip":{t:"Intellectual Property",e:"The site content belongs to the business and may be used only for personal reference.",p:["We are the owner or licensee of all intellectual property rights in our site and in the material published on it. You may print off one copy, and download extracts, of any page of our site for your personal use and to draw it to the attention of others within your organisation.","You must not modify the material you have printed or downloaded, or use any illustrations, photographs, video or audio separately from the accompanying text. Our status as the authors of content on our site must always be acknowledged."]},
"*wt-reliance":{t:"Information on Our Site",e:"The content is general information, not advice to rely on.",p:["The content on our site is provided for general information only. It is not intended to amount to advice on which you should rely. You must obtain professional or specialist advice before taking, or refraining from, any action on the basis of the content on our site.","We make reasonable efforts to update the information on our site, but we make no representations, warranties or guarantees that the content on our site is accurate, complete or up to date."]},
"*wt-links":{t:"Links to Other Sites",e:"Links to other websites are not endorsements.",p:["Where our site contains links to other sites and resources provided by third parties, these links are provided for your information only. They should not be interpreted as approval by us of those linked websites or the information you may obtain from them. We have no control over the contents of those sites or resources."]},
"*wt-liab":{t:"Our Responsibility for Loss or Damage",e:"Liability is limited for business visitors, and consumers keep their legal rights.",p:["We do not exclude or limit in any way our liability to you where it would be unlawful to do so. This includes liability for death or personal injury caused by our negligence, and for fraud or fraudulent misrepresentation.","If you are a business user, we exclude all implied conditions, warranties and representations that may apply to our site or its content, and we will not be liable to you for any loss or damage arising under or in connection with your use of, or inability to use, our site, or your use of or reliance on any content on it. In particular, we will not be liable for loss of profits, sales, business or revenue, business interruption, loss of anticipated savings, loss of business opportunity, goodwill or reputation, or any indirect or consequential loss.","If you are a consumer, we only provide our site for domestic and private use. We have no liability to you for any loss of profit, loss of business, business interruption or loss of business opportunity."]},
"*wt-virus":{t:"Viruses",e:"The business does not guarantee the site is free of viruses.",p:["We do not guarantee that our site will be secure or free from bugs or viruses. You are responsible for configuring your own technology to access our site, and you should use your own virus protection software."]},
"*wt-change":{t:"Changes to These Terms and to Our Site",e:"The business can update the terms and the site.",p:["We may revise these terms at any time by amending this page. Please check this page from time to time to take notice of any changes, as they are binding on you. We may update and change our site from time to time to reflect changes to our products, our users' needs and our business priorities."]},
"*wt-law":{t:"Which Country's Laws Apply",e:"English law applies, and consumers in Scotland or Northern Ireland may bring proceedings there.",p:["If you are a consumer, these terms, their subject matter and their formation are governed by English law. You and we both agree that the courts of England and Wales will have exclusive jurisdiction, except that if you are a resident of Northern Ireland you may also bring proceedings in Northern Ireland, and if you are a resident of Scotland you may also bring proceedings in Scotland.","If you are a business, these terms, their subject matter and their formation (and any non-contractual disputes or claims) are governed by English law, and we both agree to the exclusive jurisdiction of the courts of England and Wales."]},

/* privacy policy */
"*pp-who":{t:"Who We Are",g:["privacy"],e:"The controller's identity and contact details, which Article 13 of the UK GDPR requires.",p:["{SN} (we, us, our) is the controller of the personal information described in this policy. We are registered in England and Wales under company number [●], and our registered office is at {SA}. Our registration number with the Information Commissioner's Office is [●].","If you have any questions about this policy or how we use your personal information, contact us at [●] or write to us at the address above. [Our data protection officer can be contacted at [●].]"]},
"*pp-collect":{t:"The Information We Collect",g:["privacy"],e:"The categories of personal data collected. Tailor the list to the business.",p:[["We may collect and use the following personal information about you:",["identity and contact details, such as your name, job title, email address, telephone number and postal address","account details, such as your username and password, and your preferences","transaction details, such as the products and services you buy from us and your payment history (we do not store full card numbers)","communications, such as emails and messages you send us and notes of calls","technical information, such as your IP address, browser type, device information and how you use our website, collected through cookies (see our Cookie Policy)","marketing preferences, such as whether you have agreed to receive marketing from us"]],"[We do not collect any special category data, such as information about your health, ethnicity or religious beliefs.]"]},
"*pp-sources":{t:"Where We Get Your Information",g:["privacy"],e:"The sources of the personal data, including third parties.",p:["We collect most of this information directly from you, when you contact us, place an order, create an account or use our website. We may also receive information about you from [the business you work for], [payment providers], [credit reference agencies] and [publicly available sources such as Companies House]."]},
"*pp-use":{t:"How We Use Your Information and Our Lawful Bases",g:["privacy"],e:"Each purpose with its lawful basis under Article 6 of the UK GDPR. Legitimate interests need a balancing test.",p:[["We use your personal information for the following purposes, relying on the lawful basis shown:",["to provide our products and services to you and manage your account: because it is necessary for our contract with you, or to take steps at your request before entering into it","to take payment and keep financial records: to comply with our legal obligations, including tax law","to respond to your enquiries and provide customer support: for our legitimate interests in running our business and helping our customers","to improve our website, products and services: for our legitimate interests in developing our business","to send you marketing about our products and services: with your consent, or, for existing customers, for our legitimate interests where the law allows (see Marketing below)","to prevent fraud and keep our systems secure: for our legitimate interests and to comply with our legal obligations"]],"Where we rely on legitimate interests, we have considered whether those interests are outweighed by your rights. You can ask us for more information about this balancing test."]},
"*pp-share":{t:"Who We Share It With",g:["privacy"],e:"The recipients or categories of recipient of the data.",p:[["We share your personal information only where necessary, with:",["service providers who help us run our business, such as our website host, email and IT providers, payment processor and delivery partners, who act on our instructions","our professional advisers, such as accountants, lawyers and insurers","HM Revenue and Customs, regulators and other authorities, where the law requires it","a buyer or prospective buyer of our business, if we sell all or part of it"]],"We do not sell your personal information."]},
"*pp-intl":{t:"Transfers Outside the UK",g:["privacy"],e:"International transfers and the safeguards relied on.",p:["Some of our service providers are based outside the UK. Where we transfer your personal information outside the UK, we make sure it is protected by an adequacy decision or regulations, or by the International Data Transfer Agreement or the UK addendum to the EU standard contractual clauses. Contact us for more information about these safeguards."]},
"*pp-keep":{t:"How Long We Keep It",g:["privacy"],e:"Retention periods, or the criteria used to set them.",p:["We keep your personal information only for as long as we need it for the purposes described in this policy. We keep customer and transaction records for [six (6)] years after the end of our relationship, to meet our tax and accounting obligations and to deal with any claims. We keep marketing preferences until you ask us to stop. When we no longer need your information, we delete it or anonymise it securely."]},
"*pp-rights":{t:"Your Rights",g:["privacy"],e:"The data subject rights under Articles 15 to 22 of the UK GDPR.",p:[["You have the following rights in relation to your personal information:",["to ask for a copy of it (right of access)","to ask us to correct anything that is inaccurate or incomplete (right to rectification)","to ask us to delete it in certain circumstances (right to erasure)","to ask us to restrict how we use it in certain circumstances (right to restriction)","to object to our using it where we rely on legitimate interests, and at any time to direct marketing (right to object)","to ask us to transfer information you have given us to another organisation, or to you (right to data portability)","to withdraw your consent at any time, where we rely on consent"]],"You do not usually have to pay to exercise your rights. We will respond within one month, which we may extend by two further months for complex or numerous requests. To exercise any of these rights, contact us using the details above."]},
"*pp-mkt":{t:"Marketing",g:["privacy"],e:"Electronic marketing rules under the Privacy and Electronic Communications Regulations 2003.",p:["We will only send you marketing emails or texts if you have agreed to receive them or, if you are an existing customer, about our own similar products and services, provided you did not opt out when we collected your details. You can unsubscribe at any time by clicking the link in any marketing email or by contacting us."]},
"*pp-security":{t:"Keeping Your Information Secure",g:["privacy"],e:"A summary of the security measures in place.",p:["We use appropriate technical and organisational measures to protect your personal information against loss, misuse and unauthorised access, including encryption, access controls and staff training. If we become aware of a personal data breach that is likely to result in a high risk to you, we will tell you without undue delay."]},
"*pp-cookies":{t:"Cookies",g:["privacy"],e:"Cross-reference to the cookie policy.",p:["Our website uses cookies and similar technologies. Our Cookie Policy explains what they are, which we use and how you can manage them."]},
"*pp-children":{t:"Children",g:["privacy"],e:"The position on children's data. Online services offered directly to children must also follow the ICO's Children's Code.",p:["Our website and services are not intended for children under [thirteen (13)], and we do not knowingly collect their personal information."]},
"*pp-complain":{t:"Complaints",g:["privacy"],e:"How to complain to the business and to the ICO. Controllers must provide a way to complain, including electronically, and acknowledge complaints within 30 days (Data Protection Act 2018, section 164A).",p:["If you have a concern about how we use your personal information, please contact us first at [●] or using our online complaints form at [●]. We will acknowledge your complaint within thirty (30) days and keep you informed of our progress.","You also have the right to complain to the Information Commissioner's Office, the UK regulator for data protection, at ico.org.uk or on 0303 123 1113."]},
"*pp-change":{t:"Changes to This Policy",g:["privacy"],e:"How the policy is updated.",p:["We may update this policy from time to time. The latest version will always be on our website, with the date it was last updated at the top. If we make significant changes, we will tell you."]},

/* cookie policy */
"*ck-what":{t:"What Cookies Are",g:["privacy"],e:"A plain explanation of cookies and similar technologies.",p:["Cookies are small text files placed on your device when you visit a website. They are widely used to make websites work, to work more efficiently and to provide information to the owners of the site. This policy also covers similar technologies, such as pixels and local storage, which we refer to together as cookies."]},
"*ck-types":{t:"The Cookies We Use",g:["privacy"],e:"The categories of cookie and the consent position for each. From 5 February 2026, analytics and appearance cookies may be set without consent if users are told clearly and can object easily.",p:[["We use the following types of cookie:",["strictly necessary cookies, which are essential for our website to work, for example to keep you logged in or to remember what is in your basket. These do not need your consent","analytics cookies, which help us understand how visitors use our website so that we can improve it. [We set these only with your consent.] [We set these to collect statistics only, and you can object to them at any time using the cookie settings on our website.]","functionality cookies, which remember your choices, such as your language or region, and adapt the appearance of our website. [We set these only with your consent.] [You can object to them at any time using the cookie settings on our website.]","advertising cookies, which are used by us and our advertising partners to show you relevant adverts on other websites and to measure how well they work. We set these only with your consent"]],"The cookies we use, who sets them, what they do and how long they last are listed in {SC:cklist}."]},
"*ck-consent":{t:"Your Choices",g:["privacy"],e:"How consent is given and withdrawn.",p:["When you first visit our website, we will ask you to choose which cookies you accept, other than strictly necessary cookies. Rejecting cookies is as easy as accepting them. You can change your choices at any time by clicking [Cookie settings] at the bottom of any page."]},
"*ck-manage":{t:"Managing Cookies in Your Browser",g:["privacy"],e:"How to block or delete cookies through browser settings.",p:["Most browsers let you block or delete cookies through their settings. If you block all cookies, including strictly necessary cookies, parts of our website may not work. Information about managing cookies is available from your browser's help pages."]},
"*ck-change":{t:"Changes and Contact",g:["privacy"],e:"Updates and contact details.",p:["We may update this policy when we change the cookies we use. The latest version will always be on our website. If you have any questions, contact us at [●]. For more about how we use your personal information, see our Privacy Policy."]},

/* consumer terms of sale */
"*cs-who":{t:"These Terms and Who We Are",g:["consumer"],e:"The trader's identity and contact details, which the Consumer Contracts Regulations 2013 require before the contract is made.",p:["These terms apply to all products you buy from us through our website [www.●.co.uk]. Please read them carefully before you place an order.","We are {SN}, a company registered in England and Wales under company number [●], with our registered office at {SA}. Our VAT number is [●]. You can contact us by email at [●] or by telephone on [●]."]},
"*cs-contract":{t:"Our Contract With You",g:["consumer"],e:"When the contract is made, and when the business can turn an order down.",p:["Our acceptance of your order takes place when we email you to accept it, at which point a contract comes into existence between you and us. If we are unable to accept your order, we will tell you and will not charge you.","These terms are for consumers buying for purposes wholly or mainly outside their trade, business, craft or profession."]},
"*cs-products":{t:"Our Products",g:["consumer"],e:"Descriptions and images of products.",p:["The images of our products on our website are for illustrative purposes. We have made every effort to display colours accurately, but we cannot guarantee that your device's display accurately reflects the colour of the products. Your product may vary slightly from those images. If we make a product to measurements you give us, you are responsible for ensuring those measurements are correct."]},
"*cs-price":{t:"Price and Payment",g:["consumer"],e:"Prices include VAT and pricing errors are dealt with fairly.",p:["The price of a product (which includes VAT) is the price shown on our website when you place your order, together with any delivery charge shown before you confirm your order.","If the price we have shown is wrong and the correct price is higher, we will contact you before accepting your order. We accept payment by [debit and credit card]. We will take payment when [you place your order]."]},
"*cs-deliv":{t:"Delivery",g:["consumer"],e:"Delivery timing and when the products become the customer's responsibility. Without an agreed date, goods must be delivered within 30 days (Consumer Rights Act 2015, section 28).",p:["We will deliver the products to you [within [●] days] [on the date agreed during the order process], and in any event within thirty (30) days after the day we accept your order. If our delivery is delayed by an event outside our control, we will contact you as soon as possible and take steps to minimise the effect of the delay.","A product will be your responsibility from the time we deliver it to the address you gave us, or to someone you nominated to receive it. You own a product once we have received payment in full."]},
"*cs-cancel":{t:"Your Right to Change Your Mind",g:["consumer"],e:"The 14-day cancellation right for distance sales under the Consumer Contracts (Information, Cancellation and Additional Charges) Regulations 2013, and its main exceptions.",p:["For most products bought online, you have a legal right to change your mind within fourteen (14) days and receive a refund. The fourteen days start on the day after you, or someone you nominate, receive the products, or the last of them if they are delivered separately.",["You do not have a right to change your mind in respect of:",["products made to your specifications or clearly personalised","sealed products which are not suitable for return for health protection or hygiene reasons, once they have been unsealed after delivery","products which are liable to deteriorate or expire rapidly","digital content which you have started to download or stream, where you agreed to this before the end of the cancellation period and acknowledged that you would lose your right to cancel"]]]},
"*cs-cancel-how":{t:"How to Cancel and Return Products",g:["consumer"],e:"How to cancel and who pays for returns.",p:["To end the contract, contact us by email at [●], or use the cancellation form [on our website] [enclosed with your order]. Please give your name, address, order details and, where available, your phone number and email address.","You must return the products to us within fourteen (14) days of telling us you wish to end the contract. [We will pay the costs of return.] [You will be responsible for the cost of returning the products.] You must take reasonable care of the products until you return them."]},
"*cs-refund":{t:"Refunds",g:["consumer"],e:"Refund timing and deductions for handling beyond what is needed to inspect the goods.",p:["If you are exercising your right to change your mind, we will refund the price you paid for the products and the cost of standard delivery, by the method you used for payment. We will make the refund within fourteen (14) days of receiving the products back from you or, if earlier, the day on which you provide evidence that you have sent them back.","We may reduce your refund to reflect any reduction in the value of the products if this has been caused by your handling them in a way which would not be permitted in a shop."]},
"*cs-faulty":{t:"If There Is a Problem With the Product",g:["consumer"],e:"The statutory rights for faulty goods under the Consumer Rights Act 2015. These cannot be excluded.",p:["We are under a legal duty to supply products that are of satisfactory quality, fit for purpose and as described. If you think a product is faulty or misdescribed, please contact us.","Your legal rights include: up to thirty (30) days after delivery, the right to reject a faulty product and get an immediate refund; up to six (6) months after delivery, if your product cannot be repaired or replaced, the right to a full refund in most cases; and up to six (6) years after delivery (five (5) years in Scotland), the right to an appropriate remedy if the product does not last a reasonable length of time.","Nothing in these terms affects your legal rights. For detailed information, visit the Citizens Advice website at www.citizensadvice.org.uk."]},
"*cs-liab":{t:"Our Responsibility for Loss or Damage Suffered by You",g:["consumer"],e:"Liability limited to foreseeable loss, with the exclusions consumer law forbids left out.",p:["If we fail to comply with these terms, we are responsible for loss or damage you suffer that is a foreseeable result of our breaking this contract or our failing to use reasonable care and skill. Loss or damage is foreseeable if either it is obvious that it will happen or if, at the time the contract was made, both we and you knew it might happen.","We do not exclude or limit in any way our liability to you where it would be unlawful to do so. This includes liability for death or personal injury caused by our negligence, for fraud or fraudulent misrepresentation, and for breach of your legal rights in relation to the products.","We only supply the products for domestic and private use. If you use the products for any commercial, business or resale purpose, we will have no liability to you for any loss of profit, loss of business, business interruption or loss of business opportunity."]},
"*cs-data":{t:"How We Use Your Personal Information",g:["consumer"],e:"Cross-reference to the privacy policy.",p:["We will only use your personal information as set out in our Privacy Policy."]},
"*cs-law":{t:"Disputes and the Law That Applies",g:["consumer"],e:"English law, with consumers able to bring proceedings where they live in the UK.",p:["If you have a complaint, please contact us first and we will try to resolve it. If you are not happy with our response, you may be able to refer the dispute to [an alternative dispute resolution provider, [●]].","These terms are governed by English law, and you can bring legal proceedings in respect of the products in the English courts. If you live in Scotland, you can bring legal proceedings in either the Scottish or the English courts. If you live in Northern Ireland, you can bring legal proceedings in either the Northern Irish or the English courts."]},

/* freelancer */
"*fl-status":{t:"Status of the Freelancer",g:["contractors"],e:"Sets the freelancer up as self-employed, with a right to send a substitute and control over how the work is done. These are markers of self-employment, but the reality of the relationship decides status.",p:["{S} is engaged as an independent contractor and is self-employed. Nothing in this Agreement makes {S} an employee or worker of {B}. {S} is not entitled to holiday pay, sick pay, pension contributions or any other employee benefit.","{S} may decide how, when and where to carry out the Services, provided that {S} meets the requirements of each Statement of Work. {B} is not obliged to offer, and {S} is not obliged to accept, any further work.","{S} may send a suitably qualified substitute to carry out the Services, provided that the substitute is bound by confidentiality obligations equivalent to those in this Agreement. {S} shall pay the substitute and remains responsible for the Services.","{S} is responsible for all income tax and national insurance contributions on the Charges, and shall indemnify {B} against any tax, national insurance contributions or penalties for which {B} becomes liable because of {S}'s failure to account for them.","[{B} is a small company for the purposes of the off-payroll working rules in Chapter 10 of Part 2 of the Income Tax (Earnings and Pensions) Act 2003.] [Where {S} provides the Services through an intermediary and {B} is a medium or large organisation, {B} shall determine {S}'s status and issue a status determination statement under those rules.]"]},

/* casual worker */
"*cw-status":{t:"Nature of the Engagement",g:["casual"],e:"A casual worker relationship: work is offered when available and may be turned down. Exclusivity clauses in zero hours contracts are unenforceable (Employment Rights Act 1996, section 27A).",p:["{B} may offer {S} work from time to time as and when it is available. {B} is under no obligation to offer work to {S}, and {S} is under no obligation to accept any work offered. {S} is a worker and not an employee.","Each period of work which {S} accepts is a separate engagement. There is no contract in force between assignments.","Nothing in this Agreement prevents {S} from working for any other person at any time."]},
"*cw-work":{t:"Offers of Work",g:["casual"],e:"How shifts are offered, accepted and cancelled. The Employment Rights Act 2025 will add rights to reasonable notice of shifts and payment for short-notice cancellations once commenced.",p:["{B} will offer work by [text message] [email] [the rota app], giving the date, start and finish times and place of work. {S} may accept or decline each offer. Once accepted, {S} shall attend the shift on time.","{B} will give as much notice as reasonably practicable of any shift and of any cancellation of an accepted shift. [If {B} cancels an accepted shift less than [twenty-four (24)] hours before it is due to start, {B} shall pay {S} for [two (2)] hours.]","If {S} cannot attend an accepted shift, {S} shall tell {B} as soon as possible and in any event before the shift starts."]},
"*cw-pay":{t:"Pay",g:["casual"],e:"The hourly rate. Pay must never fall below the National Minimum Wage or National Living Wage for the worker's age.",p:["{B} shall pay {S} at the rate of £[●] an hour for all hours worked, which shall not be less than the national minimum wage applicable to {S}. Pay is subject to deductions for income tax and national insurance contributions.","{S} shall record the hours worked in each shift [using the timesheet system]. {B} shall pay {S} [weekly] [monthly] in arrears by bank transfer, with an itemised payslip."]},
"*cw-hours":{t:"Hours and Place of Work",g:["casual"],e:"The written statement must give the hours and days of work and the place of work.",p:["There are no normal working hours. The hours of each shift will be agreed when it is offered. {S} shall work at [●] or at such other place as is agreed for a particular shift.","{S} is entitled to rest breaks in accordance with the Working Time Regulations 1998, including a rest break of at least twenty (20) minutes when working more than six (6) hours."]},
"*cw-sick":{t:"Sickness",g:["casual"],e:"Statutory sick pay is payable from the first day of sickness from 6 April 2026, with no lower earnings limit (Employment Rights Act 2025).",p:["If {S} is unable to attend an accepted shift because of sickness, {S} shall tell {B} before the shift starts. {S} may be entitled to statutory sick pay, subject to the statutory conditions. There is no contractual sick pay."]},
"*cw-pension":{t:"Pension",g:["casual"],e:"Auto-enrolment duties under the Pensions Act 2008.",p:["{B} will assess {S} for automatic enrolment into a workplace pension scheme in accordance with the Pensions Act 2008 and will enrol {S} if {S} is eligible. Details are available from {B}."]},
"*cw-conduct":{t:"Conduct and Policies",g:["casual"],e:"The worker follows reasonable rules and policies.",p:["While working, {S} shall comply with {B}'s reasonable instructions and with its health and safety, equal opportunities and other policies notified to {S} from time to time, which are not contractual. {B}'s disciplinary and grievance procedures are available from [●]."]},
"*cw-conf":{t:"Confidential Information",g:["casual"],e:"Basic confidentiality for the business's information.",p:["{S} shall not, during or after the engagement, use or disclose any confidential information about {B}'s business, customers or staff, save as required in the course of the work or by law."]},
"*cw-data":{t:"Personal Data",g:["casual"],e:"Notice of the privacy information given to the worker.",p:["{B} will process personal data about {S} in accordance with its privacy notice for workers, a copy of which has been given to {S}."]},
"*cw-end":{t:"Ending the Arrangement",g:["casual"],e:"Either side may end the overall arrangement. Any shift already accepted should be honoured or paid.",p:["Either party may end this Agreement at any time by notice in writing. Any shift already accepted shall be worked and paid unless both parties agree otherwise.","{B} may end an engagement without notice for gross misconduct.","[The Employment Rights Act 2025 will give workers on zero or low hours the right to be offered guaranteed hours reflecting the hours they regularly work. {B} will comply with that right once it comes into force.]"]},

/* influencer */
"*inf-svc":{t:"The Campaign",g:["influencer"],e:"The content to be made, the platforms and the posting dates.",p:["{S} shall create and publish the Campaign Content described in {SC:infcamp} on the Platforms on the dates set out there, and shall keep each item of Campaign Content live for at least [thirty (30)] days after it is published.","{S} shall make the Campaign Content personally, in {S}'s own style, and shall comply with the brief and the brand guidelines provided by {B}."]},
"*inf-approve":{t:"Approval of Content",g:["influencer"],e:"The brand sees content before it goes live and can ask for changes.",p:["{S} shall send each item of Campaign Content to {B} at least [three (3)] Business Days before it is due to be published. {B} may approve it or request reasonable changes within [two (2)] Business Days, and {S} shall make up to [two (2)] rounds of changes.","{S} shall not publish any Campaign Content until {B} has approved it in writing."]},
"*inf-disclose":{t:"Advertising Disclosure",g:["influencer"],e:"Paid content must be obviously identifiable as advertising under the CAP Code and consumer protection law. The ASA and the CMA both enforce this.",p:["{S} shall ensure that each item of Campaign Content is obviously identifiable as advertising, by including the label [#ad] prominently at the start of the post or caption, and by using any paid partnership tool provided by the Platform.","{S} shall comply with the UK Code of Non-broadcast Advertising and Direct and Promotional Marketing (the CAP Code), the Advertising Standards Authority's guidance for influencers and the Competition and Markets Authority's guidance on social media endorsements, and shall make only claims about {B}'s products which {B} has approved in writing."]},
"*inf-fee":{t:"Fee and Expenses",g:["influencer"],e:"What the influencer is paid and when.",p:["In return for the Campaign, {B} shall pay {S} the Campaign Fee [fifty per cent (50%) on signing this Agreement and fifty per cent (50%) within thirty (30) days after the last item of Campaign Content is published], on receipt of a valid invoice.","{B} shall provide the products featured in the Campaign free of charge. {S} may keep those products. {B} shall reimburse expenses only where it has agreed them in writing in advance."]},
"*inf-conduct":{t:"Conduct and Reputation",g:["influencer"],e:"Protects both sides' reputations, with a right to end the campaign if either brings the other into disrepute.",p:["Each party shall not, during the term of this Agreement, do anything which brings the other into serious disrepute.","If {S} does anything which, in {B}'s reasonable opinion, is likely to bring {B} into serious disrepute, {B} may end this Agreement immediately by written notice and require {S} to remove the Campaign Content. {B} shall pay the Campaign Fee for Campaign Content published before that date, but no further sums."]},
"*inf-platform":{t:"Platform Rules and Removal",g:["influencer"],e:"Compliance with the platform's own rules, and removal on request.",p:["{S} shall comply with the terms and community guidelines of each Platform.","If {B} asks {S} to remove any Campaign Content because it is, or is alleged to be, unlawful or in breach of advertising rules, {S} shall remove it within [twenty-four (24)] hours."]},

/* partnership and LLP */
"*ps-bus":{t:"The Business and the Firm",g:["partnership"],e:"What the business does, its name and where it trades.",p:["The parties shall carry on the business of [●] in partnership under the name [●] from [●], or such other place as they agree.","The partnership began on [●] and shall continue until it is ended in accordance with this Agreement. It shall not end because a party retires, dies or becomes bankrupt, and the continuing party may carry on the business."]},
"*ps-cap":{t:"Capital",g:["partnership"],e:"What each partner puts in, and whether it earns interest.",p:["The capital of the {T} is £[●], contributed by the parties in the following proportions: {B} [●]% and {S} [●]%. No party shall withdraw capital without the consent of the other.","[Interest shall be paid on each party's capital at [●]% a year before profits are divided.] [No interest shall be paid on capital.]"]},
"*ps-mgmt":{t:"Management and Decisions",g:["partnership"],e:"Day-to-day decisions and the matters needing everyone's consent.",p:["Each party shall devote [the whole of their working time] to the business and shall act in good faith towards the other.",["Day-to-day decisions may be made by either party. The following decisions require the consent of both parties:",["borrowing money or giving any guarantee or security","entering into any contract worth more than £[●] or lasting more than [twelve (12)] months","employing or dismissing any member of staff","admitting a new partner or member","changing the nature or name of the business"]]]},
"*ps-acc":{t:"Banking and Accounts",g:["partnership"],e:"Bank accounts, records, the financial year and tax.",p:["All money received by the {T} shall be paid into its bank account at [●]. [Payments over £[●] require the authority of both parties.]","Proper accounts shall be kept and prepared for each financial year ending on [●], and shall be binding on the parties once signed by both. Each party shall be responsible for their own income tax and national insurance on their share of the profits."]},
"*ps-draw":{t:"Drawings",g:["partnership"],e:"How much each party may take out on account of profits during the year.",p:["Each party may draw up to £[●] a month on account of their share of the profits. If, when the accounts are prepared, a party has drawn more than their share, that party shall repay the excess within [three (3)] months."]},
"*ps-leave":{t:"Retirement, Death and Expulsion",g:["partnership"],e:"How a party leaves and how they are paid out. Without this, a partnership at will may be dissolved by either partner on notice under the Partnership Act 1890.",p:["A party may retire by giving the other not less than [six (6)] months' written notice.","The other party may require a party to leave by written notice if that party commits a serious or persistent breach of this Agreement, becomes bankrupt, or is unable to work for [six (6)] consecutive months.","When a party leaves, the continuing party shall pay to the departing party, or their estate, the value of their capital and share of the profits up to the date of leaving, as shown in accounts prepared to that date, by [four (4)] equal quarterly instalments."]},
"*ps-dispute":{t:"Disputes",g:["partnership"],e:"Disputes are mediated before going further.",p:["If the parties cannot resolve a dispute about this Agreement, they shall first try to settle it by mediation through [the Centre for Effective Dispute Resolution]. If the dispute is not resolved within [thirty (30)] days after the mediator is appointed, either party may refer it to the courts of England and Wales."]},
"*llp-mem":{t:"Members and Designated Members",g:["partnership"],e:"Who the members are and who handles filings with Companies House.",p:["The parties are the members of the {T} and are its designated members for the purposes of the Limited Liability Partnerships Act 2000. Each designated member shall ensure that the {T} files its accounts and confirmation statement at Companies House on time.","A new member may be admitted only with the written consent of all the members and on signing a deed of adherence to this Agreement."]},
"*llp-default":{t:"The Default Rules",g:["partnership"],e:"Replaces the statutory default rules, which otherwise share profits equally and prevent expulsion.",p:["The default rules in regulations 7 and 8 of the Limited Liability Partnerships Regulations 2001 shall not apply to the {T}, save to the extent consistent with this Agreement."]},

/* founders */
"*fd-venture":{t:"The Venture",g:["founders"],e:"What the founders are building together, before a company exists.",p:["The Founders intend to develop the Venture together and to carry it on through the Company."]},
"*fd-incorp":{t:"Incorporation and Shares",g:["founders"],e:"When the company will be set up and how the shares will be split.",p:["The Founders shall incorporate the Company within [three (3)] months after the date of this Agreement, or earlier if the Founders agree.","On incorporation, the Company shall issue ordinary shares to the Founders in the following proportions: {B} [●]% and {S} [●]%.","On incorporation, the Founders shall adopt articles of association and enter into a shareholders' agreement which reflect the terms of this Agreement."]},
"*fd-roles":{t:"Roles and Time",g:["founders"],e:"Who does what, and how much time each founder commits.",p:["{B} shall be responsible for [●] and {S} shall be responsible for [●]. Each Founder shall devote [at least [●] hours a week] [their full working time] to the Venture from [●], and shall act in good faith towards the other."]},
"*fd-ip":{t:"Intellectual Property",g:["founders"],e:"Everything created for the venture ends up owned by the company.",p:["All intellectual property created by either Founder for the Venture, before or after the date of this Agreement, shall be held by the Founders jointly until the Company is incorporated, and shall then be assigned to the Company. Each Founder shall sign any document needed to complete that assignment.","Each Founder confirms that what they contribute to the Venture is their own work and does not belong to any employer or other person."]},
"*fd-decide":{t:"Decisions and Costs",g:["founders"],e:"How the founders decide things, and who pays costs before investment.",p:["Decisions about the Venture shall be made by the Founders jointly. Neither Founder shall commit the Venture to any expenditure over £[●] without the consent of the other.","Costs of the Venture shall be shared in the same proportions as the Founder Shares and shall be repaid by the Company out of its first funding, if the Founders agree."]},
"*fd-conf":{t:"Confidentiality and Leaving",g:["founders"],e:"Confidentiality, and what happens if the venture does not go ahead.",p:["Each Founder shall keep confidential all information about the Venture, during and after their involvement.","If the Founders decide not to proceed with the Venture before the Company is incorporated, any intellectual property shall belong to the Founders jointly and neither may use it without the consent of the other."]},

/* letters */
"*lp-debt":{t:"The Overdue Invoices",g:["getpaid"],e:"Identifies the unpaid invoices and the total due.",p:["Our records show that the invoices listed in {SC:lpinv} are overdue for payment. The total of £[●] is now due under our contract with you."]},
"*lp-interest":{t:"Interest and Compensation",g:["getpaid"],e:"Statutory interest at 8% above the Bank of England base rate and fixed compensation per invoice under the Late Payment of Commercial Debts (Interest) Act 1998.",p:["Under the Late Payment of Commercial Debts (Interest) Act 1998, we are entitled to statutory interest on each overdue invoice at eight per cent (8%) a year above the Bank of England base rate, from the day after it was due until it is paid. Interest is currently accruing at £[●] a day.",["We are also entitled to fixed compensation for each invoice of:",["£40 for a debt of less than £1,000","£70 for a debt of £1,000 or more but less than £10,000","£100 for a debt of £10,000 or more"]],"We reserve the right to claim our reasonable costs of recovering the debt in addition."]},
"*lp-pay":{t:"Please Pay Now",g:["getpaid"],e:"How to pay and the deadline.",p:["Please pay the total due, together with interest and compensation, within [seven (7)] days of the date of this letter, by bank transfer to sort code [●], account number [●], quoting [●].","If you believe that any amount is not due, or there is a problem we are not aware of, please contact [●] on [●] immediately so that we can resolve it."]},
"*lba-claim":{t:"Our Claim",g:["getpaid"],e:"Who is claiming, what for, and on what basis, as the Practice Direction on Pre-Action Conduct requires.",p:["We supplied [goods] [services] to you under [our contract dated [●]] [our terms and conditions accepted on [●]]. We invoiced you for the sums listed in {SC:lpinv}, totalling £[●]. Payment was due by [●], and despite our reminders dated [●] the sum remains unpaid.","Copies of the contract, the invoices and our reminders are enclosed."]},
"*lba-interest":{t:"Interest and Costs",g:["getpaid"],e:"Statutory or contractual interest and compensation.",p:["We also claim [statutory interest under the Late Payment of Commercial Debts (Interest) Act 1998 at eight per cent (8%) a year above the Bank of England base rate] [interest at the contractual rate of [●]% a year], which at the date of this letter amounts to £[●] and continues at £[●] a day, together with fixed compensation of £[●]."]},
"*lba-demand":{t:"What We Require",g:["getpaid"],e:"The deadline for payment or a response. A business debtor should have a reasonable period, usually 14 days. An individual, including a sole trader, must be given 30 days under the Pre-Action Protocol for Debt Claims.",p:["Please pay the total of £[●], together with continuing interest, within [fourteen (14)] [thirty (30)] days of the date of this letter, by bank transfer to sort code [●], account number [●].","If you dispute the debt, in whole or in part, please tell us within the same period, giving your reasons and enclosing any documents you rely on. We are willing to discuss a payment plan or to consider mediation."]},
"*lba-next":{t:"If You Do Not Respond",g:["getpaid"],e:"Notice that court proceedings may follow, and of the court's powers on costs.",p:["If we do not receive payment or a satisfactory response within that period, we intend to issue court proceedings against you without further notice to recover the debt, interest and our costs.","The court expects the parties to follow the Practice Direction on Pre-Action Conduct and may take into account any failure to do so when deciding what order to make about costs and interest. You may wish to take independent legal advice."]},
"*lba-protocol":{t:"Information for Individuals",g:["getpaid"],e:"Only for a debtor who is an individual or sole trader: the Pre-Action Protocol for Debt Claims requires an information sheet, a reply form and a financial statement form with the letter.",p:["[If you are an individual or a sole trader: we enclose the information sheet, reply form and financial statement form required by the Pre-Action Protocol for Debt Claims. Please complete and return the reply form within thirty (30) days. Free debt advice is available from organisations such as Citizens Advice and the National Debtline.]"]},

/* licence to occupy */
"*lto-grant":{t:"Grant of Licence",g:["premises"],e:"Permission to use space, without exclusive possession. Exclusive possession for a term at a rent is likely to create a tenancy whatever the document says (Street v Mountford [1985] UKHL 4).",p:["{S} permits {B} to use the Licensed Area, in common with {S} and others authorised by {S}, for [office use] during the Licence Period, together with the use of the shared kitchen, washroom and meeting facilities in the Building.","{S} may change the Licensed Area to other space of a similar size and standard in the Building on reasonable notice."]},
"*lto-fee":{t:"Licence Fee",g:["premises"],e:"The monthly fee and what it covers.",p:["{B} shall pay {S} a licence fee of £[●] a month [plus VAT], in advance on the first day of each month, by bank transfer. The licence fee includes heating, lighting, cleaning of the shared areas, internet access and business rates for the Licensed Area.","[{B} shall pay a deposit of £[●] on signing, which {S} shall return within [fourteen (14)] days after the licence ends, less any sums owed by {B}.]"]},
"*lto-use":{t:"Use of the Space",g:["premises"],e:"How the occupier must behave in the building.",p:[["{B} shall:",["use the Licensed Area only for the permitted use and comply with the building rules notified by {S}","not make any alterations or attach anything to the walls without {S}'s consent","not cause any nuisance or disturbance to others in the Building","keep the Licensed Area clean and tidy and leave it in the same condition at the end of the licence","be responsible for insuring its own property in the Building"]]]},
"*lto-notenancy":{t:"No Tenancy",g:["premises"],e:"Records that the arrangement is a licence, not a lease.",p:["This licence is personal to {B} and does not give {B} exclusive possession of any part of the Building or create the relationship of landlord and tenant. {B} may not assign or share this licence.","{S} and its agents may enter the Licensed Area at any time for any purpose."]},
"*lto-end":{t:"Ending Early and Leaving",g:["premises"],e:"Ending for breach, and what the occupier must do on leaving.",p:["{S} may end this licence immediately by written notice if {B} fails to pay the licence fee within [seven (7)] days after it is due, or commits any other serious breach of this licence.","When the licence ends, {B} shall remove all of its belongings and leave the Licensed Area. {S} may dispose of anything left behind after [fourteen (14)] days."]},
"*lto-liab":{t:"Liability",g:["premises"],e:"Limits the owner's liability for interruptions to services.",p:["{S} shall not be liable for any interruption in the services or facilities provided under this licence which is outside its reasonable control, or for any loss of or damage to {B}'s property, save where caused by {S}'s negligence. Nothing in this licence limits liability for death or personal injury caused by negligence."]}

function smePicks(a,side,lev,pris,value){
  const fams=new Set(); SME_PRI.filter(p=>pris.includes(p.id)||(p.id==="liab"&&["high","vhigh"].includes(value))).forEach(p=>p.fam.forEach(f=>fams.add(f)));
  const picks={};
  negKeys(a).forEach(k=>{const r=ranked(k,side);let m=0;r.forEach((x,i)=>{if(Math.abs(x.o[1])<Math.abs(r[m].o[1]))m=i});
    const pri=fams.has(k);const pos=lev==="strong"?(pri?0:m):lev==="even"?(pri?Math.max(0,m-1):m):(pri?m:Math.min(r.length-1,m+1));
    picks[k]=r[pos].i});
  return picks;
}

const SME_EXPORT_MIN=0.7;
function smeExportGate(m){
  const kd=K[m.a.k], pg=dealProgress(m), pct=pg.total?pg.done/pg.total:1, need=[];
  const sides=kd.form==="notice"?["S"]:["B","S"];
  sides.forEach(w=>{if(!((m.d.parties[w]||{}).n||"").trim())need.push({t:`Add the ${kd.form==="notice"?"business":m.a.p[w==="B"?0:1]}'s name`,act:"deal"})});
  const req=Math.ceil(pg.total*SME_EXPORT_MIN);
  if(pg.done<req) need.push({t:`Fill in at least ${req} of the ${pg.total} details (${pg.done} done so far)`,act:"deal"});
  const r=m.a.sid&&recOfSid(m.a.sid); if(r&&r.status==="signed") return {ok:true,pct,need:[]};
  return {ok:!need.length,pct,need,done:pg.done,total:pg.total,req};
}

/* ============================================================
   WORD ENGINE
   readDocx: paragraphs with Word numbering, tracked changes and comments.
   buildDocx: a fresh document from simple paragraph and table blocks.
   redlineDocx: writes changes into the ORIGINAL file as tracked changes
   with comments, so the rest of its formatting is untouched.
   ============================================================ */
const WNS="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
const W14NS="http://schemas.microsoft.com/office/word/2010/wordml";
const W15NS="http://schemas.microsoft.com/office/word/2012/wordml";
const RELNS="http://schemas.openxmlformats.org/package/2006/relationships";
const CTNS="http://schemas.openxmlformats.org/package/2006/content-types";
const xesc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
const wAttr=(el,n)=>el.getAttributeNS(WNS,n)||el.getAttribute("w:"+n)||"";
const kids=(el,n)=>Array.from(el.childNodes).filter(c=>c.nodeType===1&&c.localName===n);
const kid=(el,n)=>kids(el,n)[0]||null;
const isoNow=()=>new Date().toISOString().replace(/\.\d+Z$/,"Z");

/* ---------- numbering ---------- */
function toRoman(n){const m=[[1000,"m"],[900,"cm"],[500,"d"],[400,"cd"],[100,"c"],[90,"xc"],[50,"l"],[40,"xl"],[10,"x"],[9,"ix"],[5,"v"],[4,"iv"],[1,"i"]];let s="";m.forEach(([v,r])=>{while(n>=v){s+=r;n-=v}});return s}
function fmtNum(n,f){
  if(f==="lowerLetter")return String.fromCharCode(96+((n-1)%26+1)).repeat(Math.floor((n-1)/26)+1);
  if(f==="upperLetter")return String.fromCharCode(64+((n-1)%26+1)).repeat(Math.floor((n-1)/26)+1);
  if(f==="lowerRoman")return toRoman(n); if(f==="upperRoman")return toRoman(n).toUpperCase();
  if(f==="decimalZero")return(n<10?"0":"")+n; if(f==="none"||f==="bullet")return""; return String(n);
}
function makeNumberer(numbering,styles){
  const abs={},nums={},sty={};
  if(numbering){
    Array.from(numbering.getElementsByTagNameNS(WNS,"abstractNum")).forEach(a=>{const lv={};kids(a,"lvl").forEach(l=>{const g=(n)=>{const e=kid(l,n);return e?wAttr(e,"val"):""};lv[+wAttr(l,"ilvl")]={fmt:g("numFmt")||"decimal",text:g("lvlText"),start:+(g("start")||1)}});abs[wAttr(a,"abstractNumId")]=lv});
    Array.from(numbering.getElementsByTagNameNS(WNS,"num")).forEach(n=>{const a=kid(n,"abstractNumId");nums[wAttr(n,"numId")]=a?wAttr(a,"val"):null});
  }
  if(styles) Array.from(styles.getElementsByTagNameNS(WNS,"style")).forEach(s=>{const id=wAttr(s,"styleId"),pPr=kid(s,"pPr"),np=pPr&&kid(pPr,"numPr"),bo=kid(s,"basedOn"),nm=kid(s,"name");
    sty[id]={numId:np&&kid(np,"numId")?wAttr(kid(np,"numId"),"val"):null,ilvl:np&&kid(np,"ilvl")?+wAttr(kid(np,"ilvl"),"val"):null,based:bo?wAttr(bo,"val"):null,name:nm?wAttr(nm,"val"):id}});
  const styleNum=id=>{let d=0;while(id&&sty[id]&&d<10){if(sty[id].numId)return sty[id];id=sty[id].based;d++}return null};
  const counters={};
  return {styleName:id=>sty[id]?sty[id].name:id||"",
    label(p){
      const pPr=kid(p,"pPr"); if(!pPr) return null;
      const ps=kid(pPr,"pStyle"), sid=ps?wAttr(ps,"val"):null, np=kid(pPr,"numPr");
      let numId=null,ilvl=null;
      if(np){const a=kid(np,"numId"),b=kid(np,"ilvl");numId=a?wAttr(a,"val"):null;ilvl=b?+wAttr(b,"val"):null}
      const sn=styleNum(sid); if(!numId&&sn){numId=sn.numId} if(ilvl==null) ilvl=sn&&sn.ilvl!=null?sn.ilvl:0;
      if(!numId||numId==="0") return null;
      const aid=nums[numId]; const lv=abs[aid]; if(!lv||!lv[ilvl]) return {lvl:ilvl,text:""};
      const c=counters[aid]||(counters[aid]=[]);
      c[ilvl]=c[ilvl]==null?lv[ilvl].start:c[ilvl]+1; for(let i=ilvl+1;i<10;i++)c[i]=null;
      const text=(lv[ilvl].text||"").replace(/%(\d)/g,(m,k)=>{const L=+k-1;const v=c[L]==null?(lv[L]?lv[L].start:1):c[L];return fmtNum(v,lv[L]?lv[L].fmt:"decimal")});
      return {lvl:ilvl,text:lv[ilvl].fmt==="bullet"?"":text.trim()};
    }};
}

/* ---------- reading ---------- */
function bodyParas(doc){
  return Array.from(doc.getElementsByTagNameNS(WNS,"p")).filter(p=>{let e=p.parentNode;while(e&&e.nodeType===1){if(e.localName==="p"||e.localName==="txbxContent")return false;e=e.parentNode}return true});
}
async function readDocx(buf){
  const zip=await JSZip.loadAsync(buf);
  const xml=async p=>{const f=zip.file(p);return f?new DOMParser().parseFromString(await f.async("string"),"application/xml"):null};
  const doc=await xml("word/document.xml"); if(!doc) throw new Error("This file is not a Word document.");
  const numr=makeNumberer(await xml("word/numbering.xml"),await xml("word/styles.xml"));
  const cdoc=await xml("word/comments.xml"), cex=await xml("word/commentsExtended.xml");
  const active=new Set(), anchors={}, paras=[];
  bodyParas(doc).forEach((p,pi)=>{
    const segs=[]; let bold=null;
    const push=(t,k,meta)=>{if(!t)return;const last=segs[segs.length-1],c=[...active].join(",");
      if(last&&last.k===k&&last.a===(meta&&meta.a||"")&&last.c===c)last.t+=t;else segs.push({t,k,a:meta&&meta.a||"",d:meta&&meta.d||"",c});
      active.forEach(id=>{const A=anchors[id]||(anchors[id]={pi,t:""});if(k!=="del"||!A.t)A.t+=t})};
    const walk=(el,k,meta)=>{Array.from(el.childNodes).forEach(n=>{if(n.nodeType!==1)return;const ln=n.localName;
      if(ln==="pPr"||ln==="rPr"||ln==="txbxContent"||ln==="drawing"||ln==="pict"||ln==="instrText"||ln==="delInstrText")return;
      if(ln==="ins"||ln==="moveTo")return walk(n,"ins",{a:wAttr(n,"author"),d:wAttr(n,"date")});
      if(ln==="del"||ln==="moveFrom")return walk(n,"del",{a:wAttr(n,"author"),d:wAttr(n,"date")});
      if(ln==="commentRangeStart"){active.add(wAttr(n,"id"));return}
      if(ln==="commentRangeEnd"){const id=wAttr(n,"id");active.delete(id);if(!anchors[id])anchors[id]={pi,t:""};return}
      if(ln==="commentReference"){const id=wAttr(n,"id");if(!anchors[id])anchors[id]={pi,t:""};return}
      if(ln==="r"&&bold===null){const rp=kid(n,"rPr");bold=!!(rp&&kid(rp,"b")&&wAttr(kid(rp,"b"),"val")!=="0"&&wAttr(kid(rp,"b"),"val")!=="false")}
      if(ln==="t"||ln==="delText")return push(n.textContent,k,meta);
      if(ln==="tab"||ln==="ptab")return push(" ",k,meta);
      if(ln==="br"||ln==="cr")return push(" ",k,meta);
      if(ln==="noBreakHyphen")return push("-",k,meta);
      walk(n,k,meta);
    })};
    walk(p,"n",null);
    const cur=segs.filter(s=>s.k!=="del").map(s=>s.t).join("").replace(/\s+/g," ").trim();
    const orig=segs.filter(s=>s.k!=="ins").map(s=>s.t).join("").replace(/\s+/g," ").trim();
    const lab=numr.label(p), pPr=kid(p,"pPr"), ps=pPr&&kid(pPr,"pStyle");
    let inTbl=false;{let e=p.parentNode;while(e&&e.nodeType===1){if(e.localName==="tbl"){inTbl=true;break}e=e.parentNode}}
    paras.push({t:cur,o:orig,segs,num:lab?lab.text:"",lvl:lab?lab.lvl:null,hasNum:!!lab,style:ps?numr.styleName(wAttr(ps,"val")):"",bold:!!bold,inTbl,rev:segs.some(s=>s.k!=="n")});
  });
  /* comments and replies */
  const comments=[];
  if(cdoc){
    const byPara={};
    Array.from(cdoc.getElementsByTagNameNS(WNS,"comment")).forEach(c=>{
      const ps=kids(c,"p"), text=ps.map(p=>Array.from(p.getElementsByTagNameNS(WNS,"t")).map(t=>t.textContent).join("")).join("\n").trim();
      const last=ps[ps.length-1], pid=last?(last.getAttributeNS(W14NS,"paraId")||last.getAttribute("w14:paraId")):"";
      const o={id:wAttr(c,"id"),author:wAttr(c,"author"),date:wAttr(c,"date"),text,parent:null,done:false,anchor:anchors[wAttr(c,"id")]||null};
      comments.push(o); if(pid) byPara[pid]=o;
    });
    if(cex) Array.from(cex.getElementsByTagNameNS(W15NS,"commentEx")).forEach(e=>{const g=n=>e.getAttributeNS(W15NS,n)||e.getAttribute("w15:"+n);const o=byPara[g("paraId")];if(!o)return;const par=byPara[g("paraIdParent")];if(par)o.parent=par.id;o.done=g("done")==="1"});
  }
  return {paras,comments};
}

/* ---------- diffs ---------- */
const wtok=s=>s.match(/\s+|[A-Za-z0-9À-ɏ’'‘-]+|[^\sA-Za-z0-9]/g)||[];
function lcsOps(a,b,eq){
  const n=a.length,m=b.length;
  if(n*m>400000) return [...a.map(x=>({op:"del",v:x})),...b.map(x=>({op:"ins",v:x}))];
  const D=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=eq(a[i],b[j])?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){if(eq(a[i],b[j])){out.push({op:"eq",v:a[i],w:b[j]});i++;j++}else if(D[i+1][j]>=D[i][j+1])out.push({op:"del",v:a[i++]});else out.push({op:"ins",v:b[j++]})}
  while(i<n)out.push({op:"del",v:a[i++]});while(j<m)out.push({op:"ins",v:b[j++]});
  return out;
}
function wordDiff(a,b){
  const ops=lcsOps(wtok(a),wtok(b),(x,y)=>x===y).map(o=>({op:o.op,t:o.op==="eq"?o.w:o.v}));
  const words=s=>(s.match(/[A-Za-z0-9\u00C0-\u024F]+/g)||[]).length;
  const kept=ops.filter(o=>o.op==="eq").reduce((n,o)=>n+words(o.t),0), longest=Math.max(words(a),words(b));
  /* little in common: show one clean replacement, as a lawyer would mark it up */
  if(longest>6&&kept/longest<0.4) return [a?{op:"del",t:a}:null,b?{op:"ins",t:b}:null].filter(Boolean);
  /* fold short runs of matching words that sit between two changes into the change */
  for(let i=1;i<ops.length-1;i++){if(ops[i].op==="eq"&&ops[i-1].op!=="eq"&&ops[i+1].op!=="eq"){let j=i,w=0;while(j<ops.length&&ops[j].op==="eq"){w+=words(ops[j].t);j++}
    if(j<ops.length&&w<=2&&ops[j].op!=="eq"){const t=ops.slice(i,j).map(o=>o.t).join("");ops.splice(i,j-i,{op:"del",t},{op:"ins",t});i++}}}

  const isSch=p=>!p.inTbl&&p.t.length<90&&/^(schedule|appendix|annex)\b/i.test(p.t);

  let type="general";
  const exact=ALL.filter(a=>title.toUpperCase().includes(a.n.toUpperCase())).sort((x,y)=>y.n.length-x.n.length)[0];
  if(exact) type=exact.id; else {const h=TYPE_HINTS.find(([r])=>r.test(title)||r.test(head.slice(0,600)));if(h)type=h[1]}
  const names=[];let m;const re=/\((?:together\s+)?(?:the\s+)?["“]([A-Z][A-Za-z&'’ ]{1,40})["”]\)/g;
  while((m=re.exec(head))&&names.length<12) if(!names.includes(m[1]))names.push(m[1]);

const pbAll=()=>ST.pb||(ST.pb={B:{},S:{}});
const pbOf=(k,side)=>{const p=pbAll()[side]&&pbAll()[side][k];return p&&(p.p!=null||p.f!=null||p.w!=null)?p:null};
const riskAt=(k,i,side)=>riskOf(C[k].o[i][1],side);
function pbDefaultsFor(k,side){
  const rs=ranked(k,side);let m=rs[0];rs.forEach(x=>{if(Math.abs(x.o[1])<Math.abs(m.o[1]))m=x});
  const mi=rs.indexOf(m), w=rs[Math.min(rs.length-1,mi+1)];
  return {p:rs[0].i,f:m.i,w:w.i,n:""};
}
function pbLevel(k,risk,side){
  const p=pbOf(k,side);if(!p||risk==null)return null;
  const r=x=>x==null?null:riskAt(k,x,side);
  const rp=r(p.p),rf=r(p.f),rw=r(p.w);
  if(rp!=null&&risk<=rp) return "pref";
  if(rf!=null&&risk<=rf) return "fall";
  if(rw!=null&&risk<=rw) return "walk";
  if(rw!=null) return "out";
  return null;
}
const PB_LABEL={pref:"Within preferred",fall:"At fallback",walk:"At walk-away",out:"Outside walk-away"};
function pbTag(k,i,side){
  const p=pbOf(k,side);if(!p)return"";
  if(p.p===i) return `<em class="t pbp">Your preferred</em>`;
  if(p.f===i) return `<em class="t pbf">Your fallback</em>`;
  if(p.w===i) return `<em class="t pbw">Your walk-away</em>`;
  return pbLevel(k,riskAt(k,i,side),side)==="out"?`<em class="t pbo">Outside your playbook</em>`:"";
}
function playbookContext(keys,side,partyLabel){
  const lines=[];keys.forEach(k=>{const p=pbOf(k,side);if(!p)return;const a=x=>x==null?"not set":C[k].o[x][0].replace(/\{B\}/g,"buyer").replace(/\{S\}/g,"seller");
    lines.push(`${famTitle(k)}: preferred ${a(p.p)}; fallback ${a(p.f)}; walk-away ${a(p.w)}${p.n?". Note: "+p.n:""}`)});
  return lines.length?`\nThe ${partyLabel}'s negotiation playbook (treat anything riskier than the walk-away as unacceptable and say so in the ask):\n`+lines.join("\n"):"";
}

/* ---------- version comparison ---------- */
function untrackedChanges(ours,theirs){
  const A=[],B=[],Bi=[];
  ours.forEach(p=>{const t=normP(p.t);if(t)A.push(t)});
  theirs.forEach((p,i)=>{const t=normP(p.o!=null?p.o:p.t);if(t){B.push(t);Bi.push(i)}});
  const ops=paraDiff(A,B), items=[];let last=Bi[0]||0;
  ops.forEach(o=>{
    if(o.op==="eq"){last=Bi[o.b];return}
    if(o.op==="chg"){const d=wordDiff(A[o.a],B[o.b]);items.push({pi:Bi[o.b],kind:"chg",ours:A[o.a],del:d.filter(x=>x.op==="del").map(x=>x.t.trim()).join(" … "),ins:d.filter(x=>x.op==="ins").map(x=>x.t.trim()).join(" … ")});last=Bi[o.b]}
    else if(o.op==="ins"){items.push({pi:Bi[o.b],kind:"ins",ours:"",del:"",ins:B[o.b]});last=Bi[o.b]}
    else items.push({pi:last,kind:"del",ours:A[o.a],del:A[o.a],ins:""});
  });
  return {items,a:A};
}
function comparisonBlocks(){
  const A=RV.cmp.a, idx=[], Ccur=[];RV.paras.forEach((p,i)=>{const t=normP(p.t);if(t){Ccur.push(t);idx.push(i)}});
  const untr=new Set(RV.cmp.items.map(x=>x.pi)), B=[], comments=[];let cid=1;
  const note=(b,pi)=>{if(untr.has(pi)){const id=cid++;b.cs=[id];b.ce=[id];comments.push({id,text:"This change was not shown as a tracked change in the returned draft.",author:"Counterpart"})}};
  B.push({p:"Comparison: "+safeName(RV.cmp.oursName)+" against "+safeName(RV.name),bold:true,align:"center"});
  paraDiff(A,Ccur).forEach(o=>{let b;
    if(o.op==="eq") b={p:A[o.a]};
    else if(o.op==="chg"){b={p:wordDiff(A[o.a],Ccur[o.b]).map(x=>[x.t,{ins:x.op==="ins",del:x.op==="del"}])};note(b,idx[o.b])}
    else if(o.op==="del") b={p:[[A[o.a],{del:true}]],pdel:true};
    else {b={p:[[Ccur[o.b],{ins:true}]],pins:true};note(b,idx[o.b])}
    B.push(b)});
  return {B,comments};
}

/* ---------- document health check ---------- */
const DEF_MEANS=/[“"]([A-Z][A-Za-z0-9&'’\- ]{0,58}[A-Za-z0-9])[”"]\s+(?:means|shall mean|has the meaning|includes|is defined)/g;
const DEF_INLINE=/\((?:the |each |together |collectively |each a |each an |a |an )?(?:the )?[“"]([A-Z][A-Za-z0-9&'’\- ]{0,58}[A-Za-z0-9])[”"]\)/g;
const HC_STOP=new Set("This That These Those The A An Any Each Such No All If In On Of For And Or But Subject Without Notwithstanding Save Where When Whereas Provided England Wales Scotland United Kingdom London English January February March April May June July August September October November December Monday Tuesday Wednesday Thursday Friday Saturday Sunday Agreement Clause Clauses Schedule Schedules Part Paragraph Article Section Annex Appendix Act Regulations Order Rules Court Courts Secretary State HM Revenue Customs Companies House Registrar Information Commissioner Bank England CEDR LCIA Business Days".split(" "));
function health(){
  const ps=RV.paras, texts=ps.map(p=>p.t), all=texts.join("\n");
  const defs={};
  texts.forEach((t,i)=>{let m;DEF_MEANS.lastIndex=0;while((m=DEF_MEANS.exec(t)))(defs[m[1]]=defs[m[1]]||[]).push(i);DEF_INLINE.lastIndex=0;while((m=DEF_INLINE.exec(t)))(defs[m[1]]=defs[m[1]]||[]).push(i)});
  const esc2=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\/*SCRIPT*/");
  const unused=[],dupes=[];
  Object.keys(defs).forEach(term=>{const n=(all.match(new RegExp("(?<![A-Za-z])"+esc2(term)+"(?:s|es)?(?![A-Za-z])","g"))||[]).length;
    if(n-defs[term].length<=0) unused.push({term,pi:defs[term][0]});
    if(new Set(defs[term]).size>1) dupes.push({term,pi:defs[term][1]})});
  const known=new Set(Object.keys(defs)), cand={};
  texts.forEach((t,i)=>{let m;const re=/\b(?:the|a|an|any|each|such|that|this|no|every|all|relevant)\s+((?:[A-Z][a-z]+)(?:\s(?:[A-Z][a-z]+|of|and)){0,3})/g;
    while((m=re.exec(t))){let term=m[1].replace(/\s(?:of|and)$/,"").trim();const first=term.split(" ")[0];
      const after=t.slice(m.index+m[0].length);
      if(/^\s+(?:Act|Regulations|Order|Rules|Directive|Code|Convention)\b/.test(after)||/(?:Act|Authority|Commissioner|Council|Court|Office|Bank|Exchange)$/.test(term))continue;
      const forms=[term,term.replace(/s$/,""),term+"s",term+"es",term.replace(/y$/,"ies")];
      if(HC_STOP.has(term)||HC_STOP.has(first)||forms.some(f=>known.has(f))||[...known].some(k=>k.startsWith(term+" ")||term.startsWith(k+" ")))continue;
      if(/^(Buyer|Seller|Customer|Supplier|Company|Parties|Party)$/.test(term))continue;
      const c=cand[term]||(cand[term]={term,n:0,pi:i});c.n++}});
  const undefinedTerms=Object.values(cand).filter(c=>c.n>=2).sort((x,y)=>y.n-x.n).slice(0,25);
  const nums=new Set();ps.forEach(p=>{const n=(p.hasNum&&p.num?p.num:(p.t.match(/^(\d+(?:\.\d+)*)\.?\s/)||[])[1]||"").replace(/\.$/,"");if(n&&/^\d/.test(n)){nums.add(n);nums.add(n.split(".")[0])}});
  const schNums=new Set();RV.clauses.filter(c=>c.kind==="sch").forEach(c=>{const m=c.title.match(/schedule\s+(\d+)/i);if(m)schNums.add(m[1])});
  const xrefs=[];
  if(nums.size>3) texts.forEach((t,i)=>{let m;const re=/\b[Cc]lauses?\s+(\d+(?:\.\d+)*)(?:\([a-z]+\))?/g;while((m=re.exec(t))){if(!nums.has(m[1]))xrefs.push({ref:m[0],pi:i,why:"No clause "+m[1]+" was found in this document"})}});
  texts.forEach((t,i)=>{let m;const re=/\bSchedule\s+(\d+)\b/g;while((m=re.exec(t))){if(schNums.size&&!schNums.has(m[1]))xrefs.push({ref:m[0],pi:i,why:"No Schedule "+m[1]+" was found in this document"})}});
  const blanks=[];texts.forEach((t,i)=>{let m;const re=/\[(?:\s*|[●•]|_+|x+|X+|\.{2,}|…|\*+|TBC|TBD|tbc|tbd|insert[^\]]{0,60}|date|name|amount|address|number)\]|\bTBC\b|\bTBD\b/g;while((m=re.exec(t)))blanks.push({ref:m[0],pi:i,ctx:t.slice(Math.max(0,m.index-50),m.index+60)})});
  const roles=["Buyer","Purchaser","Seller","Vendor","Customer","Client","Supplier","Provider","Licensee","Licensor"].filter(r=>known.has(r));
  const parties=[];[["Buyer","Purchaser"],["Seller","Vendor"],["Customer","Client"],["Supplier","Provider"]].forEach(([x,y])=>{const def=known.has(x)?x:known.has(y)?y:null;if(!def)return;const other=def===x?y:x;
    if(!known.has(other)){const n=(all.match(new RegExp("\\bthe "+other+"\\b","g"))||[]).length;if(n){const pi=texts.findIndex(t=>new RegExp("\\bthe "+other+"\\b").test(t));parties.push({ref:"the "+other,pi,why:`Used ${n} time${n===1?"":"s"}, but the document defines “${def}”`})}}});
  const total=unused.length+dupes.length+xrefs.length+blanks.length+parties.length;
  return {unused,dupes,undefinedTerms,xrefs,blanks,parties,total,defCount:Object.keys(defs).length};
}
function healthHTML(){
  const h=health(), row=(ref,pi,why)=>{const c=clauseOfPara(pi);return `<tr><td>${esc(ref)}</td><td><button class="lnk" data-act="rvjump" data-id="${c?c.id:""}">${esc(clauseRef(c))}</button></td><td>${esc(why||"")}</td></tr>`};
  const sec=(t,d,rows)=>`<section class="hsec"><h3>${t} <span class="hcount">${rows.length}</span></h3><p class="hint">${d}</p>${rows.length?`<div class="tw dark"><table class="itbl htbl"><thead><tr><th>Item</th><th>Where</th><th>Detail</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`:`<p class="hok">Nothing found.</p>`}</section>`;
  return `<div class="page wrap"><div class="page-in wide"><button class="back" data-act="rvtab" data-tab="doc">‹ Back to the review</button>
   <p class="kicker">${esc(safeName(RV.name))}</p><h1 class="pg-t">Document health check</h1>
   <p class="pg-d">${h.total} issue${h.total===1?"":"s"} found across ${h.defCount} defined terms, cross-references and blanks. These are checks on the text, so confirm each one before changing the draft.</p>
   ${sec("Blanks to complete","Placeholders such as [●], [insert], TBC and TBD still in the text.",h.blanks.map(b=>row(b.ref,b.pi,"…"+normP(b.ctx)+"…")))}
   ${sec("Broken cross-references","References to clauses or schedules that do not appear in this document.",h.xrefs.map(x=>row(x.ref,x.pi,x.why)))}
   ${sec("Defined but never used","Terms that are defined but not used anywhere else.",h.unused.map(x=>row("“"+x.term+"”",x.pi,"Defined, then not used")))}
   ${sec("Defined more than once","Terms defined in more than one place, which can create inconsistent meanings.",h.dupes.map(x=>row("“"+x.term+"”",x.pi,"Defined again here")))}
   ${sec("Inconsistent party names","A party referred to by a name the document does not define.",h.parties.map(x=>row(x.ref,x.pi,x.why)))}
   ${sec("Possibly undefined terms","Capitalised terms used as defined terms but not defined. Some may be proper names or defined in another document.",h.undefinedTerms.map(x=>row(x.term,x.pi,`Used ${x.n} times`)))}
  </div></div>`;
}

  const r=m.rounds[m.rounds.length-1], have=new Set(r.items.map(i=>i.ref+"|"+i.issue)); let n=0;
  const add=it=>{if(have.has(it.ref+"|"+it.issue))return;have.add(it.ref+"|"+it.issue);r.items.push(Object.assign({id:mxId("i"),status:"open"},it));n++};
  incoming().forEach(it=>add({ref:clauseRef(it.clause),by:"them",
    issue:it.commentOnly?(it.anchorText?"Comment on: “"+normP(it.anchorText).slice(0,200)+"”":"Comment"):[it.del?"Deleted: “"+normP(it.del)+"”":"",it.ins?"Inserted: “"+normP(it.ins)+"”":""].filter(Boolean).join(" "),
    theirs:it.comments.map(c=>c.text).join(" "),ours:""}));
  RV.clauses.filter(c=>c.cur||c.cmt).forEach(c=>add({ref:clauseRef(c),by:"us",issue:c.src?"We propose: "+c.src:"Comment",theirs:"",ours:c.cmt||""}));
  mxTouch(m); return n;
}

      {const id=t.dataset.id; IDB.del("rvjson:"+id); if(RV&&RV.id===id){delete RV.mid;saveRV()}else IDB.del(id); m.reviews=m.reviews.filter(r=>r.id!==id); mxTouch(m); render(true); return true}
    case "mxrvsave": mxSaveReview(m); IDB.put("rvjson:"+RV.id,JSON.stringify(RV)); render(true); toast("Review saved to the matter"); return true;
    case "mxrvnew": MX_PENDING=m.id; view={v:"review",tab:view.tab,q:""}; RVSHOWLANDING=true; cur=null; sel=null; render(); return true;
    case "mxround": view.mr=+t.dataset.i; render(true); return true;

/* ============================================================
   CROSS-DOCUMENT CONSISTENCY: parties, shared defined terms,
   deal facts, documents referred to, and blanks, across every
   draft and saved review in a matter.

const CX_TERMS=["Completion","Business Day","Effective Date","Purchaser","Seller Group","Target Group","Intellectual Property Rights","Confidential Information","Territory"];
const CX_RV={};
const cxNormName=s=>String(s||"").toLowerCase().replace(/\b(limited|ltd|plc|llp|inc|gmbh|bv|b\.v|sa|s\.a)\b\.?/g,"").replace(/[^a-z0-9]+/g," ").trim();
const cxCmp=s=>s.replace(/\b(clause|Schedule|paragraph|Part) \d+(\.\d+)*/g,"$1 #").replace(/the Main Agreement/g,"the SPA").toLowerCase();
const cxNorm=s=>String(s||"").replace(/\s+/g," ").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").trim().replace(/[;.]$/,"");
const cxGeneric=n=>!n||/^(buyer|seller|customer|supplier|recipient|provider|party [ab12])$/i.test(n.trim());
function cxLoadReviews(m){
  const need=m.reviews.filter(r=>!(r.id in CX_RV)); if(!need.length) return false;
  need.forEach(r=>{CX_RV[r.id]=null; IDB.get("rvjson:"+r.id).then(j=>{try{CX_RV[r.id]=j?JSON.parse(j):false}catch(e){CX_RV[r.id]=false} if(view.v==="matter"&&view.mt==="cx")render(true)})});
  return true;
}
function cxSources(m){
  const out=[];
  m.docs.filter(x=>AG[x.ag]).forEach(x=>{
    const a=mxDocAg(m,x), bm=build(a), cx={a,nums:bm.nums,fill:bm.d.fill};

function docText(m){
  if(K[m.a.k].form) return formText(m);
  const a=m.a, kd=K[a.k], word=(kd.doc||"Agreement").toUpperCase(), first=kd.first, second=first==="B"?"S":"B", fill=m.d.fill, cx={a,nums:m.nums,fill,u:"Background"};

  let t=`${a.n.toUpperCase()}\n\nTHIS ${word} is dated ${strip(dated(m,"[●]"))}\n\nPARTIES\n\n(1) ${strip(partyLine(m,first))}; and\n(2) ${strip(partyLine(m,second))}.\n\n`;
  if(recOf(a).length) t+="BACKGROUND\n\n"+recOf(a).map((r,i)=>`(${String.fromCharCode(65+i)}) ${tok(r,cx)}`).join("\n")+"\n\n";

    } else if(c.edited){

    } else {
      const multi=c.paras.length>1;

    }

  const cx0=cx;

    if(!c.blocks){t+="[To be completed]";return}
    const cx=Object.assign({},cx0,{u:"Schedule "+c.n+". "+c.t});

  });
  t+="\n\n\nEXECUTION\n\n"+[first,second].map(w=>execText(m,w)).join("\n\n\n");

const LINE_LAB=/^(\d+(?:\.\d+)+|\([a-z]{1,4}\))\s+/;

function clauseLines(c,cxx){
