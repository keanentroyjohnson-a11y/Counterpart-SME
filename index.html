 ["Good repair, sensible exclusions",0,["{B} shall keep the Premises in good and substantial repair and condition, save for damage caused by an Insured Risk (unless the insurance has been vitiated by any act or default of {B}) and any inherent defect."],
  "The market position. A standard obligation with fair exclusions.","A well-kept building and a familiar standard.",{"Insured Risks":"fire, lightning, explosion, storm, flood, earthquake, aircraft, riot, malicious damage, terrorism and such other risks as {S} reasonably insures against from time to time"}],
 ["Full repair, including structure",2,["{B} shall put and keep the Premises in good and substantial repair and condition and shall, where necessary, renew and rebuild them, including the structure and foundations and any inherent defect."],
  "You may have to improve the building beyond its condition when you took it.","The building is maintained entirely at the tenant's cost."]]},

"ls-alien":{t:"Assignment and Underletting",g:["property"],
 d:"Whether the tenant can transfer the lease, or sublet all or part of the premises.",
 n:"Where consent is not to be unreasonably withheld, the landlord must respond within a reasonable time and give reasons for any refusal (Landlord and Tenant Act 1988, s.1). Conditions for consent can be agreed in advance under s.19(1A) of the Landlord and Tenant Act 1927.",
 o:[
 ["Flexible, group sharing allowed",-2,["{B} may assign or underlet the whole of the Premises, or underlet part of them, with {S}'s consent, which shall not be unreasonably withheld or delayed.","{B} may share occupation of the Premises with any member of its group without {S}'s consent, provided that no relationship of landlord and tenant is created.","{S} shall not require an authorised guarantee agreement as a condition of consent to assignment unless the proposed assignee is of materially lower financial standing than {B}."],
  "Easy to restructure or leave.","Less control over who occupies your building."],
 ["Consent, guarantee where reasonable",0,["{B} shall not assign the whole of the Premises without {S}'s consent, which shall not be unreasonably withheld or delayed.","For the purposes of section 19(1A) of the Landlord and Tenant Act 1927, {S} may give consent to an assignment subject to a condition that {B} enters into an authorised guarantee agreement, where it is reasonable to require one."],
  "The market position. Workable, though you may have to guarantee whoever takes over.","Reasonable control and a backstop guarantee."],
 ["Strict conditions",2,["{B} shall not underlet or share occupation of part only of the Premises.",["{B} shall not assign the whole of the Premises without {S}'s consent. For the purposes of section 19(1A) of the Landlord and Tenant Act 1927, it shall be a condition of any consent that:",["{B} enters into an authorised guarantee agreement;","the assignee provides a rent deposit equal to six (6) months' Rent; and","the assignee's net profits for each of its last three (3) financial years were at least three (3) times the annual Rent."]]],
  "Hard and expensive to get out of the lease.","Strong control and security."]]},

"ls-1954":{t:"Security of Tenure",g:["property"],
 d:"Whether the tenant has a statutory right to renew the lease when it ends.",
 n:"To exclude the right to renew, the landlord's warning notice and the tenant's declaration must be completed before the tenant is contractually bound (Landlord and Tenant Act 1954, s.38A). A clause in the lease alone is not enough.",
 o:[
 ["Protected tenancy",-2,["Nothing in this Lease shall exclude the provisions of sections 24 to 28 of the Landlord and Tenant Act 1954 in relation to the tenancy created by this Lease."],
  "You have a statutory right to renew at the end of the term, which the landlord can only resist on limited grounds.","Regaining the premises at the end of the term may be slow, costly or impossible."],
 ["Contracted out",2,[["The parties confirm that:",["{S} served a notice on {B} in relation to the tenancy created by this Lease in the form, and within the time, required by section 38A(3)(a) of the Landlord and Tenant Act 1954;","{B}, or a person duly authorised by it, made a declaration in the form required by section 38A(3)(b) of that Act; and","the provisions of sections 24 to 28 of the Landlord and Tenant Act 1954 are excluded in relation to the tenancy created by this Lease."]]],
  "You must leave at the end of the term with no right to renew.","Full control over the premises when the lease ends."]]},

/* ---------------- employment ---------------- */
"emp-notice":{t:"Termination and Garden Leave",g:["covenants"],
 d:"How much notice each side must give, and the employer's rights to pay in lieu or require garden leave.",
 n:"An employer must give at least one week's notice for each complete year of service, up to twelve weeks (Employment Rights Act 1996, s.86).",
 df:{"Garden Leave":"any period during which {B} requires {S} not to attend work under this clause"},
 o:[
 ["Statutory minimum from employer",-2,["{B} may terminate the Employment by giving {S} not less than the minimum notice required by section 86 of the Employment Rights Act 1996. {S} may terminate the Employment by giving {B} not less than six (6) months' written notice.","{B} may, in its absolute discretion, terminate the Employment at any time with immediate effect by paying {S} a sum equal to the basic salary (excluding bonus, benefits and holiday accrual) that {S} would have received during the notice period or any unexpired part of it.","During all or any part of any notice period, {B} may require {S} to take Garden Leave, during which {S} shall remain an employee and bound by all duties of good faith and fidelity."],
  "Cheap and flexible to exit, while the executive stays bound for six months.","Little security, and a long period before you can move on."],
 ["Three months either way",0,["Either party may terminate the Employment by giving the other not less than three (3) months' written notice.","{B} may, in its absolute discretion, terminate the Employment with immediate effect by paying {S} a sum equal to the basic salary that {S} would have received during the notice period or any unexpired part of it.","During all or any part of any notice period, {B} may require {S} to take Garden Leave, during which {S} shall remain an employee and bound by all duties of good faith and fidelity."],
  "The market position for senior roles. Balanced, with flexibility to manage an exit.","Fair security and a reasonable route out."],
 ["Six months from employer, enhanced pay",2,["{B} may terminate the Employment by giving {S} not less than six (6) months' written notice. {S} may terminate the Employment by giving {B} not less than one (1) month's written notice.","If {B} terminates the Employment without giving full notice, it shall pay {S}, within fourteen (14) days of the Termination Date, a sum equal to the salary, bonus and cost to {B} of providing all contractual benefits for the notice period or its unexpired part.","{B} may not require {S} to take Garden Leave without {S}'s consent."],
  "Costly to exit, and the executive can leave on a month's notice.","Strong security, and a guaranteed payment if you are let go early."]]},

"emp-rc":{t:"Post-Termination Restrictions",g:["covenants"],
 d:"Limits on what the employee may do after leaving.",
 n:"Restrictions are void unless they go no further than reasonably necessary to protect a legitimate business interest. A court will not rewrite an over-wide clause, but may remove words that can be cut out without changing its meaning (Tillman v Egon Zehnder [2019] UKSC 32).",
 df:{"Restricted Business":"those parts of the business of {B} and any Group Company with which {S} was materially involved during the Relevant Period","Restricted Client":"any person who was a client of {B} or any Group Company during the Relevant Period and with whom {S} had material dealings","Relevant Period":"the period of twelve (12) months immediately before the Termination Date"},
 o:[
 ["Twelve months, full suite",-2,[["{S} shall not, for a period of twelve (12) months after the Termination Date, directly or indirectly:",["be employed or engaged in, or provide services to, any Restricted Business in competition with {B} within the United Kingdom;","solicit, or deal with, any Restricted Client in competition with {B}; or","solicit or entice away from {B} any employee earning more than £[●] a year with whom {S} worked during the Relevant Period."]],"Each restriction in this clause is a separate obligation and is severable from the others."],
  "Strong protection, though a twelve-month non-compete is at risk of being struck out.","Could keep you out of your industry for a year."],
 ["Six months, reduced by garden leave",0,[["{S} shall not, directly or indirectly:",["for six (6) months after the Termination Date, be employed or engaged in any Restricted Business in a role similar to that held by {S} during the Relevant Period;","for twelve (12) months after the Termination Date, solicit any Restricted Client in competition with {B}; or","for twelve (12) months after the Termination Date, solicit or entice away from {B} any employee earning more than £[●] a year with whom {S} worked during the Relevant Period."]],"Each period in this clause shall be reduced by any period of Garden Leave.","Each restriction in this clause is a separate obligation and is severable from the others."],
  "The market position. Realistic, and much more likely to be enforced.","Proportionate, and limited to people and clients you actually dealt with."],
 ["Light non-solicitation",2,["{S} shall not, for a period of six (6) months after the Termination Date, solicit any Restricted Client in competition with {B}. No other restriction shall apply after the Termination Date."],
  "The employee can join a competitor immediately.","Free to work wherever you choose."]]},

/* ---------------- finance ---------------- */
"fin-cov":{t:"Financial Covenants",g:["finance"],
 d:"The financial ratios the borrower must keep to, and whether a breach can be cured.",
 df:{"Relevant Period":"each period of twelve (12) months ending on a Quarter Date","Quarter Date":"each of 31 March, 30 June, 30 September and 31 December","Leverage":"the ratio of Total Net Debt on the last day of a Relevant Period to EBITDA for that Relevant Period","Total Net Debt":"the aggregate financial indebtedness of the Group less its cash","EBITDA":"the consolidated operating profit of the Group before interest, tax, depreciation and amortisation"},
 o:[
 ["Incurrence test only",-2,["No maintenance financial covenant shall apply.","{B} shall not incur any additional financial indebtedness or make any dividend or distribution unless, on a pro forma basis taking that indebtedness or distribution into account, Leverage would not exceed [●]:1."],
  "No risk of default from a single weak quarter.","Little early warning if the business weakens."],
 ["Leverage covenant with equity cure",0,["{B} shall ensure that Leverage in respect of each Relevant Period does not exceed 4.00:1.","Leverage shall be tested on each Quarter Date by reference to the compliance certificate delivered with the quarterly financial statements.","If Leverage exceeds the level in clause {N}.1, {B} may, within twenty (20) Business Days of the due date of the relevant compliance certificate, procure that new equity is contributed and treated as reducing Total Net Debt, provided that this right is not exercised in consecutive Relevant Periods or more than twice during the life of the Facility."],
  "The market position. Room to absorb a bad patch and a way to fix a breach.","A meaningful early warning, with a capped cure right."],
 ["Tight covenants, no cure",2,[["{B} shall ensure that, in respect of each Relevant Period:",["Leverage does not exceed 3.00:1; and","Interest Cover is not less than 4.00:1."]],"No equity cure or other right to remedy a breach of this clause shall apply."],
  "A small dip in trading could put you in default.","Early control if the business starts to struggle.",{"Interest Cover":"the ratio of EBITDA to net finance charges for a Relevant Period"}]]},

"fin-eod":{t:"Events of Default",g:["finance"],
 d:"The events that allow the lender to cancel the facility and demand immediate repayment.",
 n:"Drafting follows Loan Market Association conventions, which most UK lenders use as their starting point.",
 o:[
 ["Narrow, with thresholds",-2,[["Each of the following is an Event of Default:",["{B} fails to pay any amount due under a Finance Document within five (5) Business Days of its due date;","{B} fails to comply with {R:fin-cov}, and the failure is not cured in accordance with that clause;","{B} fails to comply with any other material obligation under a Finance Document and does not remedy the failure within twenty (20) Business Days of {S} giving notice of it;","any financial indebtedness of {B} exceeding £[5,000,000] in aggregate is declared due before its maturity by reason of an event of default; or","{B} is unable to pay its debts as they fall due, or any insolvency proceedings are commenced against it, other than proceedings which are frivolous or vexatious and are discharged within twenty-one (21) days."]],"At any time after an Event of Default has occurred and while it is continuing, {S} may cancel the Facility and declare the Loan immediately due and payable."],
  "Fewer triggers, and time to fix problems before the lender can act.","Less ability to act early."],
 ["Loan Market Association standard",0,[["Each of the following is an Event of Default:",["{B} fails to pay any amount due under a Finance Document on its due date, unless the failure is caused by an administrative or technical error and payment is made within three (3) Business Days;","{B} fails to comply with {R:fin-cov};","{B} fails to comply with any other obligation under a Finance Document and does not remedy the failure within fifteen (15) Business Days;","any representation made by {B} in a Finance Document is incorrect or misleading in any material respect when made;","any financial indebtedness of {B} exceeding £[1,000,000] in aggregate is not paid when due or is declared due before its maturity by reason of an event of default; or","{B} is or is deemed unable to pay its debts, or any insolvency proceedings are commenced against it."]],"At any time after an Event of Default has occurred and while it is continuing, {S} may cancel the Facility and declare the Loan immediately due and payable."],
  "The market position.","The market position, with the standard grace periods."],
 ["Wide, including material adverse change",2,[["Each of the following is an Event of Default:",["{B} fails to pay any amount due under a Finance Document on its due date;","{B} fails to comply with any obligation under a Finance Document;","any financial indebtedness of {B} is not paid when due, or is capable of being declared due before its maturity;","{B} is or is deemed unable to pay its debts, or any insolvency proceedings are commenced against it; or","any event or circumstance occurs which {S} reasonably believes has or is reasonably likely to have a material adverse effect on the business or financial condition of {B} or its ability to perform its obligations."]],"At any time after an Event of Default, {S} may cancel the Facility and declare the Loan immediately due and payable."],
  "The lender can call a default on its own judgment, and there are no grace periods.","Maximum control and the ability to act early."]]},

"fin-prepay":{t:"Voluntary Prepayment",g:["finance"],
 d:"Whether the borrower can repay early, and what it costs.",
 o:[
 ["Any time, without premium",-2,["{B} may, by giving {S} not less than five (5) Business Days' prior notice, prepay the whole or any part of the Loan (but, if in part, by a minimum amount of £[●]) without premium or penalty.","Any prepayment shall be made together with accrued interest on the amount prepaid."],
  "You can refinance freely when rates fall.","Your expected interest income can disappear at short notice."],
 ["Soft call for six months",0,["{B} may, by giving {S} not less than five (5) Business Days' prior notice, prepay the whole or any part of the Loan.","Any prepayment made within six (6) months of the date of utilisation shall be made together with a premium of one per cent (1%) of the amount prepaid, and all prepayments shall be made together with accrued interest on the amount prepaid."],
  "The market position. A small cost to refinance early.","Short-term protection of your return."],
 ["Make-whole, then step-down",2,["{B} may prepay the whole or any part of the Loan by giving {S} not less than ten (10) Business Days' prior notice.","Any prepayment made within twenty-four (24) months of the date of utilisation shall be made together with the Make-Whole Amount. Any prepayment made in the third or fourth year after utilisation shall be made together with a premium of two per cent (2%) or one per cent (1%) respectively of the amount prepaid."],
  "Very expensive to refinance for the first four years.","Your full return is protected.",{"Make-Whole Amount":"the present value of all interest that would have accrued on the amount prepaid from the date of prepayment to the second anniversary of the date of utilisation, discounted at the gilt rate plus 0.50 per cent. per annum"}]]}
};

/* ============================================================
   STANDARD (NON-NEGOTIABLE) CLAUSES
   e = plain English explanation shown in the guidance panel and margin notes
   ============================================================ */
const F = {
"*defs":{t:"Definitions and Interpretation",g:["boilerplate"],e:"Defines the capitalised terms used throughout, and sets the rules for reading the agreement. The definitions list updates automatically as you change the drafting.",p:[]},
"*dur":{t:"Commencement and Duration",e:"Says when the agreement starts and how long it runs.",p:["This Agreement shall commence on the Effective Date and, unless terminated earlier in accordance with its terms, shall continue for the Initial Term and thereafter until terminated by either party giving not less than three (3) months' written notice to the other, such notice to expire no earlier than the end of the Initial Term."]},
"*svc":{t:"Supply of Services",e:"The supplier's core promise to provide the services, and the customer's duty to co-operate.",p:["{S} shall provide the Services and the Deliverables to {B} in accordance with this Agreement and each Statement of Work.","{S} shall comply with all applicable laws and regulations, and with {B}'s reasonable policies notified to it in writing, in performing its obligations under this Agreement.","{B} shall provide {S} with such information and access to its premises and personnel as {S} reasonably requires in order to perform the Services. {S} shall not be liable for any delay or failure to the extent caused by {B}'s failure to do so."]},
"*supply":{t:"Orders",e:"How orders are placed and accepted, and which terms apply to them. The final sentence deals with the common problem of each side trying to impose its own standard terms.",p:["{B} may from time to time submit Orders to {S}. Each Order shall constitute an offer by {B} to purchase the Goods specified in it on the terms of this Agreement.","An Order shall be accepted only when {S} confirms its acceptance in writing, at which point a binding contract for the supply of those Goods shall come into existence.","This Agreement shall apply to each Order to the exclusion of any other terms that either party seeks to impose or incorporate, or which are implied by trade, custom, practice or course of dealing."]},
"*deliv":{t:"Delivery",e:"Where and when the goods are delivered, and what paperwork goes with them.",p:["{S} shall deliver the Goods to the Delivery Point on the date specified in the relevant Order, together with a delivery note stating the Order number, the type and quantity of the Goods and any special storage or handling instructions.","Delivery of the Goods shall be completed on their arrival at the Delivery Point."]},
"*grant":{t:"Access to the Service",e:"Gives the customer the right to use the software service, and sets out what it must not do with it. Decompiling for interoperability is permitted by statute and cannot be excluded.",p:["Subject to {B} paying the Charges, {S} grants to {B} a non-exclusive, non-transferable right, without the right to grant sub-licences, to permit the Authorised Users to access and use the Service and the Documentation during the Subscription Term solely for {B}'s internal business operations.",["{B} shall not, except as expressly permitted by this Agreement or by any law which cannot be excluded by agreement between the parties:",["copy, modify, duplicate or create derivative works from any part of the Service or the Documentation;","decompile, disassemble or reverse engineer any part of the Service, save to the extent permitted by section 296A of the Copyright, Designs and Patents Act 1988; or","access all or any part of the Service in order to build a product or service which competes with the Service."]]]},
"*cust":{t:"Customer Obligations",e:"The customer's responsibility for its users and for the data it puts into the service.",p:["{B} shall ensure that the Authorised Users use the Service in accordance with this Agreement and the Documentation, and shall be responsible for any breach of this Agreement by any Authorised User.","{B} shall own all rights in the Customer Data and shall have sole responsibility for its legality, reliability, integrity and accuracy."]},
"*roy":{t:"Royalties and Records",e:"How royalties are reported, paid and checked by audit.",p:["In consideration of the licence granted under this Agreement, {B} shall pay to {S} the Royalties in respect of all Licensed Products sold or otherwise disposed of by or on behalf of {B}.","Within thirty (30) days after the end of each Quarter, {B} shall deliver to {S} a statement showing the number and Net Sales Value of Licensed Products sold in that Quarter and the Royalties due, and shall pay the Royalties shown as due at the same time.","{B} shall keep accurate records of all sales of Licensed Products and shall permit {S}, on not less than ten (10) Business Days' notice and not more than once in any calendar year, to have those records inspected by an independent accountant."]},
"*supply-d":{t:"Supply of Products",e:"The terms on which the supplier sells products to the distributor for resale.",p:["{S} shall sell and {B} shall purchase the Products for resale in the Territory at the prices set out in {SC:prices}, less the discounts set out in that Schedule.","Each order for Products shall be governed by this Agreement to the exclusion of any other terms."]},
"*dob":{t:"Distributor's Obligations",e:"What the distributor must do to promote the products, and the compliance standards it must meet.",p:["{B} shall use reasonable endeavours to promote and sell the Products throughout the Territory.","{B} shall comply with all applicable laws, including the Bribery Act 2010, and shall not make any representation or give any warranty in respect of the Products beyond those given by {S} in writing."]},
"*appt-a":{t:"Appointment",e:"Appoints the agent and makes clear that it negotiates for the principal but cannot bind it.",p:["{B} appoints {S} as its commercial agent to negotiate the sale of the Products to Customers in the Territory on {B}'s behalf, and {S} accepts the appointment.","{S} shall have no authority to conclude contracts on behalf of {B}, or to bind {B} in any way, without {B}'s prior written consent."]},
"*comm":{t:"Commission",e:"How the agent's commission is earned and paid. The Regulations set minimum standards for timing and statements.",p:["{B} shall pay {S} the Commission on all orders for Products from Customers in the Territory accepted by {B} during the term of this Agreement, and on any transaction concluded after termination to which regulation 8 of the Regulations applies.","Commission shall become due in accordance with regulation 10 of the Regulations. {B} shall provide {S} with a statement of the Commission due no later than the last day of the month following the quarter in which it was earned, in accordance with regulation 12 of the Regulations."]},
"*sale":{t:"Sale and Purchase",e:"The core obligation: the seller sells and the buyer buys all the shares, with full ownership and nothing attached to them.",p:["On the terms of this Agreement, {S} shall sell and {B} shall purchase the Shares with full title guarantee, free from all Encumbrances and together with all rights that attach to them at Completion.","{B} shall not be obliged to complete the purchase of any of the Shares unless the purchase of all the Shares is completed simultaneously."]},
"*sale-a":{t:"Sale and Purchase",e:"The seller sells the business and its assets as a going concern, keeping anything that is expressly excluded.",p:["On the terms of this Agreement, {S} shall sell and {B} shall purchase, with effect from Completion, the Business as a going concern and the Assets, with full title guarantee and free from all Encumbrances.","The Excluded Assets and the Excluded Liabilities are excluded from the sale and shall remain the property and responsibility of {S}."]},
"*cons":{t:"Consideration",e:"The price, and how later payments between the parties affect it.",p:["The consideration for the Shares shall be the sum of £[●] (the “Consideration”), subject to adjustment in accordance with this Agreement, and shall be paid in cash at Completion.","Any payment made by {S} to {B} under this Agreement shall, so far as possible, be treated as a reduction in the Consideration."]},
"*cons-a":{t:"Consideration",e:"The price for the business and how it is split between the assets, which matters for tax.",p:["The consideration for the Business and the Assets shall be the sum of £[●] (the “Consideration”), subject to adjustment in accordance with this Agreement, apportioned in accordance with {SC:appo} and paid in cash at Completion.","Any payment made by {S} to {B} under this Agreement shall, so far as possible, be treated as a reduction in the Consideration."]},
"*tupe":{t:"Employees",e:"Confirms that employees transfer automatically to the buyer by law, and the seller's duties to provide information and consult.",p:["The parties acknowledge that the sale of the Business will constitute a relevant transfer for the purposes of the Transfer of Undertakings (Protection of Employment) Regulations 2006 (“TUPE”), and that the contracts of employment of the Employees will have effect after Completion as if originally made between {B} and each Employee.","{S} shall comply with its obligations under regulations 11 and 13 of TUPE in relation to employee liability information and to informing and consulting with representatives of affected employees."]},

const GUIDES = [
{id:"reading",t:"How to read a commercial agreement",cat:"Foundations",s:"The standard structure of an English law agreement, and where the commercial deal actually sits.",b:[
"Most agreements governed by English law follow the same pattern. They open with the date and the parties, then a short background section (the recitals), then the definitions, the operative clauses and the boilerplate, and they end with the signature blocks. Schedules at the back hold the deal-specific detail, such as prices, specifications or warranties.",
{h:"Where the deal lives"},
"The commercial bargain is in the operative clauses: what is supplied, the price, the promises each side makes, and what happens if things go wrong. The definitions matter just as much, because a single defined term can change the meaning of every clause that uses it. Always read a definition the first time you meet the capitalised word.",
{h:"Recitals and boilerplate"},
"Recitals explain the background and do not usually create obligations, though a court may use them to interpret an unclear clause. Boilerplate clauses at the end, such as entire agreement and notices, look routine but can decide a dispute. A termination notice sent to the wrong address can be invalid.",
{k:"When reviewing a draft, read the definitions, the liability clause and the termination clause first. Between them they decide most of the risk."}],c:["lol","tmb"]},

{id:"liability",t:"Limiting liability: caps, exclusions and the law that polices them",cat:"Risk",s:"How liability caps work, what cannot be excluded, and why consequential loss means less than people think.",b:[
"A limitation of liability clause sets the most a party can be made to pay. Most clauses combine three things: a list of liabilities that are never limited, a list of types of loss that cannot be claimed at all, and a financial cap on everything else.",
{h:"What you can never exclude"},
"Under the Unfair Contract Terms Act 1977, a business cannot exclude or limit liability for death or personal injury caused by negligence. Liability for a party's own fraud cannot be excluded either. Most clauses say this expressly, so that the rest of the clause is not attacked for overreaching.",
{h:"The reasonableness test"},
"Where one party deals on the other's written standard terms, any other exclusion or cap must be reasonable in the light of what the parties knew when they contracted. Courts look at bargaining strength, whether the cap relates to the contract value and whether insurance was available. Heavily negotiated clauses between sophisticated businesses are usually upheld.",
{h:"Consequential loss"},
"Under English law, indirect or consequential loss traditionally means only loss that does not arise naturally from the breach, the second limb of Hadley v Baxendale (1854). Excluding it therefore removes surprisingly little. If you want to exclude lost profits or lost data, you must name them expressly.",
{h:"Annual or aggregate caps"},
"A cap may apply per claim, per year or over the whole contract. An annual cap that resets each year gives the customer more protection over a long contract. Check whether the cap refers to charges paid or charges payable: in the first year, those figures can be very different.",
{k:"Read the cap together with the carve-outs. A low cap with uncapped data protection and confidentiality liability can be riskier for a supplier than a higher cap with none."}],c:["lol","ma-wlim"]},

{id:"indemnities",t:"Damages and indemnities: why the difference matters",cat:"Risk",s:"An indemnity is a promise to pay a defined loss. It works differently from a claim for breach of contract.",b:[
"When a party breaks a contract, the other party can claim damages. It must prove the breach, show that the breach caused its loss, show that the loss was not too remote, and show that it took reasonable steps to reduce the loss.",
"An indemnity is different. It is a promise to pay for a specified loss whenever it arises, whether or not there has been a breach. Depending on the wording, it may avoid arguments about remoteness and mitigation, and it can be drafted to cover legal costs in full.",
{h:"Why parties fight over indemnities"},
"An indemnity can be more valuable than a damages claim, so the party giving it usually wants it capped, limited to specific risks such as third-party IP claims, and subject to a claims process. The process normally requires prompt notice, no admissions and handing over conduct of the claim.",
{h:"Common traps"},
"Courts construe indemnities strictly. An indemnity against a party's own negligence must say so clearly. An indemnity for losses arising from any breach of contract can effectively turn every breach into an uncapped debt, so check how it interacts with the liability cap.",
{k:"If you rely on an indemnity, diarise the notice requirements. Late notice is one of the most common reasons an indemnity claim fails."}],c:["ind","lol","ma-tax"]},

{id:"warranties",t:"Warranties, representations and disclosure",cat:"Risk",s:"What a warranty is, how it differs from a representation, and how disclosure reduces a seller's exposure.",b:[
"A warranty is a contractual promise that a statement of fact is true. If it is not, the other party can claim damages for the loss caused, measured by putting it in the position it would have been in had the statement been true.",
"A representation is a statement that persuades someone to enter into a contract. If it is false, the Misrepresentation Act 1967 may allow the innocent party to rescind the contract or claim damages on a different basis. Sellers in share sales therefore usually insist that statements are given as warranties only, and that an entire agreement clause excludes reliance on anything else.",
{h:"Disclosure"},
"In an acquisition, the seller reduces its exposure by disclosing exceptions to the warranties in a disclosure letter. A matter is only properly disclosed if it is disclosed fairly, with enough detail for a reasonable buyer to understand its nature and scope. Whether a buyer can claim for a problem it already knew about is not settled by English law, so the agreement should say expressly.",
{h:"Warranties in supply contracts"},
"In contracts for goods and services, statute implies terms about description, quality, fitness for purpose and reasonable care and skill. Between businesses, these can be excluded only where the exclusion is reasonable. The implied term that the seller has the right to sell the goods can never be excluded.",
{k:"For a buyer, warranties are only as good as the limitations clause allows. Always read them together."}],c:["ma-disc","ma-wlim","war","war-s","lic-war"]},

{id:"termination",t:"Ending a contract: termination rights",cat:"Risk",s:"When a contract can be ended, the meaning of material breach, and the ban on terminating for insolvency.",b:[
"At common law, a party can end a contract only for a repudiatory breach: one that goes to the root of the contract or shows that the other party no longer intends to perform. That is a high bar, so most contracts add express termination rights.",
{h:"Material breach"},
"Express rights usually allow termination for a material breach. Material means serious, but less serious than repudiatory. Courts look at the breach in the context of the whole contract. A cure period gives the breaching party a chance to put things right first.",
{h:"Termination for convenience"},
"A right to terminate for convenience lets a party leave without any breach. Suppliers often ask for a minimum term or a termination fee in return, to protect their investment in the relationship.",
{h:"The insolvency rule"},
"Under the Corporate Insolvency and Governance Act 2020, a supplier generally cannot terminate a contract for the supply of goods or services, or demand payment of old debts as a condition of continuing, because the customer has entered an insolvency procedure such as administration (Insolvency Act 1986, section 233B). Insolvency termination clauses still work in favour of customers.",
{h:"Getting the mechanics right"},
"Termination is often lost on technicalities. Follow the notice clause precisely, give the cure period in full and do not keep performing as if nothing had happened, which can amount to affirming the contract.",
{k:"Before terminating, check the notice clause, any cure period and whether termination triggers a fee or exit obligations."}],c:["tmb","term","susp","agency-comp"]},

{id:"penalties",t:"Penalties, termination fees and service credits",cat:"Risk",s:"When a payment triggered by breach is unenforceable, and how to draft fees and credits that work.",b:[
"English law will not enforce a penalty. The test, set by Cavendish Square Holding v Makdessi [2015] UKSC 67, is whether a payment triggered by a breach imposes a detriment out of all proportion to any legitimate interest of the innocent party in performance. The old idea of a genuine pre-estimate of loss is no longer the test.",
{h:"What falls outside the rule"},
"The rule applies only to secondary obligations, triggered by breach. A fee payable for exercising a right, such as a fee to terminate for convenience, is a primary obligation and is generally outside the rule altogether.",
{h:"Service credits"},
"Service credits reduce the price when service levels are missed. Describing them as a price adjustment that reflects reduced value, and keeping them proportionate, helps them survive challenge. Say expressly whether they are the customer's only remedy.",
{h:"Late payment interest"},
"If a business contract has no substantial remedy for late payment, the Late Payment of Commercial Debts (Interest) Act 1998 implies interest at 8% above the Bank of England base rate. Agreeing a lower contractual rate is common, but the rate must still be a substantial remedy.",
{k:"Link any fixed payment on breach to a real commercial interest, and record that interest in the agreement."}],c:["term","sla","pay","price"]},

{id:"force-majeure",t:"Force majeure and frustration",cat:"Risk",s:"Relief for events outside a party's control depends entirely on what the contract says.",b:[
"English law has no general doctrine of force majeure. A party is excused from performing because of an outside event only if the contract says so, so the definition and the consequences need care.",
{h:"What a good clause covers"},
"A clause usually defines the qualifying events, requires the affected party to notify promptly and to mitigate, suspends the obligations affected, and allows termination if the event lasts too long. Customers often exclude supply chain failures and staff shortages, because the supplier should have planned for them.",
{h:"Reasonable endeavours to overcome"},
"In RTI v MUR Shipping [2024] UKSC 18, the Supreme Court held that a duty to use reasonable endeavours to overcome a force majeure event does not require a party to accept performance in a way the contract does not require, such as payment in a different currency.",
{h:"Frustration"},
"If there is no clause, the only fallback is frustration, which ends the contract automatically when an event makes performance impossible or radically different. Courts apply it narrowly. The Brexit vote did not frustrate a long lease (Canary Wharf v European Medicines Agency [2019] EWHC 335 (Ch)).",
{k:"Check whether payment obligations are suspended, and who carries the cost of the delay."}],c:["fm"]},

{id:"ip",t:"Who owns intellectual property created under a contract",cat:"Rights",s:"The default rules on ownership, and why written assignments and licences matter.",b:[
"The default rules surprise many clients. An employer owns copyright in work created by an employee in the course of employment (Copyright, Designs and Patents Act 1988, s.11(2)), and inventions are dealt with in a similar way under section 39 of the Patents Act 1977. A contractor or consultancy, by contrast, owns what it creates unless the contract says otherwise, even if the client paid for it.",
{h:"Assignments"},
"To transfer copyright, there must be a written assignment signed by the owner (s.90(3)). A promise to assign in the future is not the same as an assignment now, so clauses usually assign future rights in present terms. Moral rights, such as the right to be named as author, cannot be assigned but can be waived.",
{h:"Background and foreground"},
"Suppliers bring their own tools, code and methods, called background IPR. A common compromise is that the customer owns what is created specifically for it, while the supplier keeps its background IPR and grants the customer a licence to use whatever is built into the deliverables.",
{h:"Licences"},
"An exclusive licence excludes everyone, including the owner. A sole licence excludes other licensees but not the owner. A non-exclusive licence excludes nobody. An exclusive licensee of a patent can sue infringers in its own name (Patents Act 1977, s.67).",
{k:"If ownership matters, never rely on the default rules. Put a written assignment in the agreement."}],c:["ip","lic-scope","lic-imp","lic-war","ind"]},

{id:"confidentiality",t:"Confidentiality and NDAs",cat:"Rights",s:"What a confidentiality agreement protects, and the points that are actually negotiated.",b:[
"Confidential information is partly protected by the law of confidence even without a contract, but a written agreement makes the scope, duration and remedies clear and much easier to enforce.",
{h:"The points that matter"},
"The negotiation usually turns on five points: how broadly confidential information is defined; who it can be shared with (the representatives); the standard exceptions, such as information already public; how long the obligations last; and what happens to the information when talks end.",
{h:"Remedies"},
"The main remedy for a threatened leak is an injunction, because damages often cannot repair the harm. Agreements usually record that damages may not be an adequate remedy, which supports an application to court.",
{h:"Extras in M&A"},
"Sellers often add a non-solicitation covenant to stop bidders poaching staff they meet, and sometimes a standstill to stop a bidder buying shares in a listed target. These are restrictions of trade and must be reasonable to be enforceable.",
{k:"Check that the agreement allows disclosure to financiers and advisers. A bidder that cannot share information with its bank cannot complete a deal."}],c:["nda-def","nda-term","nda-return","nda-nonsol","conf"]},

{id:"data",t:"Data protection in contracts",cat:"Rights",s:"Controllers and processors, the terms Article 28 requires, and international transfers.",b:[
"Under the UK GDPR, a controller decides why and how personal data is processed. A processor processes it on the controller's behalf. A supplier running a system for a customer is usually a processor.",
{h:"Article 28 terms"},
"A controller must only use processors that give sufficient guarantees, and the contract between them must contain the terms listed in Article 28(3) UK GDPR. They include processing only on documented instructions, confidentiality, security measures, controls on sub-processors, assistance with data subject rights, deletion or return of data at the end, and audit rights. A general promise to comply with the law does not meet the requirement.",
{h:"International transfers"},
"Personal data may leave the UK only to a country covered by UK adequacy regulations, or with appropriate safeguards such as the International Data Transfer Agreement or the UK Addendum to the EU standard contractual clauses.",
{h:"Liability and enforcement"},
"Data subjects can claim compensation from controllers and processors (Article 82). The Information Commissioner can fine up to £17.5 million or 4% of worldwide annual turnover, whichever is higher. Customers therefore often push for data protection liability to sit outside the cap. The UK regime has been amended by the Data (Use and Access) Act 2025.",
{k:"Identify the role of each party first. The right contract terms depend on whether a party is a controller, a processor or a joint controller."}],c:["dp","exit"]},

{id:"price-mechanisms",t:"Share sales: price, conditions and earn-outs",cat:"Corporate",s:"Completion accounts and locked boxes, conditions to completion, retentions and earn-outs.",b:[
"In a share sale, the headline price usually assumes a business that is cash free and debt free with a normal level of working capital. There are two main ways to make sure the buyer pays for what it actually gets.",
{h:"Completion accounts"},
"Accounts are drawn up after completion, and the price is adjusted for the actual net debt and working capital. This is accurate but slower, and disputes over the accounts are common. The party that prepares the first draft has an advantage.",
{h:"Locked box"},
"The price is fixed by reference to a balance sheet at a date before signing. No adjustment is made afterwards, so the buyer is protected by a promise that no value has leaked out to the seller since the locked box date. Sellers like the certainty. Buyers must review the leakage definitions closely.",
{h:"Conditions and walk-away rights"},
"Completion may depend on conditions such as merger control or National Security and Investment Act 2021 clearance. Notification is mandatory in 17 sensitive sectors, and a deal completed without the required clearance is void. A material adverse change clause lets a buyer walk away if the target deteriorates, and is fiercely negotiated.",
{h:"Retentions and earn-outs"},
"A retention holds back part of the price as security for claims. An earn-out makes part of the price depend on future performance. Earn-outs often lead to disputes, because the buyer controls the business that generates the numbers, so the operating rules need to be written down.",
{k:"A locked box shifts risk to the buyer from the locked box date. Check what happens to trading profits in the gap before completion."}],c:["ma-price","ma-mac","ma-esc","ma-earn"]},

{id:"carve-outs",t:"Carve-outs and transitional services",cat:"Corporate",s:"Why a sold business needs services from its former group, and how a TSA allocates the risk.",b:[
"When a business is carved out of a larger group, it often depends on group systems and people for IT, payroll, finance, HR and premises. It cannot replace them all on day one, so the seller agrees to keep providing them for a limited period under a transitional services agreement.",
{h:"The services schedule"},
"The schedule of services is the heart of a TSA. Anything not listed is usually not provided. Work through every function the business uses, including things that are easy to forget such as software licences, shared mailboxes and access to historic data.",
{h:"Standard and price"},
"Sellers are not service businesses, so they resist a high standard and usually price services at or near cost. The common compromise is the same standard as before completion, at cost plus a small margin, with price increases if the buyer overruns.",
{h:"Third-party consents"},
"Many contracts, particularly software licences, only permit use within the licensee's group. Once the business leaves the group, the vendor's consent is needed, and vendors often charge for it. Allocate this cost expressly.",
{h:"Exit"},
"Agree a migration plan and timetable. Reverse TSAs, where the sold business provides services back to the seller, are common and need the same care.",
{k:"Start the TSA schedule early in the deal. It takes longer than the agreement itself."}],c:["tsa-scope","tsa-term","tsa-price","tsa-consent"]},

{id:"covenants",t:"Restrictive covenants: what courts will enforce",cat:"Corporate",s:"Non-competes, non-solicits and how English courts decide whether they are enforceable.",b:[
"A covenant that restricts someone from competing or from soliciting customers or staff is a restraint of trade. It is void unless it protects a legitimate interest, such as goodwill, customer connections or confidential information, and goes no further than reasonably necessary to do so.",
{h:"Business sales and employment"},
"Courts are more generous where restrictions are given by a seller on the sale of a business, because the buyer has paid for the goodwill. Employee restrictions are scrutinised more closely, particularly non-competes. Restrictions are judged as at the date they were agreed, not when they are enforced.",
{h:"Over-wide covenants"},
"A court will not rewrite a covenant to make it reasonable. It may remove words that can be cut out without changing the meaning of the rest (Tillman v Egon Zehnder [2019] UKSC 32). Drafting each restriction as a separate obligation helps.",
{h:"Practical drafting"},
"Tie restrictions to the employee's actual role, the clients they actually dealt with and a recent period, typically the last twelve months. Reduce post-employment restrictions by any period of garden leave. The government has consulted on reforming non-competes in employment contracts, so check the current position before relying on one.",
{k:"A shorter covenant that a court will enforce is worth more than a long one that it will not."}],c:["ma-rc","emp-rc","nda-nonsol","sha-res","sha-drag","sha-pre","emp-notice"]},

{id:"competition",t:"Competition law in commercial agreements",cat:"Rights",s:"Which restrictions in distribution and licensing agreements are lawful.",b:[
"The Competition Act 1998 prohibits agreements that restrict competition. Many restrictions in supply and distribution agreements are permitted under the Vertical Agreements Block Exemption Order 2022, provided the parties' market shares do not exceed 30%.",
{h:"Hardcore restrictions"},
"Some restrictions remove the benefit of the exemption entirely. They include fixing the price at which a distributor resells, and most restrictions on where or to whom a distributor may sell. A supplier may restrict active selling into territories reserved to other exclusive distributors, but generally cannot restrict passive sales made in response to unsolicited requests.",
{h:"Licensing"},
"In technology licensing, obligations to assign or exclusively license improvements back to the licensor, and restrictions on challenging the validity of the licensed rights, attract particular scrutiny.",
{h:"Consequences"},
"Restrictions that infringe the prohibition are void, and the Competition and Markets Authority can fine businesses up to 10% of worldwide turnover.",
{k:"Never include resale price maintenance. Recommended or maximum resale prices are generally acceptable."}],c:["dist-excl","lic-imp"]},

{id:"property",t:"Commercial leases: rent, repair, breaks and renewal",cat:"Property",s:"The clauses that decide the cost and flexibility of a commercial lease.",b:[
"A commercial lease is a long-term commitment, and its cost depends as much on the repair, review and alienation clauses as on the headline rent.",
{h:"Rent review"},
"Reviews may be to open market rent or by reference to an index such as CPI or RPI. Upward-only open market reviews remain common in England and mean the rent never falls. Indexed reviews are predictable but compound over time.",
{h:"Repair"},
"A full repairing lease makes the tenant responsible for the whole building. A covenant to put the premises into repair can require the tenant to improve them beyond their original condition. A schedule of condition limits the tenant to returning the premises as it found them. Damages for disrepair are capped at the fall in value of the landlord's interest (Landlord and Tenant Act 1927, s.18).",
{h:"Break clauses"},
"Courts apply break conditions strictly. A small arrear or failure to give vacant possession can defeat a break. A tenant has no automatic right to a refund of rent paid in advance for the period after the break date unless the lease provides one (Marks and Spencer v BNP Paribas [2015] UKSC 72).",
{h:"Security of tenure"},
"Under Part II of the Landlord and Tenant Act 1954, a business tenant can usually renew its lease at the end of the term. The parties can contract out, but only by completing the statutory notice and declaration before the tenant is committed.",
{h:"Formalities"},
"A lease for more than three years must be made by deed. A lease for more than seven years must be registered at HM Land Registry and must start with the prescribed clauses.",
{k:"For a tenant, the break conditions and the repair standard are often worth more negotiating time than the rent."}],c:["ls-rent","ls-break","ls-repair","ls-alien","ls-1954"]},

{id:"finance",t:"Loan agreements: covenants, defaults and prepayment",cat:"Finance",s:"How a facility agreement protects the lender, and where a borrower should push back.",b:[
"Most UK facility agreements are based on Loan Market Association documents. The commercial negotiation focuses on the financial covenants, the events of default and the cost of repaying early.",
{h:"Financial covenants"},
"Maintenance covenants require the borrower to stay within financial ratios, such as leverage, tested every quarter. Headroom between the covenant level and the business plan matters as much as the ratio itself. An equity cure lets shareholders inject money to fix a breach.",
{h:"Events of default"},
"An event of default lets the lender cancel the facility and demand immediate repayment. Borrowers negotiate grace periods, materiality thresholds and minimum amounts for cross-default. A material adverse change event of default gives the lender a broad discretion and is often resisted.",
{h:"Interest and prepayment"},
"Sterling loans now usually reference SONIA, the overnight rate published by the Bank of England, compounded over each interest period. Lenders seek prepayment fees to protect their expected return, ranging from a small soft call to a full make-whole payment.",
{k:"Model the covenants against a downside case before signing. Defaults are usually triggered by a tight covenant, not a missed payment."}],c:["fin-cov","fin-eod","fin-prepay"]},

{id:"disputes",t:"Governing law, courts and arbitration",cat:"Disputes",s:"Choosing English law, choosing a forum, and making sure a judgment can be enforced.",b:[
"The governing law decides how the contract is interpreted. The jurisdiction or arbitration clause decides where disputes are heard. They are separate choices, and both should be made expressly.",
{h:"English courts"},
"An exclusive jurisdiction clause in favour of the English courts gives certainty. English judgments can be enforced in many countries under the Hague Choice of Court Convention 2005 and, from 1 July 2025, the Hague Judgments Convention 2019. Enforcement elsewhere depends on local law, so check where the other party's assets are.",
{h:"Arbitration"},
"Arbitration is private, the parties choose the tribunal, and awards can be enforced in over 170 countries under the New York Convention. It is often preferred where the other party is overseas. Under the Arbitration Act 2025, the law of the seat governs the arbitration agreement unless the parties expressly agree otherwise.",
{h:"Asymmetric clauses"},
"An asymmetric clause limits one party to the English courts while allowing the other to sue anywhere. They are common in finance and are upheld by the English courts, but courts in some other countries have questioned them.",
{h:"Before going to court"},
"Escalation and mediation clauses encourage settlement. English courts can now order parties to engage in mediation or other dispute resolution (Churchill v Merthyr Tydfil County Borough Council [2023] EWCA Civ 1416).",
{k:"Choose the forum by asking where you would need to enforce a judgment, not where it would be convenient to sue."}],c:["gl","dr"]},

{id:"boilerplate",t:"Boilerplate clauses: what they actually do",cat:"Foundations",s:"The standard clauses at the end of every agreement, and when they make a difference.",b:[
"Boilerplate clauses are rarely negotiated, but they regularly decide disputes.",
{h:"Entire agreement"},
"Confirms that the written agreement is the whole deal, so that earlier emails and discussions cannot add terms. Combined with a non-reliance statement, it also helps exclude claims for misrepresentation, although liability for fraud can never be excluded.",
{h:"Variation"},
"Requires changes to be in writing and signed. The Supreme Court has confirmed that such a clause is effective, so an oral agreement to vary will not usually bind the parties (Rock Advertising v MWB Business Exchange Centres [2018] UKSC 24).",
{h:"Third party rights"},
"Under the Contracts (Rights of Third Parties) Act 1999, a third party can enforce a term that purports to benefit it. Most agreements exclude this, then give rights expressly to anyone who should have them, such as group companies under an indemnity.",
{h:"Notices"},
"Sets out how formal notices must be served and when they are treated as received. Many termination disputes turn on whether a notice was validly served, so follow the clause exactly.",
{h:"Severance and counterparts"},
"Severance keeps the rest of the agreement alive if one provision is invalid. Counterparts allows each party to sign a separate copy.",
{k:"Check the notices clause before any important deadline. Email is valid only if the clause allows it."}],c:["asg"]},

{id:"endeavours",t:"Best, all reasonable and reasonable endeavours",cat:"Foundations",s:"How much effort each endeavours obligation requires under English law.",b:[
"Endeavours clauses are used when a party cannot guarantee a result but commits to trying. The wording sets how hard it must try.",
{h:"Best endeavours"},
"The most onerous. A party must take all the reasonable steps it can to achieve the objective, and may have to act against its own commercial interests, although not to the point of ruin.",
{h:"All reasonable endeavours"},
"A middle standard. It may require some sacrifice of a party's own commercial interests (Rhodia International Holdings v Huntsman International [2007] EWHC 292 (Comm)), but less than best endeavours.",
{h:"Reasonable endeavours"},
"The lightest standard. A party can balance the objective against its own commercial interests and need take only one reasonable course of action.",
{k:"The meaning depends on context, so where it matters, list the specific steps a party must take or need not take."}],c:["tsa-scope","sla"]},

{id:"execution",t:"Signing agreements and deeds",cat:"Foundations",s:"How agreements and deeds are validly signed under English law, including electronic signatures.",b:[
"A simple contract needs an offer, acceptance, consideration and an intention to create legal relations. It can usually be signed in any way, including electronically.",
{h:"Deeds"},
"A deed does not need consideration, has a twelve-year limitation period instead of six (Limitation Act 1980, ss.5 and 8), and is required for some documents, including leases of more than three years and powers of attorney. An individual's signature on a deed must be witnessed.",
{h:"Companies"},
"A company can sign a document by two authorised signatories (two directors, or a director and the company secretary), or by one director in the presence of a witness (Companies Act 2006, s.44).",
{h:"Electronic signatures"},
"Electronic signatures are valid under English law for most documents, as the Law Commission confirmed in 2019. Some registries, such as HM Land Registry, have their own requirements. Witnessed deeds still need the witness to be physically present.",
{k:"For a deed, check that it states on its face that it is executed as a deed and that every signature is properly witnessed."}],c:[]}
];

Object.assign(C,{
"rel-scope":{t:"Scope of Release",g:["carve-outs"],
 d:"Which claims between the sold company and the seller's retained group are wiped out at completion.",
 n:"Under Bank of Credit and Commerce International SA v Ali [2001] UKHL 8, a general release only covers claims the parties did not know about if the words make that clear. That is why the wider releases refer to unknown claims expressly.",
 o:[
 ["Full release by the Seller Group",-2,["With effect from Completion, {S}, for itself and on behalf of each other member of the Seller Group, irrevocably and unconditionally releases and discharges each member of the Target Group from all claims, liabilities and obligations of any nature, whether present or future, actual or contingent, known or unknown and whether or not in the contemplation of the parties at the date of this Agreement, and whether arising in contract, tort (including negligence), under statute or otherwise, which any member of the Seller Group has or may have against any member of the Target Group in respect of any matter arising on or before Completion (the “Released Claims”).","{S} shall not, and shall procure that no other member of the Seller Group shall, bring or pursue any proceedings in respect of a Released Claim, and shall indemnify each member of the Target Group against all losses, costs and expenses arising from any such proceedings.","Nothing in this clause {N} releases any obligation under the SPA or any other document entered into under it or in the agreed form under it (the “Transaction Documents”)."],
  "The company leaves the group with a clean slate. Nothing from the past can come back from the seller's side.","A one-way release. Your group gives up every claim against the company, including ones you do not yet know about."],
 ["Mutual release of intra-group liabilities",0,["With effect from Completion, {S} (for itself and on behalf of each other member of the Seller Group) and {B} (for itself and on behalf of each other member of the Target Group) each irrevocably releases and discharges the members of the other group from all claims and liabilities of any nature, whether known or unknown and whether or not in the contemplation of the parties at the date of this Agreement, which it or any member of its group has or may have against any member of the other group in respect of any matter arising on or before Completion, other than the Excluded Liabilities.",["In this clause {N}, “Excluded Liabilities” means:",["the Intra-Group Balances, which shall be settled in accordance with {R:*settle};","any obligation under the SPA or any other document entered into under it or in the agreed form under it; and","any obligation under the agreements listed in Part 3 of {SC:intra}, which shall continue in force after Completion."]]],
  "The market position. Both groups walk away from the past, with the deal documents and listed contracts kept alive.","The market position. A clean break both ways, keeping the obligations you still need."],
 ["Listed liabilities only",2,["With effect from the settlement of each Intra-Group Balance in accordance with {R:*settle}, the party to which it was owed releases the party which owed it from that Intra-Group Balance.","Nothing in this Agreement releases any other claim or liability between any member of the Seller Group and any member of the Target Group, whether arising before or after Completion."],
  "Only the listed balances are released. Your group may still face claims from the seller's side about the past.","You keep every claim not expressly released, and give up nothing you have not priced."]]},

"rel-guar":{t:"Group Guarantees",g:["carve-outs"],
 d:"Getting the sold company out of guarantees and security it gave for the seller's group, and the reverse.",
 n:"Bank facilities and leases are the usual problem. A lender or landlord does not have to agree to a release, so promises to procure a release are often backed by an indemnity until it is obtained.",
 o:[
 ["Released at Completion, with indemnity",-2,["{S} shall procure that, at or before Completion and without cost to any member of the Target Group, each member of the Target Group is released from each Group Guarantee given by it in respect of any obligation of a member of the Seller Group.","Until each such release is obtained, {S} shall indemnify each member of the Target Group against all liabilities, costs and expenses arising under or in connection with the relevant Group Guarantee.","No member of the Target Group shall be under any obligation to procure the release of any Group Guarantee given by a member of the Seller Group."],
  "The company leaves free of the group's guarantees, and is covered if any release is late.","You must deliver releases that depend on lenders and landlords, and you carry the cost of your own guarantees."],
 ["Reasonable endeavours each way, with indemnity",0,["Each of {S} and {B} shall use all reasonable endeavours to procure, with effect from Completion, the release of each member of its group from each Group Guarantee given in respect of an obligation of a member of the other group.","Until a Group Guarantee is released, the party whose group benefits from it shall indemnify the other party and the members of its group against all liabilities, costs and expenses arising under or in connection with it, and shall procure that the obligations guaranteed are not extended, increased or varied."],
  "The market position. Both sides work to unwind guarantees, and each covers the other until they are released.","The market position. Even-handed, and your exposure is covered by an indemnity in the meantime."],
 ["Reasonable endeavours only",2,["Each of {S} and {B} shall use reasonable endeavours to procure the release of each member of its group from each Group Guarantee given in respect of an obligation of a member of the other group.","Neither party shall be liable if, having complied with this clause {N}, a release is not obtained."],
  "If a lender or landlord refuses, the company is left guaranteeing the seller's debts with no protection.","A soft obligation that you can meet without guaranteeing an outcome."]]},

"ipa-war":{t:"Title Guarantee and Warranties",g:["ip","carve-outs"],
 d:"What the assignor promises about its ownership of the rights being assigned.",
 n:"Under the Law of Property (Miscellaneous Provisions) Act 1994, an assignment with full title guarantee implies promises that the assignor has the right to assign and that the rights are free from charges it does not and could not reasonably know about. A limited title guarantee only covers charges the assignor created itself.",
 o:[
 ["Full title guarantee and full warranties",-2,["The assignment in {R:*assign-ip} is made with full title guarantee.",["{S} warrants to {B} that:",["it is the sole legal and beneficial owner of the Assigned IPR, free from any licence, charge or other encumbrance;","each of the registered Assigned IPR is subsisting, valid and enforceable, and all renewal and maintenance fees due in respect of it have been paid;","the use of the Assigned IPR in the Business does not infringe, and has not in the six (6) years before the date of this Deed infringed, the rights of any third party; and","no claim has been made or threatened challenging the validity of, or {S}'s title to, any of the Assigned IPR."]]],
  "Strong promises on ownership, validity and infringement, backed by the statutory covenants.","You stand behind the validity of registrations and the clean history of the rights."],
 ["Full title guarantee, title and no known challenges",0,["The assignment in {R:*assign-ip} is made with full title guarantee.","{S} warrants to {B} that it is the legal and beneficial owner of the Assigned IPR and that, so far as {S} is aware, no claim has been made challenging the validity of, or its title to, any of the Assigned IPR, and the use of the Assigned IPR in the Business does not infringe the rights of any third party."],
  "The market position. Firm on ownership, with validity and infringement limited to what the assignor knows.","The market position. You promise what you know, not the validity of every registration."],
 ["Limited title guarantee only",2,["The assignment in {R:*assign-ip} is made with limited title guarantee.","Save for the covenants implied under Part I of the Law of Property (Miscellaneous Provisions) Act 1994 by reason of the assignment being made with limited title guarantee, {S} gives no warranty or undertaking in respect of the Assigned IPR, which {B} accepts in their present condition."],
  "Very little protection if the rights turn out to be owned by someone else or invalid.","Minimal exposure. You only promise you have not charged the rights yourself."]]},

"lt-prevail":{t:"Relationship with the Main Agreement",g:["carve-outs"],
 d:"Whether claims can be brought under the local transfer agreement, or only under the main agreement and its limits.",
 n:"Local transfer agreements are short forms that local law requires to pass title. The risk is that a buyer sues under the local agreement to get round the caps and time limits in the main agreement, which is why sellers insist it adds no new rights.",
 o:[
 ["Local claims stand alone",-2,["The rights and remedies of {B} under this Agreement are in addition to its rights and remedies under the Main Agreement. {B} may bring any claim in respect of the Local Assets under this Agreement or the Main Agreement, at its election.","No limitation of liability in the Main Agreement shall apply to a claim under this Agreement unless this Agreement expressly provides that it does.","If there is any conflict between this Agreement and the Main Agreement in relation to the transfer of the Local Assets, this Agreement shall prevail."],
  "Two routes to a claim, and the main agreement's limits do not follow you to the local one.","The local agreement could become a back door around the caps and time limits you negotiated."],
 ["Local claims subject to main limits",0,["This Agreement is entered into solely to give effect, under the laws of the Territory, to the transfer of the Local Assets under the Main Agreement. Any claim in respect of the Local Assets shall be brought under the Main Agreement and shall be subject to the limitations set out in it, as if this Agreement formed part of it.","If there is any conflict between this Agreement and the Main Agreement, the Main Agreement shall prevail as between the parties, save to the extent that the laws of the Territory require otherwise."],
  "The market position. You keep all your rights, through the main agreement.","The market position. One set of limits applies however the claim is framed."],
 ["Main Agreement governs all claims",2,["This Agreement is entered into solely to implement the transfer of the Local Assets. No party shall bring any claim under this Agreement, and all rights and remedies in respect of the Local Assets arise exclusively under, and are subject to the terms and limitations of, the Main Agreement.","If {B} or any member of its group brings a claim under this Agreement in breach of this clause {N}, {B} shall indemnify {S} against all costs it incurs in connection with that claim, and any amount recovered shall be treated as recovered under the Main Agreement and shall count towards the limitations in it.","If there is any conflict between this Agreement and the Main Agreement, the Main Agreement shall prevail."],
  "No claims locally, with a costs indemnity if one is brought.","Complete protection for the limits in the main agreement."]]}
});

Object.assign(F,{
"*settle":{t:"Settlement of Intra-Group Balances",g:["carve-outs"],e:"Sets out how the money owed between the sold company and the seller's group is paid off or written off at completion.",p:["Each Intra-Group Balance shall be settled on Completion by the method specified against it in Part 1 of {SC:intra}, being payment in cash, set-off against another Intra-Group Balance, release or capitalisation.","Any Intra-Group Balance which is not listed in Part 1 of {SC:intra} shall be settled on Completion by payment in cash, in full, by the party owing it to the party to which it is owed.","The parties shall co-operate in good faith to settle the Intra-Group Balances in a manner which is efficient for tax purposes, and shall consider any steps reasonably proposed by either of them for that purpose.","Each party shall, and shall procure that each member of its group shall, do all things reasonably required to give effect to this clause {N}."]},

"*assign-ip":{t:"Assignment",g:["ip"],e:"The operative transfer of the rights, including the right to sue for past infringements, which does not pass automatically.",p:[["In consideration of the payment by {B} to {S} of £[●] (the receipt and sufficiency of which {S} acknowledges), {S} assigns to {B} absolutely all its right, title and interest in and to the Assigned IPR, together with:",["all goodwill attaching to any of the Assigned IPR which is a trade mark;","the right to bring, make, oppose, defend and appeal proceedings, claims or actions, and to obtain relief and retain any damages or other sums recovered, in respect of any infringement of any of the Assigned IPR, whether occurring before, on or after the date of this Deed; and","all rights to apply for registration of, and to claim priority from, any of the Assigned IPR."]],"{S} shall use reasonable endeavours to procure that each author of any copyright work comprised in the Assigned IPR irrevocably and unconditionally waives all moral rights in it, to the extent permitted by law."]},
"*recordal":{t:"Recordal and Further Assurance",g:["ip"],e:"Registers the new owner and makes the assignor help complete the transfer. Record promptly: under the Trade Marks Act 1994 and the Patents Act 1977, a new owner who registers late may be unable to recover its costs of infringement proceedings for the period before registration.",p:["{S} shall, at {B}'s cost, promptly execute all documents and do all things that {B} reasonably requires to record {B} as the proprietor of each of the registered Assigned IPR at the relevant registries, and otherwise to give full effect to this Deed.","Until each of the registered Assigned IPR is recorded in the name of {B}, {S} shall hold it on trust for {B}, and shall not do or omit to do anything which might prejudice it.","{S} shall, within ten (10) days after the date of this Deed, deliver to {B} all files, documents and correspondence in its possession or control relating to the prosecution, maintenance and enforcement of the Assigned IPR."]},
"*lt-transfer":{t:"Transfer",g:["carve-outs"],e:"Transfers the local assets under local law. The price is already paid under the main agreement, so nothing extra changes hands.",p:["With effect from Completion, {S} transfers to {B}, and {B} accepts the transfer of, the Local Assets, in accordance with the Main Agreement.","The Local Consideration shall be satisfied by the payment of the consideration under the Main Agreement, and no further amount shall be payable under this Agreement. Each party shall report the Local Consideration consistently for all tax purposes.","Each party shall do all things required under the laws of the Territory to perfect the transfer of the Local Assets, including making any registration or filing."]},
"*lt-law":{t:"Governing Law and Disputes",e:"The local agreement is governed by local law so that title passes, but disputes go through the main agreement's procedure.",p:["This Agreement and any non-contractual obligations arising out of or in connection with it shall be governed by the laws of the Territory.","Any dispute arising out of or in connection with this Agreement shall be resolved in accordance with the dispute resolution provisions of the Main Agreement, which shall apply to this Agreement as if set out in full, save to the extent that the laws of the Territory require otherwise."]},
"*rsvc":{t:"Reverse Services",g:["carve-outs"],e:"The sold business keeps supporting the seller's retained businesses for a short time, usually because people or systems moved with it.",p:["{S} shall provide the Services to {B} and the members of its group, for the purposes of the Retained Business only.","{S} shall provide each Service with the same scope, and to the same standard of care, as it was provided to the Retained Business during the twelve (12) months before Completion.","{S} shall not be required to provide any Service in a manner which would require it to engage additional personnel, acquire new systems, breach any agreement with a third party or breach any applicable law.","{B} shall use the Services only for the Retained Business, and in accordance with {S}'s reasonable policies notified to it in writing."]},
"*rterm":{t:"Service Period and Migration",g:["carve-outs"],e:"How long each reverse service lasts and how the seller moves off it.",p:["Each Service shall be provided from Completion until the end of the period specified for it in {SC:rsvc} or, if none is specified, for six (6) months (its “Service Period”).","{B} may terminate any Service before the end of its Service Period by giving {S} not less than thirty (30) days' written notice, and the Charges shall be reduced accordingly.","{B} shall use reasonable endeavours to migrate each Service to its own arrangements before the end of its Service Period, and {S} shall give it reasonable assistance in doing so."]}
