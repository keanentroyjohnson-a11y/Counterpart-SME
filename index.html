Object.assign(F,{
"*sowp":{t:"Statements of Work",e:"How individual projects are agreed under the framework, and which document wins if they conflict.",p:["{B} may from time to time request {S} to provide services by issuing a draft Statement of Work. No Statement of Work shall be binding until it has been signed by an authorised representative of each party.","Each signed Statement of Work forms a separate contract incorporating the terms of this Agreement. {S} shall have no obligation to agree any Statement of Work, and {B} shall have no obligation to request any minimum volume of services.",["If there is any conflict between the documents forming a contract, they shall take priority in the following order:",["the clauses of this Agreement;","the Statement of Work, save that a Statement of Work shall prevail over this Agreement, for the purposes of that Statement of Work only, where it identifies the clause it varies and states expressly that it is intended to prevail; and","the Schedules to this Agreement."]],"The termination or expiry of a Statement of Work shall not affect this Agreement or any other Statement of Work."]},
"*chgc":{t:"Change Control",e:"Nothing about the scope or price changes unless both sides sign a change note. This stops scope creep and disputes about what was agreed.",p:["Either party may propose a Change by giving the other a Change Request describing the Change and the reason for it.","Within ten (10) Business Days after receiving or making a Change Request, {S} shall give {B} a written assessment of its effect on the Services, the timetable, the Charges and any other term of the relevant Statement of Work.","No Change shall take effect unless it is recorded in a written change note signed by an authorised representative of each party. Until then, {S} shall continue to perform the Services as if the Change Request had not been made.","{S} shall not refuse a Change requested by {B} which is reasonably required to comply with a change in applicable law, but any adjustment to the Charges for that Change shall be agreed in accordance with this clause {N}."]},
"*keyp":{t:"Key Personnel",e:"You often hire a consultancy for particular people. This keeps them on the job unless you agree otherwise.",p:["{S} shall ensure that the Key Personnel are available to perform the Services for the time reasonably required, and shall not remove or replace any of them without {B}'s prior written consent (not to be unreasonably withheld), save in the case of illness, death, resignation or termination of employment for cause.","Where any of the Key Personnel is to be replaced, {S} shall propose a replacement of at least equivalent experience and skill, and shall bear the cost of any handover.","{B} may, on reasonable grounds, require {S} to remove any individual from the provision of the Services, and {S} shall promptly replace that individual."]},
"*indep":{t:"Status of the Consultant",e:"Makes clear the consultant's people are not your employees, and puts their tax on the consultant. Where an individual works through their own company, the off-payroll working rules may apply.",p:["{S} is an independent contractor. Nothing in this Agreement shall make {S}, or any of its personnel, an employee, worker or agent of {B}, or create a partnership between the parties.","{S} shall be responsible for, and shall indemnify {B} against, all income tax, national insurance contributions and other employment-related liabilities, and all claims for employment rights, arising in respect of {S}'s personnel in connection with the Services, save to the extent caused by {B}'s own breach of applicable law.","Where the off-payroll working rules in Chapter 10 of Part 2 of the Income Tax (Earnings and Pensions) Act 2003 apply to any individual providing the Services through an intermediary, the parties shall co-operate to comply with them, and {B} shall issue any status determination statement those rules require."]},
"*prof":{t:"Professional Standards and Insurance",e:"Sets the professional standard of care, requires insurance that outlasts the contract, and deals with conflicts of interest.",p:["{S} shall perform the Services with the skill, care and diligence to be expected of a competent and appropriately qualified member of its profession, and in compliance with the rules of any professional or regulatory body by which it is regulated.","{S} shall maintain, during the term of this Agreement and for six (6) years after its termination or expiry, professional indemnity insurance with a reputable insurer for not less than £[●] for each claim, and shall provide evidence of that insurance on request.","{S} shall notify {B} promptly of any conflict of interest which arises in connection with the Services, and shall take such steps as {B} reasonably requires to manage it."]},
"*reli":{t:"Reliance on Advice",e:"Only the client can rely on the advice, which protects the adviser from claims by people it never agreed to advise.",p:["The Deliverables and any advice given under this Agreement are provided for the benefit of {B} only, and for the purpose for which they were requested.","No other person may rely on them unless {S} has agreed in writing, and {S} shall have no liability to any other person in respect of them.","{B} may disclose the Deliverables, on a non-reliance basis, to its group companies, professional advisers, auditors and regulators, and as required by law."]},
"*site":{t:"Site Rules and Health and Safety",e:"The contractor follows your site rules and carries the health and safety duties for its own work.",p:["{S} shall comply, and shall ensure that its personnel comply, with {B}'s site rules, security procedures and health and safety policies at each Site as notified to it from time to time.","{S} shall carry out, keep under review and provide to {B} on request suitable and sufficient risk assessments for the Services, and shall comply with all health and safety legislation applicable to the Services, including the Health and Safety at Work etc. Act 1974.","{S} shall report to {B} immediately any accident, dangerous occurrence or near miss at a Site in connection with the Services, and shall co-operate with any investigation.","Access to each Site is given by way of licence only, and {S} shall not acquire any interest in any Site."]},
"*tupesv":{t:"Employees (TUPE)",e:"When services move to or from a contractor, the staff doing the work may transfer automatically under TUPE. This clause allocates the cost of staff who transfer at the start and at the end.",p:TUPE_P},
"*approv":{t:"Approval of Materials",e:"Nothing goes out, and no media money is spent, without your sign-off. The agency clears third party rights such as music and images.",p:["{S} shall submit all Materials to {B} for approval before publication. {B} shall approve or reject them, giving reasons for any rejection, within five (5) Business Days after receipt.","{S} shall not publish any Materials, or commit {B} to any media expenditure, without {B}'s prior written approval. Approval by {B} shall not relieve {S} of its obligations under this Agreement.","{S} shall obtain all consents, licences and releases required for the use of any third party material, music, image, likeness or voice in the Materials, for the media, territories and period approved by {B}, and shall provide copies on request."]},
"*adcode":{t:"Advertising Compliance",e:"Marketing must comply with the advertising codes and consumer law. The Competition and Markets Authority can now fine businesses directly for unfair consumer practices under the Digital Markets, Competition and Consumers Act 2024.",p:["{S} shall ensure that all Materials comply with applicable law, including the Digital Markets, Competition and Consumers Act 2024, and with the UK Code of Non-broadcast Advertising and Direct & Promotional Marketing and the UK Code of Broadcast Advertising, as applicable.","{B} shall be responsible for the accuracy of the factual claims about its products and services that it gives to {S}, and shall supply evidence substantiating them on request.","{S} shall notify {B} promptly of any complaint or investigation by the Advertising Standards Authority or any regulator relating to the Materials, and the parties shall co-operate in responding to it."]},
"*sla":{t:"Service Levels and Service Credits",e:"Measurable service levels with credits for failure. Framing credits as a price adjustment helps, but after Cavendish Square Holding v Makdessi [2015] UKSC 67 any payment on breach must protect a legitimate interest and not be out of all proportion to it.",p:SLA_P},
"*secur":{t:"Security and Business Continuity",e:"Security standards, fast notice of incidents, a tested disaster recovery plan and a right to audit.",p:["{S} shall maintain, and comply with, an information security management system for the Services which meets the requirements of ISO/IEC 27001 or an equivalent standard, and shall promptly remedy any non-conformity identified in an audit.","{S} shall notify {B} without undue delay, and in any event within twenty-four (24) hours, after becoming aware of any security incident affecting {B}'s systems or data, and shall take all reasonable steps to contain and remedy it.","{S} shall maintain, and test at least annually, a business continuity and disaster recovery plan for the Services approved by {B} (acting reasonably), and shall implement it on the occurrence of any disaster.","{B} may, on reasonable notice and not more than once in any twelve (12) months save following a security incident, audit {S}'s compliance with this clause {N}."]},
"*oss":{t:"Open Source Software",e:"Stops the developer building in open source code that could force you to publish your own code or give it away.",p:["{S} shall not incorporate any open source software into the Deliverables without {B}'s prior written consent, having given details of the software and the licence under which it is made available.","{S} shall not in any event incorporate open source software in a manner that would require any part of the Deliverables to be disclosed or distributed in source code form, or licensed free of charge, to any third party."]},
"*handover":{t:"Source Code and Handover",e:"You receive the source code and what is needed to maintain it, so you are not locked in to the developer.",p:["{S} shall deliver to {B} the source code of the Deliverables, together with the build scripts, documentation and other materials reasonably required for a competent programmer to understand, maintain and develop them, on each delivery and on acceptance.","On termination or expiry of this Agreement for any reason, {S} shall deliver to {B} all source code and materials referred to in clause {N}.1 in their then current form, and shall give such reasonable assistance as {B} requests to transfer the development to {B} or a replacement supplier, at {S}'s then current rates."]},
"*suplev":{t:"Support Levels",e:"How quickly faults must be answered and fixed, by severity.",p:["{S} shall provide a helpdesk, available by telephone and email during Business Hours, for {B} to report faults.",["{S} shall classify each fault reported in good faith, and shall respond to it, and use all reasonable endeavours to resolve it, within the following times:",["Severity 1 (the system is unavailable or materially unusable): response within one (1) hour, and resolution or a workaround within four (4) hours;","Severity 2 (a major function is impaired and there is no workaround): response within four (4) hours, and resolution or a workaround within one (1) Business Day; and","Severity 3 (any other fault): response within one (1) Business Day, and resolution in the next scheduled release."]],"{S} shall provide to {B}, at no additional charge, all updates, patches and new releases of the supported software that it makes generally available to its customers."]},
"*supexcl":{t:"Exclusions from Support",e:"Faults the supplier does not have to fix for free, usually because the customer caused them.",p:[["{S} shall have no obligation to provide support for any fault caused by:",["any modification of the supported software not made or authorised by {S};","use of the supported software other than in accordance with its documentation, or on hardware or with software not approved by {S}; or","{B}'s failure to implement any update or patch provided by {S} within a reasonable time."]],"{S} may provide support for an excluded fault at {B}'s request, at {S}'s then current time and materials rates."]},
"*ltsarel":{t:"Relationship with the Transitional Services Agreement",e:"Services move from the short-term TSA to this long-term contract without a gap, and the price is reviewed each year.",p:["Where a service is provided under the Transitional Services Agreement immediately before the Effective Date and is described in {SC:svc}, it shall from the Effective Date be provided under this Agreement instead, without interruption and to at least the same standard.","Nothing in this Agreement affects any accrued right or liability under the Transitional Services Agreement.","The parties shall review the Charges each year in good faith, by reference to the cost of providing the Services and to market rates for comparable services. Failing agreement, the Charges shall increase by the percentage increase in the consumer prices index published by the Office for National Statistics over the preceding twelve (12) months."]},
"*govn":{t:"Governance",e:"Regular meetings between relationship managers keep a long-term arrangement working.",p:["Each party shall appoint a relationship manager. The relationship managers shall meet at least quarterly to review the performance of the Services, forecast demand and consider any proposed changes.","No change to the Services or the Charges shall be effective unless agreed in writing by both relationship managers."]},
"*patmaint":{t:"Prosecution, Maintenance and Enforcement",e:"Who keeps the patents alive and who sues infringers. Competition law treats a clause stopping the licensee from challenging validity with suspicion, so this draft does not include one. Take advice before adding one.",p:["{S} shall, at its own cost, prosecute and maintain the Licensed IPR, and shall keep {B} informed of each material step in the prosecution of any application. {S} shall not abandon any of the Licensed IPR without giving {B} not less than sixty (60) days' notice and the opportunity to take it over at {B}'s cost.","Each party shall notify the other promptly on becoming aware of any infringement or threatened infringement of the Licensed IPR in the Territory, or of any challenge to its validity.","{S} shall have the first right to take action against any infringement, at its own cost and for its own benefit. If {S} does not do so within sixty (60) days after a written request from {B}, {B} may take action in its own name, and {S} shall join as a party if required, at {B}'s cost."]},
"*qc":{t:"Quality Control",e:"A trade mark owner must control how licensees use its mark. A mark used without control can become misleading, which can lead to its revocation under the Trade Marks Act 1994.",p:["{B} shall ensure that all Licensed Products, and their packaging and promotional materials, are of a quality at least equal to the samples approved by {S}, and comply with the Brand Guidelines and all applicable laws.","Before selling any new Licensed Product, {B} shall submit samples of it and its packaging to {S} for approval, which {S} shall not unreasonably withhold or delay.","{S} and its representatives may, on reasonable notice, inspect any premises at which Licensed Products are made or stored, and {B} shall supply reasonable quantities of Licensed Products free of charge for quality testing."]},
"*tmuse":{t:"Use of the Trade Marks",e:"The licensee uses the marks as directed, and all goodwill builds up for the owner.",p:["{B} shall use the Licensed IPR only in the form and manner set out in the Brand Guidelines, and shall mark the Licensed Products with such notices of {S}'s ownership as {S} reasonably requires.","All use of the Licensed IPR by {B} shall enure for the benefit of {S}. {B} shall not apply to register, or use, any trade mark, company name or domain name consisting of or confusingly similar to any of the Licensed IPR.","{B} shall not do anything which might bring the Licensed IPR into disrepute, or invalidate or diminish them.","{S} shall, at {B}'s cost, record {B} as a licensee of the registered Licensed IPR if {B} reasonably requests."]},
"*khdisc":{t:"Disclosure and Technical Assistance",e:"Know-how is only useful if it is handed over properly. This sets what is disclosed and what help follows.",p:["Within thirty (30) days after the Effective Date, {S} shall disclose the Know-How to {B} in written or electronic form, in sufficient detail to enable a competent person skilled in the relevant field to use it.","At {B}'s request, {S} shall provide up to [●] days of technical assistance each year by suitably qualified personnel, at {S}'s then current daily rates plus reasonable expenses."]},
"*khconf":{t:"Confidentiality of the Know-How",e:"Know-how is protected only while it stays secret, so this is the clause that keeps the licence valuable.",p:["{B} shall keep the Know-How confidential, shall use it only for the purposes of this Agreement, and shall disclose it only to those of its employees and subcontractors who need to know it and are bound by written obligations of confidence no less strict than this clause {N}.","This clause {N} does not apply to Know-How which is or becomes generally available to the public other than through a breach of this Agreement, or which {B} can show was lawfully in its possession before disclosure by {S}.","The obligations in this clause {N} shall survive the termination or expiry of this Agreement for so long as the Know-How remains confidential.","On termination or expiry of this Agreement, {B} shall cease to use the Know-How, save to the extent it has entered the public domain, and shall return or destroy all documents containing it."]},
"*swgrant":{t:"Licence",e:"What the customer may do with the software. Some rights, such as making a back-up copy, cannot be excluded by contract.",p:["{S} grants to {B} a non-exclusive, non-transferable licence for the Term to install and use the Software and the Documentation for the internal business purposes of {B} and its group companies, by the Authorised Users.","{B} may make such copies of the Software as are reasonably necessary for back-up, testing and disaster recovery purposes.",["Save as permitted by this Agreement or by sections 50A to 50C or section 296A of the Copyright, Designs and Patents Act 1988, {B} shall not:",["copy, modify, adapt or translate the Software;","decompile, disassemble or reverse engineer the Software; or","sub-license, rent, lend or otherwise make the Software available to any third party, including on a bureau or service basis."]]]},
"*swfee":{t:"Licence Fee",e:"When the fee is paid and how extra users are charged.",p:["{B} shall pay the Licence Fee within thirty (30) days after the date of {S}'s invoice, which {S} may issue on or after the Effective Date.","If {B} wishes to increase the number of Authorised Users, it shall notify {S} and pay the additional fee calculated at {S}'s list price then in force, less the discount set out in {SC:swspec}.","All sums are exclusive of VAT, which {B} shall pay in addition at the applicable rate on receipt of a valid VAT invoice."]},
"*swaudit":{t:"Records and Audit",e:"Software licence audits are a frequent source of unexpected cost. This limits how often they happen and who pays.",p:["{B} shall keep a record of the number of Authorised Users and the locations at which the Software is installed, and shall provide it to {S} on request, not more than once in any twelve (12) months.","{S} may, on not less than thirty (30) days' notice and not more than once in any twelve (12) months, audit {B}'s use of the Software during normal business hours, in a manner that causes minimal disruption to {B}'s business and subject to {S}'s obligations of confidentiality.","If an audit shows that {B} has exceeded the number of Authorised Users, {B} shall pay the additional fees due for the excess at {S}'s list price then in force and, if the excess is more than five per cent (5%), the reasonable costs of the audit."]},
"*lbgrant":{t:"Licence",e:"The retained group keeps using the IP it relied on before the sale, for free and for ever.",p:["With effect from Completion, {S} grants to {B} and the members of its group a non-exclusive, perpetual, irrevocable, worldwide, royalty-free licence to use the Licensed IPR in the Retained Business.","The licence includes the right to modify and develop the Licensed IPR, and {B} shall own all Intellectual Property Rights in any modification or development it makes.","Nothing in this Agreement obliges {S} to maintain, develop or support any of the Licensed IPR, or to provide any update to it."]},
"*lbsub":{t:"Sub-licensing and Transfer",e:"Who else may use the licence, and what happens if the seller later sells part of its retained business.",p:["{B} may grant sub-licences to the members of its group, and to its and their contractors, suppliers and customers to the extent required to receive services from, or provide products to, the Retained Business, but may not otherwise sub-license the Licensed IPR.","If {B} or any member of its group disposes of any part of the Retained Business, the licence shall continue for the benefit of that part of the Retained Business in the hands of the acquirer, which shall accede to this Agreement by written notice to {S}.","A member of {B}'s group shall cease to be a licensee when it ceases to be a member of that group, save as provided in clause {N}.2."]},
"*lbterm":{t:"Termination",e:"A licence-back is meant to last. It can be ended only against a licensee that seriously breaches its limits, and only for that licensee.",p:["{S} may terminate the licence in respect of a member of {B}'s group only if that member commits a material breach of {R:*lbsub} or {R:conf} which, if capable of remedy, it fails to remedy within sixty (60) days after written notice requiring it to do so.","Termination in respect of one licensee shall not affect the licence granted to any other licensee."]},
"*ttgrant":{t:"Licence",e:"The sold business may keep using the seller's brand, as it did before, while it rebrands.",p:["With effect from Completion, {S} grants to {B} and its subsidiaries a non-exclusive, non-transferable, royalty-free licence to use the Seller Marks in the Business during the Transitional Period, in the manner in which they were used in the Business immediately before Completion.","The licence extends to existing stocks of products, packaging, stationery, signage, vehicles, websites and promotional materials bearing the Seller Marks at Completion, and to reprinting them where reasonably necessary before replacement materials are available."]},
"*ttuse":{t:"Use of the Seller Marks",e:"The brand is used only as before, and customers are told the business has left the group.",p:["{B} shall use the Seller Marks only in the same form, and to at least the same quality standards, as they were used in the Business before Completion, and shall not use them for any new product, service or territory.","{B} shall not hold itself out as a member of {S}'s group, and shall take reasonable steps to make clear to customers and suppliers that the Business is no longer part of it.","All use of the Seller Marks by {B} shall enure for the benefit of {S}."]},
"*ttphase":{t:"Rebranding",e:"The practical steps to remove the brand: company names, domains and social media.",p:["{B} shall cease all use of the Seller Marks by the end of the Transitional Period, and shall use reasonable endeavours to do so sooner where practicable.","Within three (3) months after Completion, {B} shall procure that each of its subsidiaries whose name includes any of the Seller Marks changes its name to one which does not include them, and files the notice of the change of name with the registrar of companies.","By the end of the Transitional Period, {B} shall transfer to {S}, or cancel, each domain name and social media account consisting of or including any of the Seller Marks, unless the parties agree otherwise."]}
});

 set("psa",{o:after(S,"*svc",["*prof","*reli"]),
  rec:["{S} provides professional services in the field of [●].","{B} wishes to engage {S} to provide the Services on the terms of this Agreement."],
  note:"Check whether the provider's regulator requires particular terms, such as a complaints procedure or limits on liability for regulated advice."});
 set("facm",{o:after(S,"*svc",["*site","*tupesv"]),
  rec:["{S} provides facilities management services, including [cleaning, maintenance and security].","{B} wishes to engage {S} to provide the Services at the Sites on the terms of this Agreement."],
  defs:{"Sites":"the premises at which the Services are to be provided, as listed in {SC:svc}"},
  note:"Facilities services are a common source of TUPE transfers when the provider changes. Get the employee information early, and price any transferring staff into the charges."});
 set("mkt",{o:after(S,"*svc",["*approv","*adcode"]),
  rec:["{S} is an agency providing [creative, media and digital marketing] services.","{B} wishes to appoint {S} to provide the Services, and {S} has agreed to do so, on the terms of this Agreement."],
  defs:{"Materials":"all advertising, marketing and promotional materials prepared by or on behalf of {S} for {B} under this Agreement"},
  note:"Agree who owns the creative work and any media buying arrangements. Agencies often buy media as principal and charge a commission."});
 set("bpo",{o:after(ag.bpo.o,"*svc",["*sla","*tupesv"]),
  rec:["{B} currently carries out its [●] functions itself.","{B} wishes to outsource those functions to {S}, and {S} has agreed to provide the Services, on the terms of this Agreement."],
  note:"Outsourcing a function usually transfers the staff who did it under TUPE, and may need to be notified to a regulator if the function is regulated. Plan the exit from day one."});
 set("ito",{o:after(ag.ito.o,"*svc",["*sla","*secur","*tupesv"]),
  rec:["{B} wishes to outsource the operation of its information technology [infrastructure and applications].","{S} has agreed to provide the Services on the terms of this Agreement."],
  note:"If the customer is a regulated financial services firm, regulators expect specific terms in material outsourcings, including access, audit and exit rights. Add them before using this for a regulated function."});
 set("dev",{o:after(ag.dev.o,"dev-acc",["*oss","*handover"]),
  rec:["{B} wishes {S} to design and develop the software described in {SC:svc}.","{S} has agreed to do so on the terms of this Agreement."],
  note:"Make sure the customer will own the code and receive the source. If the developer keeps its own tools and pre-existing code, the customer needs a broad, perpetual licence of them."});
 set("support",{o:after(S,"*svc",["*suplev","*supexcl"]),
  rec:["{B} uses the software and systems described in {SC:svc}.","{B} wishes {S} to provide support and maintenance services for them, and {S} has agreed to do so, on the terms of this Agreement."],
  defs:{"Business Hours":"9.00 am to 5.30 pm on any Business Day"},
  note:"Check the severity definitions against how the business actually uses the system. Response times mean little if the severity is set by the supplier."});
 set("ltsa",{o:after(S,"*svc",["*ltsarel","*govn"]),
  rec:["Under the SPA, [●] has agreed to sell [●] to [●].","{S} and {B} wish certain services to continue to be provided between them after the transitional services period, on a long-term commercial basis, on the terms of this Agreement."],
  defs:Object.assign({"Transitional Services Agreement":"the transitional services agreement dated on or about the date of Completion between [●] and [●]"},SPA_DEFS),
  note:"Long-term arrangements between a seller and the business it sold are commercial contracts between parties whose interests diverge. Agree the price review and exit terms now, while the deal gives you leverage."});
 set("patlic",{o:["lic-scope","*roy","lic-imp","*patmaint","lic-war","ind","lol","conf","tmb","asg"],
  rec:["{S} is the proprietor of the patents and patent applications listed in {SC:lipr}.","{B} wishes to obtain a licence under those patents to make and sell the Licensed Products in the Territory, and {S} has agreed to grant it, on the terms of this Agreement."],
  defs:{"Licensed IPR":"the patents and patent applications listed in {SC:lipr}, all patents granted on any of them, and any divisional, continuation, re-issue, re-examination or extension of, and any supplementary protection certificate based on, any of them"}});
 set("tmlic",{o:["lic-scope","*roy","*qc","*tmuse","lic-war","ind","lol","conf","tmb","asg"],
  rec:["{S} is the proprietor of the trade marks listed in {SC:lipr}.","{B} wishes to use those trade marks on and in relation to the Licensed Products in the Territory, and {S} has agreed to license them, on the terms of this Agreement."],
  defs:{"Licensed IPR":"the trade marks listed in {SC:lipr}, any registrations of them, and the goodwill attaching to them","Licensed Products":"the [●] products sold by {B} under the Licensed IPR which have been approved by {S} under {R:*qc}","Brand Guidelines":"{S}'s guidelines for the use of the Licensed IPR, as notified to {B} in writing from time to time"},
  note:"An exclusive licensee can only sue infringers in its own name if the licence gives it that right. Register the licence at the Intellectual Property Office so the licensee's position is protected."});
 set("khlic",{o:["lic-scope","*khdisc","*roy","lic-imp","*khconf","lic-war","ind","lol","tmb","asg"],
  rec:["{S} has developed and owns confidential technical information relating to [●].","{B} wishes to use that information to make and sell the Licensed Products, and {S} has agreed to license it, on the terms of this Agreement."],
  defs:{"Licensed IPR":"the Know-How, and all Intellectual Property Rights in it","Know-How":"the confidential technical information, processes, formulae, methods, specifications and data relating to [●] owned by {S} and described in {SC:lipr}, in any form","Licensed Products":"any product made, used or sold by or on behalf of {B} using any of the Know-How","Term":"the period of [ten (10)] years from the Effective Date, unless terminated earlier in accordance with this Agreement"},
  note:"Know-how has no registration and no fixed expiry, so its value depends entirely on secrecy. Royalties that continue after the know-how becomes public can raise competition law issues."});
 set("swlic",{o:["*swgrant","*swfee","*swaudit","lic-war","ind","lol","conf","tmb","asg"],sch:["swspec"],
  rec:["{S} owns the Software.","{B} wishes to install and use the Software for its internal business purposes, and {S} has agreed to grant a licence on the terms of this Agreement."],
  defs:{"Software":"the computer programs described in {SC:swspec}, in object code form, together with any updates and new releases provided under this Agreement","Documentation":"the user manuals and technical documentation for the Software provided by {S}","Licensed IPR":"the Intellectual Property Rights in the Software and the Documentation","Authorised Users":"the employees and contractors of {B} and its group companies, up to the number set out in {SC:swspec}","Licence Fee":"the fee set out in {SC:swspec}","Charges":"the Licence Fee and any other sums payable under this Agreement","Term":"the period from the Effective Date until this Agreement is terminated in accordance with its terms"},
  note:"Check how users are counted, particularly for group companies and contractors. Support and maintenance are usually agreed separately."});
 set("licback",{o:["*lbgrant","*lbsub","lic-war","conf","*lbterm","asg"],
  rec:["Under the SPA, [●] has agreed to sell [●], which owns the Licensed IPR, to [●].","{B} and its group continue to need to use the Licensed IPR in the Retained Business, and {S} has agreed to grant a licence on the terms of this Agreement."],
  defs:Object.assign({"Effective Date":"the date of Completion","Retained Business":"the businesses carried on by {B} and its group at Completion, and any natural development or extension of them","Licensed IPR":"the Intellectual Property Rights owned by {S} at Completion which were used in the Retained Business in the twelve (12) months before Completion, including those listed in {SC:lipr}"},SPA_DEFS),
  note:"In a carve-out, decide early which shared IP goes with the business and which stays. Whatever goes should be licensed back to the seller's retained group on terms that survive any later sale by either side."});
 set("ttml",{o:["*ttgrant","tt-period","*ttuse","*ttphase","asg"],
  rec:["Under the SPA, [●] has agreed to sell [●] to [●]. Before Completion, the Business traded under the Seller Marks.","{B} needs a limited period after Completion to rebrand, and {S} has agreed to permit the continued use of the Seller Marks during that period on the terms of this Agreement."],
  defs:Object.assign({"Effective Date":"the date of Completion","Business":"the business carried on by {B} and its subsidiaries at Completion","Seller Marks":"the trade marks, names and logos listed in {SC:lipr}, and any trade mark, name or logo confusingly similar to any of them","Transitional Period":"the period determined in accordance with {R:tt-period}"},SPA_DEFS),
  note:"Rebranding touches company names, domains, signage, product approvals and customer contracts. Build the rebranding plan with the business before agreeing the period."});
}

/* ============================================================
   GENERAL PRACTICE: agreements used across commercial and
   corporate work, beyond any one type of transaction.
   ============================================================ */
const AGREED_FORM="in relation to a document, the form of that document agreed between the parties and initialled by or on their behalf for the purpose of identification";
const LIST_GT=["guarantees to {B} the punctual performance by the Principal Debtor of the Guaranteed Obligations;","undertakes that whenever the Principal Debtor does not pay any amount when due under or in connection with the Principal Agreement, {S} shall immediately on demand pay that amount as if it were the principal obligor; and","agrees, as an independent and primary obligation, to indemnify {B} immediately on demand against any loss or liability it suffers if any Guaranteed Obligation is or becomes unenforceable, invalid or illegal, the amount of that loss or liability being equal to the amount {B} would otherwise have been entitled to recover."];
const DEADLOCK_DEF="A “Deadlock” arises if a matter requiring the approval of the Board or of the shareholders has been considered at two consecutive duly convened meetings and has not been approved because of the opposition of the directors appointed by, or the votes of, one party.";
const ESCALATE="Either party may refer a Deadlock to the chief executives (or equivalent) of the parties, who shall try in good faith to resolve it within twenty (20) Business Days after the referral.";
const OFFER_FIRST="No party may transfer any Shares except in accordance with this clause {N}. A party wishing to transfer Shares shall first offer them to the other party at the price at which it is willing to sell. If the other party does not accept the offer in full within thirty (30) Business Days, the transferring party may, within the following three (3) months, sell those Shares to a bona fide third party at a price no lower than the offer price.";

/* ---------------- negotiable clauses ---------------- */
Object.assign(C,{
"gt-cap":{t:"Limit of the Guarantor's Liability",g:["guarantees"],
 d:"Whether the guarantor's exposure has a ceiling or an end date.",
 n:"Guarantees are construed strictly in the guarantor's favour where the wording is unclear, so state any cap and time limit in plain terms.",
 o:[
 ["Unlimited",-2,["{S}'s liability under this Deed is not limited in amount or in time."],
  "You can recover everything the principal debtor owes, for as long as it owes it.","Your exposure is open-ended and depends on a contract you do not control."],
 ["Capped amount",0,["{S}'s maximum aggregate liability under this Deed shall not exceed £[●], together with interest and costs payable under {R:*gt-pay}."],
  "The market position. Real security, at a level the guarantor's board can approve.","The market position. You know your maximum exposure."],
 ["Capped and time-limited",2,["{S}'s maximum aggregate liability under this Deed shall not exceed £[●].","{S} shall have no liability under this Deed unless {B} has made a written demand, giving reasonable details of the claim, within twelve (12) months after the expiry or termination of the Principal Agreement."],
  "The guarantee may run out before a claim surfaces.","A firm ceiling and a clear end date."]]},
"ht-excl":{t:"Exclusivity",g:["heads"],
 d:"Whether the seller must stop talking to other buyers while the buyer spends money on due diligence.",
 n:"A lock-out is enforceable only if it is for a defined period and supported by consideration (Walford v Miles [1992] UKHL 12). An open-ended duty to negotiate in good faith is not enforceable.",
 o:[
 ["Three months, with cost cover",-2,["In consideration of {B} incurring costs in investigating the Proposed Transaction, {S} undertakes that for three (3) months from the date of this letter (the “Exclusivity Period”) it shall not, and shall procure that none of its group companies, officers or advisers shall, solicit, encourage, negotiate or enter into any agreement with any person other than {B} in relation to any transaction similar to the Proposed Transaction, and shall promptly notify {B} of any approach.","If {S} breaches this clause {N}, it shall reimburse {B}'s reasonable costs incurred in connection with the Proposed Transaction, without prejudice to {B}'s other rights."],
  "Time to complete diligence without being outbid, and your costs back if the seller walks.","You are locked out of the market for three months, with a costs exposure."],
 ["Six weeks, ending early if terms change",0,["In consideration of {B} incurring costs in investigating the Proposed Transaction, {S} undertakes that for six (6) weeks from the date of this letter (the “Exclusivity Period”) it shall not solicit, negotiate or enter into any agreement with any person other than {B} in relation to the Proposed Transaction.","The Exclusivity Period shall end early if {B} notifies {S} that it no longer wishes to proceed, or proposes to reduce the consideration other than as a result of matters disclosed in due diligence."],
  "The market position. Enough time for focused diligence.","The market position. A short lock-out that ends if the buyer chips the price."],
 ["No exclusivity",2,["{S} is free to discuss the Proposed Transaction with other parties, but shall notify {B} before entering into any binding agreement with another person in relation to it."],
  "You could spend heavily on diligence and lose the deal to another bidder.","You keep competitive tension until signing."]]},
"stl-rel":{t:"Scope of Settlement",g:["settlement"],
 d:"Which claims the settlement wipes out.",
 n:"Under Bank of Credit and Commerce International SA v Ali [2001] UKHL 8, a release covers unknown claims only if the words make that clear. Fraud cannot be released by general words.",
 o:[
 ["The dispute only",-2,["With effect from receipt of the Settlement Sum in full, {B} releases {S} from all claims arising out of the Dispute.","Nothing in this Agreement releases any other claim, including any claim arising out of matters which are not the subject of the Dispute or which arise after the date of this Agreement."],
  "You settle the fight you are in and keep every other claim.","You pay, and may still face claims about the wider relationship."],
 ["Full and final, connected claims",0,["With effect from receipt of the Settlement Sum in full, this Agreement is in full and final settlement of, and each party releases the other and its group companies from, all claims which it has or may have arising out of or in connection with the Dispute or the contract to which it relates, whether known or unknown and whether or not in the contemplation of the parties at the date of this Agreement.","Nothing in this Agreement releases any claim for fraud or any claim to enforce this Agreement."],
  "The market position. A clean break on the subject matter, both ways.","The market position. A clean break on the subject matter, both ways."],
 ["All claims of any kind",2,["With effect from the date of this Agreement, {B} releases {S}, its group companies and its and their officers and employees from all claims of any nature which {B} has or may have against any of them, arising out of any matter up to the date of this Agreement, whether known or unknown and whether or not in the contemplation of the parties.","{B} shall not bring, and shall procure that no member of its group brings, any claim released by this clause {N}, and shall indemnify {S} against the costs of any such claim."],
  "You give up claims you may not yet know about, before you are paid.","Complete finality, immediately."]]},
"dt-rel":{t:"Release",g:["contract-changes"],
 d:"Whether either side can still sue for breaches before the contract ended.",
 o:[
 ["Customer released, keeps its own claims",-2,["With effect from the Termination Date, {S} releases {B} from all its obligations and liabilities under the Agreement, whether arising before or after the Termination Date.","Nothing in this Deed releases {S} from any liability for breach of the Agreement before the Termination Date."],
  "You walk away clean and keep your claims.","You give up your claims and keep your exposure."],
 ["Mutual release",0,["With effect from the Termination Date, each party releases the other from all its obligations and liabilities under or in connection with the Agreement, whether arising before or after the Termination Date and whether known or unknown.","This clause {N} does not release any obligation under this Deed or under the provisions of the Agreement listed in {R:*dt-surv}."],
  "The market position. A clean break both ways.","The market position. A clean break both ways."],
 ["Supplier released, keeps its own claims",2,["With effect from the Termination Date, {B} releases {S} from all its obligations and liabilities under the Agreement, whether arising before or after the Termination Date.","Nothing in this Deed releases {B} from any liability under the Agreement before the Termination Date, including for unpaid charges."],
  "You give up your claims and remain liable for the past.","You walk away clean and keep your claims."]]},
"da-war":{t:"Assignor's Warranties",g:["contract-changes"],
 d:"What the assignor promises about the contract being transferred.",
 o:[
 ["Full warranties",-2,[["{S} warrants to {B} that:",["the Agreement is in full force and effect and is the whole agreement between {S} and the Counterparty about its subject matter;","{S} has not assigned, charged or otherwise dealt with any of its rights under the Agreement;","the assignment does not breach the Agreement or require any consent which has not been obtained; and","no party is in breach of the Agreement and no notice of termination has been given or received."]]],
  "You know what you are buying, and have a claim if it is not.","You stand behind a contract you no longer control."],
 ["Title and capacity",0,["{S} warrants to {B} that it has not assigned, charged or otherwise dealt with any of its rights under the Agreement, and that it has full power to enter into this Deed."],
  "The market position. Clean title, though nothing about the contract's health.","The market position. You promise only what is within your knowledge and control."],
 ["Limited title guarantee only",2,["The assignment in {R:*da-assign} is made with limited title guarantee, and {S} gives no other warranty in relation to the Agreement."],
  "Very little comeback if the contract is in trouble.","Minimal exposure."]]},
"jv-board":{t:"Board and Management",g:["jv"],
 d:"Who appoints the directors and what makes a valid board meeting.",
 o:[
 ["Equal representation and quorum",-2,["Each party may appoint two (2) directors, regardless of its shareholding, and remove and replace any director it appoints.","The quorum for Board meetings is two directors, including at least one director appointed by each party. Each director has one vote and the chair has no casting vote."],
  "Equal say in the boardroom, despite your smaller stake.","Your majority stake does not translate into control of the board."],
 ["Proportionate representation, protected quorum",0,["Each party may appoint one (1) director for each twenty per cent. (20%) of the Shares it holds, and remove and replace any director it appoints.","The quorum for Board meetings is two directors, including at least one director appointed by each party. If a quorum is not present, the meeting shall be adjourned for five (5) Business Days, and at the adjourned meeting the directors present shall form a quorum."],
  "The market position. A seat at the table and a quorum that cannot be ignored, though not indefinitely.","The market position. Control in proportion to your stake, and meetings that cannot be blocked for ever."],
 ["Majority controls the board",2,["{S} may appoint a majority of the directors, and {B} may appoint one (1) director while it holds at least ten per cent. (10%) of the Shares.","The quorum for Board meetings is two directors, one of whom must be appointed by {S}. The chair shall be appointed by {S} and shall have a casting vote."],
  "Your influence is limited to the reserved matters.","You run the company."]]},
"jv-dead":{t:"Deadlock",g:["jv"],
 d:"What happens if the shareholders or their directors cannot agree.",
 n:"A shoot-out (Russian roulette) favours the party with readier access to funds. Escalation and mediation steps before any exit help preserve the relationship.",
 o:[
 ["Put option at fair value",-2,[DEADLOCK_DEF,ESCALATE,"If the Deadlock is not resolved, {B} may require {S} to buy all of {B}'s Shares at their fair value, determined by an independent accountant as between a willing buyer and a willing seller, with no discount for {B}'s minority holding."],
  "A guaranteed exit at full value if you are outvoted on a fundamental issue.","You may have to fund a buyout at a time not of your choosing."],
 ["Escalation, mediation, then status quo",0,[DEADLOCK_DEF,ESCALATE,"If the Deadlock is not resolved, the parties shall attempt to resolve it by mediation in accordance with the CEDR Model Mediation Procedure.","If the Deadlock remains unresolved thirty (30) Business Days after the referral to mediation, the proposal giving rise to it shall be treated as not approved, and the Company shall continue to operate in accordance with the current Business Plan."],
  "The market position. Nothing changes without your agreement.","The market position. A structured way to resolve disagreement without a forced sale."],
 ["Shoot-out",1,[DEADLOCK_DEF,ESCALATE,"If the Deadlock is not resolved, either party may serve a notice offering to buy all the other party's Shares at a price per Share specified in the notice. Within thirty (30) Business Days after receipt, the recipient must either sell its Shares at that price or buy all the server's Shares at the same price per Share, failing which it is treated as having elected to sell."],
  "A party with deeper pockets can use this to push you out.","A fast, final exit route that you are better placed to use."],
 ["Chair's casting vote",2,["The chair of the Board, who shall be appointed by {S}, shall have a casting vote on any matter that is not reserved under {R:sha-res}. No other deadlock procedure applies."],
  "You are outvoted on everything except the reserved matters.","No deadlock can arise on ordinary business."]]},
"jv-transfer":{t:"Transfer of Shares",g:["jv","covenants"],
 d:"When shareholders can sell, and whether one can force or follow the other's sale.",
 o:[
 ["Pre-emption and tag-along",-2,[OFFER_FIRST,"If {S} proposes to transfer Shares which would result in a third party holding more than fifty per cent. (50%) of the Shares, {B} may require the purchaser to buy all of {B}'s Shares on the same terms."],
  "You can always follow the majority out on the same terms.","A buyer for your stake must also buy the minority, which may deter buyers."],
 ["Pre-emption, tag and drag",0,[OFFER_FIRST,"If {S} proposes to transfer Shares which would result in a third party holding more than fifty per cent. (50%) of the Shares, {B} may require the purchaser to buy all of {B}'s Shares on the same terms.","If {S} accepts a bona fide arm's length offer for all its Shares, it may require {B} to sell all its Shares to the same purchaser on the same terms."],
  "The market position. You can follow any sale, but can also be required to join one.","The market position. You can deliver a buyer the whole company."],
 ["Drag-along only",2,[OFFER_FIRST,"If {S} accepts a bona fide offer for all its Shares, it may require {B} to sell all its Shares to the same purchaser on the same terms. {B} has no right to require any purchaser to buy its Shares."],
  "You can be forced to sell, but cannot insist on being included.","Full control over the exit."]]},
"inv-war":{t:"Warranties",g:["investment","warranties"],
 d:"What the company promises the investor about its business, and how much it can be made to pay.",
 n:"Damages against the company itself can be circular, because the investor is paid from a company it now partly owns. Investors therefore often ask the founders to give the warranties personally, capped at a multiple of salary.",
 o:[
 ["Full warranties, uncapped",-2,["The Company warrants to {B} that each of the statements in {SC:invwar} is true and accurate at the date of this Agreement and at Completion.","The Company's liability for breach of the Warranties is not limited in amount or time, save as provided by law."],
  "Full recourse if the business is not as described.","Unlimited exposure, paid out of the money just raised."],
 ["Disclosed, capped at the investment",0,["The Company warrants to {B} that each of the statements in {SC:invwar} is true and accurate at the date of this Agreement, except as fairly disclosed in the Disclosure Letter.","The Company's aggregate liability for breach of the Warranties shall not exceed the aggregate Subscription Price paid by {B}, and no claim may be brought unless notified to the Company within eighteen (18) months after Completion."],
  "The market position. A meaningful remedy for undisclosed problems.","The market position. Exposure limited to the money raised, for a limited period."],
 ["Capacity and title only",2,["The Company warrants to {B} only that it has the capacity and authority to enter into this Agreement and that the Subscription Shares will be validly issued and fully paid.","{B} acknowledges that it has made its own investigation of the Company and does not rely on any other statement."],
  "You invest on the strength of your own diligence alone.","Almost no warranty exposure."]]},
"asa-price":{t:"Conversion Price",g:["investment"],
 d:"The price at which the advance subscription turns into shares.",
 o:[
 ["Discount and valuation cap",-2,["The “Conversion Price” on a Qualifying Round shall be the lower of the price per share paid by investors in that round less a discount of twenty per cent. (20%), and the price per share implied by a pre-money valuation of £[●] (the “Valuation Cap”).","On a sale, listing or the Longstop Date, the Conversion Price shall be the price per share implied by the Valuation Cap."],
  "Rewarded for investing early, with a ceiling on the price you pay.","Early money can convert cheaply if the round is strong."],
 ["Discount only",0,["The “Conversion Price” on a Qualifying Round shall be the price per share paid by investors in that round, less a discount of twenty per cent. (20%).","On a sale, listing or the Longstop Date, the Conversion Price shall be the price per share implied by a pre-money valuation of £[●]."],
  "The market position. A reward for early risk.","The market position. A standard discount, with no cap on upside."],
 ["Round price, no discount",2,["The “Conversion Price” on a Qualifying Round shall be the price per share paid by investors in that round.","On a sale, listing or the Longstop Date, the Conversion Price shall be the price per share implied by a pre-money valuation of £[●], as determined by the board of the Company acting reasonably."],
  "No reward for taking risk early.","Early investors pay the same as everyone else."]]},
"cla-price":{t:"Conversion Price",g:["investment"],
 d:"The price at which the loan turns into shares.",
 o:[
 ["Discount and valuation cap",-2,["The “Conversion Price” on a Qualifying Round shall be the lower of the price per share paid by investors in that round less a discount of twenty per cent. (20%), and the price per share implied by a pre-money valuation of £[●].","On any other conversion, the Conversion Price shall be the price per share implied by a pre-money valuation of £[●]."],
  "Rewarded for lending early, with a ceiling on the price.","Early money can convert cheaply if the round is strong."],
 ["Discount only",0,["The “Conversion Price” on a Qualifying Round shall be the price per share paid by investors in that round, less a discount of twenty per cent. (20%).","On any other conversion, the Conversion Price shall be the price per share implied by a pre-money valuation of £[●]."],
  "The market position. A reward for early risk.","The market position. A standard discount, with no cap."],
 ["Round price",2,["The “Conversion Price” on a Qualifying Round shall be the price per share paid by investors in that round.","On any other conversion, the Conversion Price shall be determined by the board of the Company acting reasonably, by reference to fair market value."],
  "No reward for lending early.","The lender converts at the same price as new investors."]]},
"fr-terr":{t:"Territorial Protection",g:["franchising","competition"],
 d:"Whether the franchisee is protected from other franchisees and the franchisor in its area.",
 n:"Competition law limits how far territorial protection can go. In particular, preventing franchisees from responding to customers who approach them from outside their territory is a hardcore restriction under the Vertical Agreements Block Exemption Order 2022.",
 o:[
 ["Exclusive territory",-2,["During the Initial Term, {S} shall not operate, or grant any other person the right to operate, a business using the System or the Marks within the Territory."],
  "No competition from the brand in your area.","You cannot grow the network in that area, whatever its potential."],
 ["Protected while targets are met",0,["{S} shall not grant any other franchise for the Territory while {B} meets the minimum performance targets in the Operations Manual.","{S} may make online sales to customers in the Territory, and shall credit {B} with [●] per cent. of the net revenue from those sales."],
  "The market position. Protection you keep by performing.","The market position. Protection you can withdraw if the area underperforms."],
 ["No territorial protection",2,["The licence is non-exclusive. {S} may itself, or through others, operate businesses using the System anywhere, including within the Territory."],
  "Another franchisee could open next door.","Complete freedom to develop the network."]]},
"fr-post":{t:"Post-termination Restrictions",g:["franchising","covenants"],
 d:"Whether the franchisee can compete after the franchise ends.",
 n:"A post-term non-compete benefits from the Vertical Agreements Block Exemption Order 2022 only if it lasts no more than one year, is limited to the premises from which the franchisee operated and is indispensable to protect the franchisor's know-how. Wider restrictions must also pass the common law restraint of trade test.",
 o:[
 ["Confidentiality only",-2,["After termination or expiry, {B} shall cease to use the System and the Marks, but shall not otherwise be restricted from carrying on business."],
  "You can keep trading in your own name.","Your former franchisee can compete immediately, using what it learned."],
 ["One year, from the premises",0,["After termination or expiry, {B} shall cease to use the System and the Marks.","For twelve (12) months after termination or expiry, {B} shall not carry on a business competing with the Franchised Business from the Premises."],
  "The market position. A short restriction, limited to your old site.","The market position. Protection of the site and the know-how, in a form competition law accepts."],
 ["Two years, wider area",2,["After termination or expiry, {B} shall cease to use the System and the Marks.","For twenty-four (24) months after termination or expiry, {B} shall not be engaged in any business competing with the System within ten (10) miles of the Premises or of any other business operated under the System."],
  "You may be unable to work in your field locally for two years.","Strong protection, though at real risk of being unenforceable."]]},
"sp-excl":{t:"Category Exclusivity",g:["franchising"],
 d:"Whether the rights holder may also take money from the sponsor's competitors.",
 o:[
 ["Exclusive, with ambush protection",-2,["{S} shall not grant any sponsorship, supplier or promotional rights in relation to the Event to any competitor of {B} in the [●] category, and shall use reasonable endeavours to prevent ambush marketing by any such competitor at the Event."],
  "Your competitors are kept out of the event.","You give up income from a whole category."],
 ["Exclusive, existing deals excluded",0,["{S} shall not grant sponsorship rights in relation to the Event to any competitor of {B} in the [●] category, save under the arrangements listed in {SC:sprights} which are in place at the date of this Agreement."],
  "The market position. Category protection, with known exceptions.","The market position. Category exclusivity that respects deals already done."],
 ["Non-exclusive",2,["The Rights are non-exclusive. {S} may grant sponsorship rights to any other person, including competitors of {B}."],
  "A competitor could sponsor the same event.","Full freedom to sell sponsorship."]]},
"sp-morals":{t:"Reputation",g:["franchising","termination"],
 d:"Whether a party can walk away if the other damages its reputation.",
 o:[
 ["Sponsor may terminate on reasonable opinion",-2,["{B} may terminate this Agreement immediately by notice if {S}, the Event or any participant engaged by {S} does anything which, in {B}'s reasonable opinion, brings or is likely to bring {B} into disrepute.","On termination under this clause {N}, {S} shall refund the part of the Sponsorship Fee relating to the period after termination."],
  "You can exit quickly if the association becomes toxic.","Your fee depends on the sponsor's view of events you may not control."],
 ["Mutual, serious disrepute, cure period",0,["Either party may terminate this Agreement by notice if the other does anything which brings, or is reasonably likely to bring, the terminating party into serious public disrepute, and fails to take reasonable remedial steps within ten (10) Business Days after notice.","On termination under this clause {N}, {S} shall refund a fair proportion of the Sponsorship Fee for Rights not delivered."],
  "The market position. Protection for both brands, with an objective test.","The market position. Protection for both brands, with an objective test."],
 ["No reputation termination",2,["Neither party may terminate this Agreement on grounds of reputation, save under {R:tmb}."],
  "You may be tied to a damaging association.","Certainty of income."]]},
"col-ip":{t:"Ownership of Results",g:["ip"],
 d:"Who owns the intellectual property created in the project.",
 n:"Avoid joint ownership unless the parties agree how it will be exploited. Under the Patents Act 1977, a co-owner of a patent cannot license or assign it without the other co-owners' consent.",
 o:[
 ["Each party owns what it creates",-2,["Each party shall own the Foreground IPR created by its own personnel.","Each party grants the other a non-exclusive, royalty-free, perpetual licence to use its Foreground IPR for research and for the purposes of the Project, and shall negotiate in good faith a licence for commercial use on request."],
  "You keep what your team invents.","Results may be split in a way that makes them hard to exploit."],
 ["Lead party owns, with revenue share",0,["The Foreground IPR shall belong to {S}, and {B} assigns to {S}, by way of present assignment of future rights, all its right, title and interest in it.","{S} grants {B} a non-exclusive, royalty-free, perpetual licence to use the Foreground IPR for research and its internal purposes.","{S} shall pay {B} [●] per cent. of the net revenue it receives from licensing or otherwise exploiting the Foreground IPR."],
  "The market position. You share in the commercial upside.","The market position. Clear ownership, with a fair share for your partner."],
 ["Lead party owns outright",2,["The Foreground IPR shall belong to {S}, and {B} assigns to {S}, by way of present assignment of future rights, all its right, title and interest in it.","{S} grants {B} a non-exclusive, royalty-free licence to use the Foreground IPR for internal, non-commercial research only."],
  "You contribute to results you cannot commercialise.","Full ownership and freedom to exploit."]]},
"ds-liab":{t:"Liability for the Shared Data",g:["data"],
 d:"Who bears the cost if the sharing or use of the data breaches data protection law.",
 n:"Whether an indemnity can cover a regulatory fine is doubtful as a matter of public policy, so these options do not mention fines.",
 o:[
 ["Discloser covers unlawful disclosure",-2,["{S} shall indemnify {B} against all losses and costs arising from any claim that the disclosure of the Shared Data to {B} was unlawful, or that the data subjects were not properly informed of it."],
  "You are protected if the data should never have been shared with you.","You carry the risk of how your data was collected and disclosed."],
 ["Each party covers its own breaches",0,["Each party shall indemnify the other against all losses and costs arising from its own breach of this Agreement or of the Data Protection Legislation in relation to the Shared Data."],
  "The market position. Each side answers for its own conduct.","The market position. Each side answers for its own conduct."],
 ["Recipient covers its use, no warranty of accuracy",2,["{B} shall indemnify {S} against all losses and costs arising from {B}'s processing of the Shared Data.","{S} gives no warranty as to the accuracy or completeness of the Shared Data."],
  "You carry the risk of using data you did not collect.","Minimal exposure once the data has left you."]]},
"ref-fee":{t:"Introduction Fee",g:["franchising"],
 d:"How much the introducer earns and for how long.",
 o:[
 ["First year only",-2,["{B} shall pay {S} a fee of [●] per cent. of the Net Revenue received from each Introduced Client in the twelve (12) months after its first contract with {B}.","Fees are payable within thirty (30) days after the end of each quarter in which the Net Revenue is received, with a statement showing how they were calculated."],
  "A defined cost for each new client.","Your reward stops after a year, however valuable the client becomes."],
 ["Two years",0,["{B} shall pay {S} a fee of [●] per cent. of the Net Revenue received from each Introduced Client in the twenty-four (24) months after its first contract with {B}, including after the termination of this Agreement.","Fees are payable within thirty (30) days after the end of each quarter in which the Net Revenue is received, with a statement showing how they were calculated."],
  "The market position. A fair reward with a clear end.","The market position. A fair reward with a clear end."],
 ["For the life of the client",2,["{B} shall pay {S} a commission of [●] per cent. of all Net Revenue received from each Introduced Client for as long as it remains a client of {B}, including after the termination of this Agreement.","The commission is payable within thirty (30) days after the end of each quarter in which the Net Revenue is received, with a statement showing how it was calculated."],
  "An indefinite cost on your best clients.","Income for as long as the client stays."]]},
"bb-war":{t:"Seller's Warranties",g:["warranties"],
 d:"What the selling shareholder promises about the shares and its tax position.",
 o:[
 ["Title, capacity and tax information",-2,["{S} warrants that it is the sole legal and beneficial owner of the Sale Shares, free from all encumbrances, and has full power to sell them.","{S} shall provide such information as {B} reasonably requires to apply for clearance from HM Revenue & Customs on the tax treatment of the purchase, and warrants that it is accurate."],
  "Clean title, and support for the tax clearance.","More obligations around a tax treatment that benefits you."],
 ["Title and capacity",0,["{S} warrants that it is the sole legal and beneficial owner of the Sale Shares, free from all encumbrances, and has full power to sell them."],
  "The market position. The company receives clean title.","The market position. You promise what you control."],
 ["No warranties",2,["{S} sells the Sale Shares with such title as it has and gives no warranty in relation to them."],
  "No recourse if the shares are subject to a third party's rights.","Minimal exposure."]]},
"es-ref":{t:"Reference and Announcement",g:["employment-exits"],
 d:"What the employer will say about the employee after they leave.",
 o:[
 ["Factual confirmation only",-2,["{B} shall not be obliged to give any reference, but shall confirm {S}'s dates of employment and job title if asked by a prospective employer."],
  "No risk of a reference being challenged as misleading.","Little help in finding your next role."],
 ["Agreed reference",0,["{B} shall, on request from a prospective employer, give a reference in the form set out in Part 2 of {SC:esclaims}, and shall respond to any oral enquiry consistently with it."],
  "The market position. An agreed, accurate reference.","The market position. A reference you have seen and approved."],
 ["Agreed reference and announcement",2,["{B} shall, on request, give a reference in the form set out in Part 2 of {SC:esclaims}, and shall respond to oral enquiries consistently with it.","{B} shall announce {S}'s departure internally and externally in terms agreed with {S}, and shall instruct its directors not to make any derogatory statement about {S}."],
  "More commitments, including over what your directors say.","Control over how your departure is described."]]}
});
