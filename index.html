<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Counterpart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dark chrome with a light agreement sheet at the centre and the drafting panel beside it. Claret: near-black with a wine undertone and bone white; Bodoni Moda headlines, Spectral for the agreement, Figtree for the interface. Deliberately dark in every viewer mode. */
:root{
  color-scheme:dark;
  --black:#110C0D; --onyx:#181112; --graphite:#21181A; --slate:#2B2023;
  --line:#2F2427; --line-hi:#463439;
  --silver-hi:#F6F0EB; --silver:#DCD1C9; --silver-lo:#A5968E; --muted:#B0A199;
  --sheen:linear-gradient(180deg,#FBF6F1 0%,#E9DED5 100%); --on-ink:#181112; --on-ink-2:#5E4E4A;
  --sheen-text:linear-gradient(180deg,#FBF6F1 0%,#D8A9B0 100%);
  --accent:#DCAAB2; --bar:rgba(17,12,13,.9); --glow:#35171D; --switch-on:#5A3A41;
  --ins-c:#A9BEFF; --del-c:#F4A79F;
  --paper:#FDFBF9; --ink:#1A1415; --ink-2:#51474A; --ink-3:#857A7C; --rule:#E7E0DC; --ph:#F1ECE8;
  --display:"Century Gothic","CenturyGothic","URW Gothic","URW Gothic L","AppleGothic","Questrial",Futura,"Trebuchet MS",sans-serif;
  --serif:"Century Gothic","CenturyGothic","URW Gothic","URW Gothic L","AppleGothic","Questrial",Futura,"Trebuchet MS",sans-serif;
  --sans:"Century Gothic","CenturyGothic","URW Gothic","URW Gothic L","AppleGothic","Questrial",Futura,"Trebuchet MS",sans-serif;
  --d1:#8CCBA6; --d2:#C3D38A; --d3:#E2C27A; --d4:#EDA170; --d5:#EE8C95;
  --p1:#2D6A45; --p2:#5B6F25; --p3:#8A6714; --p4:#A14F1D; --p5:#A2293A;
  --paper-edge:#2c2e33; --shadow:rgba(0,0,0,.8); --scrim:rgba(0,0,0,.72);
  --dw:400; --wm-ls:.2em; --wm-fs:21px;
}
/* light mode: bone and ivory with wine ink, chosen in Settings (or matched to the device) */
:root[data-mode="light"]{
  color-scheme:light;
  --black:#F6F1EC; --onyx:#FFFDFA; --graphite:#F0E8E2; --slate:#E7DDD6;
  --line:#E7DDD6; --line-hi:#D3C4BB;
  --silver-hi:#1E1416; --silver:#45373B; --silver-lo:#86777A; --muted:#7C6D71;
  --sheen:linear-gradient(180deg,#3A2329 0%,#22161A 100%); --on-ink:#FBF6F1; --on-ink-2:rgba(251,246,241,.72);
  --sheen-text:linear-gradient(180deg,#7A2B3A 0%,#5E1F2C 100%);
  --accent:#7A2B3A; --bar:rgba(246,241,236,.9); --glow:#EED9DB; --switch-on:#7A2B3A;
  --ins-c:#1747b8; --del-c:#b3261e;
  --paper:#FFFFFF;
  --d1:#2D6A45; --d2:#5B6F25; --d3:#8A6714; --d4:#A14F1D; --d5:#A2293A;
  --paper-edge:#E3D8D1; --shadow:rgba(70,40,40,.22); --scrim:rgba(40,24,26,.38);
}
.r1{--rd:var(--d1);--rp:var(--p1)} .r2{--rd:var(--d2);--rp:var(--p2)} .r3{--rd:var(--d3);--rp:var(--p3)} .r4{--rd:var(--d4);--rp:var(--p4)} .r5{--rd:var(--d5);--rp:var(--p5)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--black);color:var(--silver);font-family:var(--sans);font-size:14.5px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--black)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,.cl:focus-visible{outline:1px solid var(--silver-hi);outline-offset:3px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kicker{font-family:var(--sans);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--silver-lo);margin:0 0 10px}
.p-sub{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--silver-lo);margin:26px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;border-radius:2px;white-space:nowrap}
.btn.silver{background:var(--sheen);color:var(--on-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 0 #000}
.btn.silver:hover{filter:brightness(1.06)}
.btn.silver:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{border:1px solid var(--line-hi);color:var(--silver)}
.btn.ghost:hover{border-color:var(--silver-lo);color:var(--silver-hi)}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding-block:14px}
.brand{display:flex;align-items:baseline;gap:12px}
.wm{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.18em;text-transform:uppercase;background:var(--sheen-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .sub{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--silver-lo);padding-left:12px;border-left:1px solid var(--line-hi)}
.nav{margin-left:auto;display:flex;gap:4px}
.nav button{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--silver-lo);padding:8px 12px;border-bottom:1px solid transparent}
.nav button:hover{color:var(--silver-hi)}
.nav button.on{color:var(--silver-hi);border-bottom-color:var(--silver)}

/* home */
.hero{border-bottom:1px solid var(--line);background:radial-gradient(1200px 420px at 72% -12%,var(--glow) 0%,var(--black) 62%)}
.hero-in{max-width:1180px;margin:0 auto;padding-block:64px 44px}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(36px,5.6vw,66px);line-height:1.02;letter-spacing:-.01em;margin:0 0 18px;color:var(--silver-hi);text-wrap:balance;max-width:16ch}
.hero h1 em{font-style:normal;background:var(--sheen-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-family:var(--serif);font-size:19px;line-height:1.5;color:var(--silver);max-width:60ch;margin:0 0 28px}
.counts{display:flex;flex-wrap:wrap;gap:10px 28px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--silver-lo)}
.counts b{font-family:var(--display);font-size:22px;letter-spacing:0;color:var(--silver-hi);font-weight:600;margin-right:6px;font-variant-numeric:lining-nums}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:20;background:var(--black);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-block:10px}
.tabs-in>button{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--silver-lo);padding:9px 14px;border:1px solid transparent;border-radius:2px}
.tabs-in>button.on{color:var(--on-ink);background:var(--sheen)}
.tabs-in>button:not(.on):hover{color:var(--silver-hi);border-color:var(--line-hi)}
.search{margin-left:auto;flex:1 1 280px;max-width:420px}
.search input{width:100%;background:var(--onyx);border:1px solid var(--line-hi);color:var(--silver-hi);font:inherit;font-size:14px;padding:10px 14px;border-radius:2px}
.search input::placeholder{color:var(--silver-lo)}
.home-list{max-width:1180px;margin:0 auto;padding-block:8px 80px}
.cat{padding-top:36px}
.cat>h2{font-family:var(--display);font-weight:500;font-size:30px;color:var(--silver-hi);margin:0 0 18px;display:flex;align-items:center;gap:18px}
.cat>h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-hi),transparent)}
.branches{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px}
.branch h3{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--silver-lo);font-weight:500;margin:0 0 6px;padding-left:16px;position:relative}
.branch h3::before{content:"";position:absolute;left:0;top:50%;width:9px;height:1px;background:var(--silver-lo)}
.branch ul{list-style:none;margin:0;padding:0 0 0 16px;border-left:1px solid var(--line)}
.ag{display:grid;width:100%;text-align:left;padding:12px 0 12px 16px;border-bottom:1px solid var(--line);position:relative}
.ag::before{content:"";position:absolute;left:-16px;top:24px;width:12px;height:1px;background:var(--line-hi)}
.ag-n{font-family:var(--serif);font-size:19px;color:var(--silver-hi);line-height:1.25}
.ag-p{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--silver-lo);margin-top:3px}
.ag-p i{font-style:normal;text-transform:lowercase;letter-spacing:.04em}
.ag-d{font-size:13.5px;color:var(--muted);margin-top:5px}
.ag-c{font-size:11px;color:var(--silver-lo);margin-top:6px;letter-spacing:.04em}
.ag:hover .ag-n{text-decoration:underline;text-decoration-color:var(--silver-lo);text-underline-offset:4px}
.clist,.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.ci,.gi{display:grid;align-content:start;gap:6px;text-align:left;background:var(--black);padding:18px 20px;min-width:0}
.ci:hover,.gi:hover{background:var(--onyx)}
.ci-t,.gi-t{font-family:var(--serif);font-size:19px;color:var(--silver-hi);line-height:1.25}
.ci-d,.gi-s{font-size:13.5px;color:var(--muted)}
.ci-m,.gi-m{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--silver-lo)}
.none{color:var(--muted);padding:40px 0;font-size:15px}

/* builder toolbar */
.tools{border-bottom:1px solid var(--line);background:var(--onyx)}
.tools-in{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:16px 22px;flex-wrap:wrap;padding-block:14px}
.back{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--silver-lo)}
.back:hover{color:var(--silver-hi)}
.tt{min-width:0;flex:1 1 260px}
.crumb{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--silver-lo)}
.tt h1{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.1;margin:2px 0 0;color:var(--silver-hi);text-wrap:balance}
.ctrl{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.seg{display:inline-flex;align-items:stretch;border:1px solid var(--line-hi);border-radius:2px;overflow:hidden}
.seg-l{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--silver-lo);padding:0 12px;display:flex;align-items:center;border-right:1px solid var(--line-hi)}
.seg button{display:flex;flex-direction:column;align-items:flex-start;padding:6px 14px;font-size:13.5px;color:var(--silver);line-height:1.2}
.seg button+button{border-left:1px solid var(--line-hi)}
.seg button small{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--silver-lo)}
.seg button[aria-pressed="true"]{background:var(--sheen);color:var(--on-ink)}
.seg button[aria-pressed="true"] small{color:var(--on-ink-2)}
.tog{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--silver);cursor:pointer;user-select:none}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:34px;height:18px;border-radius:9px;background:var(--slate);border:1px solid var(--line-hi);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--silver-lo);transition:transform .2s,background .2s}
.tog input:checked+.sw{background:var(--switch-on)}
.tog input:checked+.sw::after{transform:translateX(16px);background:var(--silver-hi)}
.tog input:focus-visible+.sw{outline:1px solid var(--silver-hi);outline-offset:3px}
.only-m{display:none}

/* studio */
.studio{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:28px;padding-block:28px 80px;align-items:start}
.desk{min-width:0}
.paper{background:var(--paper);color:var(--ink);max-width:860px;margin:0 auto;padding:64px clamp(22px,6vw,80px) 72px;font-family:var(--serif);font-size:16.5px;line-height:1.62;box-shadow:0 0 0 1px var(--paper-edge),0 30px 60px -20px var(--shadow)}
.ph{background:var(--ph);border-radius:2px;padding:0 3px;color:var(--ink-2)}
.cover{text-align:center;padding-bottom:36px;margin-bottom:10px}
.cv-kicker{font-family:var(--sans);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3)}
.cv-title{font-family:var(--display);font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1.1;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 0;color:var(--ink);text-wrap:balance}
.cv-rule{width:64px;height:1px;background:var(--ink);margin:22px auto}
.cv-date{margin:0;font-size:15px}
.sec{font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;margin:34px 0 14px;color:var(--ink)}
.parties,.recs{display:grid;gap:10px}
.pt{display:grid;grid-template-columns:44px minmax(0,1fr)}
.pn{color:var(--ink-2)}
.cl{position:relative;margin:0 -18px;padding:14px 18px 8px;border-radius:2px;transition:background .25s;cursor:pointer;outline:none}
.cl:hover{background:#f2f3f5}
.cl.on{background:#eceef1}
.cl.neg::before{content:"";position:absolute;left:-14px;top:18px;bottom:14px;width:3px;background:var(--rp);border-radius:2px}
.cl.flash{animation:flash 1.1s ease}
@keyframes flash{0%{background:#dfe3e9}100%{background:transparent}}
.cl h3{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 8px;font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.cn{min-width:32px;font-variant-numeric:lining-nums}
.ctt{flex:1;min-width:0}
.mk{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;text-transform:none;font-weight:500;color:var(--rp);border:1px solid var(--rule);background:#fff;padding:3px 9px;border-radius:999px}
.mk i{width:7px;height:7px;border-radius:50%;background:var(--rp)}
.mk em{font-style:normal;color:var(--ink-3)}
.pe{font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--ink-2);margin:0 0 10px 44px;padding:8px 12px;border-left:2px solid #c5c9cf;background:#f4f5f7}
.pe span{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.sub{display:grid;grid-template-columns:44px minmax(0,1fr);margin:0 0 10px}
.sub.solo{grid-template-columns:44px minmax(0,1fr)}
.sub.solo::before{content:""}
.sn{font-variant-numeric:lining-nums;color:var(--ink)}
.st p{margin:0 0 6px;text-align:justify;hyphens:auto}
.items{display:grid;gap:4px;margin:4px 0 6px}
.it{display:grid;grid-template-columns:36px minmax(0,1fr)}
.il{color:var(--ink-2)}
.tail{margin-top:4px}
.defs{display:grid;gap:7px;margin:6px 0 4px}
.def{margin:0;text-align:justify}
.def b{font-weight:600}
.exec{margin:40px 0 22px}
.sigs{display:grid;gap:26px}
.sig{display:grid;grid-template-columns:minmax(0,1fr) minmax(160px,220px);gap:20px;align-items:end;border-top:1px solid var(--rule);padding-top:16px;font-size:15px}
.sig-r{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.line{display:block;border-bottom:1px solid var(--ink);height:28px;margin-bottom:6px}
.wit{display:grid;margin-top:10px;font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);max-width:320px}

/* schedules */
.cl.sch{margin-top:34px;padding-top:30px;border-top:3px double #c9ccd1;border-radius:0}
.cl.sch.neg::before{top:30px}
.sch-h{text-align:center;margin:0 0 18px;display:grid;justify-items:center;gap:6px}
.sch-n{font-family:var(--sans);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3)}
.cl .sch-h h3{display:block;margin:0;font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:.06em}
.sch-h .mk{margin:4px 0 0}
.mk.ed{color:var(--ink-2)} .mk.todo{color:var(--ink-3);border-style:dashed}
.sp-h{display:grid;justify-items:center;gap:2px;margin:22px 0 12px;font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.sp-h span{font-family:var(--sans);font-size:10px;letter-spacing:.24em;color:var(--ink-3);font-weight:500}
.sub.pht{margin:14px 0 6px}
.sub.pht p{font-weight:600}
.todo-b{border:1px dashed #c5c9cf;padding:14px 16px;font-family:var(--sans);font-size:13px;color:var(--ink-2);line-height:1.5}
.tw{overflow-x:auto;margin:8px 0 14px;-webkit-overflow-scrolling:touch}
.tbl{border-collapse:collapse;width:100%;min-width:560px;font-size:14px;line-height:1.45;table-layout:fixed}
.tbl th,.tbl td{border:1px solid var(--rule);padding:7px 9px;vertical-align:top;text-align:left;overflow-wrap:anywhere}
.tbl th{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;background:#f3f4f6}
.tbl tr.grp td{font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;background:#e9ebee;color:var(--ink)}
.sig-sec{margin-top:48px;padding-top:26px;border-top:3px double #c9ccd1}
.wparts,.svlist{display:grid;gap:6px}
.wp{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);padding:10px 12px;cursor:pointer;font-size:13.5px;color:var(--silver-hi)}
.wp.fixed{cursor:default;opacity:.75}
.wp small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.wp input,.svr input{accent-color:var(--silver);width:15px;height:15px;margin:2px 0 0}
.svc-count{font-size:13px;color:var(--silver);margin:14px 0 0}
.svc-count b{font-family:var(--display);font-size:22px;color:var(--silver-hi);font-weight:600;margin-right:4px}
.svr{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.svr label{display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0;cursor:pointer;font-size:13.5px;color:var(--silver-hi)}
.svr label b{display:block;font-weight:500;font-size:10px;letter-spacing:.16em;color:var(--silver-lo)}
.svr.off label{color:var(--silver-lo)}
.svr select{background:var(--black);color:var(--silver-hi);border:1px solid var(--line-hi);font:inherit;font-size:12.5px;padding:5px 6px;border-radius:2px;flex:none}
.svr select:disabled{opacity:.4}

/* panel */
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;background:var(--onyx);border:1px solid var(--line);border-radius:2px;min-width:0}
.p-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--onyx);border-bottom:1px solid var(--line)}
.p-head .p-k{margin:0}
.p-back{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--silver-lo)}
.p-back:hover{color:var(--silver-hi)}
.p-x{margin-left:auto;font-size:24px;line-height:1;color:var(--silver-lo)}
.p-body{padding:6px 20px 26px}
.p-k{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--silver-lo);margin:16px 0 4px}
.p-t{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.08;color:var(--silver-hi);margin:0 0 10px;text-wrap:balance}
.p-d{font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--silver);margin:0 0 14px}
.law{border:1px solid var(--line-hi);background:var(--graphite);padding:12px 14px;font-size:13px;line-height:1.55;color:var(--silver);margin:12px 0}
.law span{display:block;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--silver-lo);margin-bottom:4px}

/* review */
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin:-6px 0 28px}

/* settings and review brief */

/* content review, playbook, comparison, health */
.qa{border:1px solid var(--line-hi);background:var(--graphite);padding:12px 14px;display:grid;gap:8px;font-size:13px;color:var(--silver)}
.qa-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.qa-d{font-size:12px;color:var(--silver-lo)}
.qa-st{font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line-hi);border-radius:2px;white-space:nowrap}
.qa-draft{color:var(--d3);border-color:currentColor}.qa-ok{color:var(--d1);border-color:currentColor}.qa-due{color:var(--d4);border-color:currentColor}.qa-flag{color:var(--d5);border-color:currentColor}
.qa-w{margin:0;padding-left:10px;border-left:2px solid var(--d4);line-height:1.5}.qa-w b{color:var(--silver-hi);font-weight:500}
.qa-n{margin:0;color:var(--muted);line-height:1.5}
.qa-src summary{cursor:pointer;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--silver-lo);list-style:none}

.qa-src ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:5px}

.qa-a{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.qa-a .lnk{margin:0}
.btn.sm{padding:6px 10px;font-size:10.5px}
.qa-top .pg-d{font-size:17px;max-width:75ch}
.qa-sum{display:flex;flex-wrap:wrap;gap:8px 24px;margin:6px 0 4px;font-size:12px;color:var(--silver-lo);letter-spacing:.06em;text-transform:uppercase}
.qa-sum b{font-family:var(--display);font-weight:var(--dw);font-size:24px;color:var(--silver-hi);letter-spacing:0;margin-right:6px}
.qa-wt{display:block;color:var(--d4);font-size:11.5px;margin-top:3px}
.qtbl td:nth-child(1){width:auto}.qtbl td:nth-child(2){width:16%}.qtbl td:nth-child(5){width:70px;text-align:center}
.pbtbl{min-width:900px}
.pbtbl{table-layout:fixed}.pbtbl th:nth-child(1){width:19%}.pbtbl th:nth-child(2),.pbtbl th:nth-child(3),.pbtbl th:nth-child(4){width:22%}.pbtbl th:nth-child(5){width:15%}.pbtbl td:nth-child(1),.pbtbl td:nth-child(5){width:auto}
.pbtbl select,.pbtbl input{width:100%;background:var(--black);color:var(--silver-hi);border:1px solid var(--line-hi);font:inherit;font-size:12.5px;padding:6px 6px;border-radius:2px}
.pbline{border-left:3px solid var(--rd,var(--line-hi));padding:6px 10px;margin:10px 0;font-size:13px;color:var(--silver)}
.pbline b{color:var(--silver-hi);font-weight:500}
.pb-pref{--rd:var(--d1)}.pb-fall{--rd:var(--d2)}.pb-walk{--rd:var(--d3)}.pb-out{--rd:var(--d5);background:rgba(220,90,100,.08)}
.t.pbp{color:var(--d1);border-color:currentColor}.t.pbf{color:var(--d2);border-color:currentColor}.t.pbw{color:var(--d3);border-color:currentColor}.t.pbo{color:var(--d5);border-color:currentColor}
.mk.pbo{color:var(--p5);border-color:#e7c3c8}
.lnk.inline{display:inline;margin:0;font-size:inherit;letter-spacing:0;text-transform:none;text-decoration:underline}
.cmpbox{border:1px solid var(--line-hi);background:var(--onyx);padding:20px;margin-top:22px;display:grid;gap:6px;justify-items:start}

.paper .rp.untr::before{content:"Not tracked";display:inline-block;font-family:var(--sans);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#b3261e;border:1px solid #e6b8b4;padding:1px 6px;margin-right:8px;vertical-align:2px}

.mxt th:nth-child(1){width:42%}.mxt th:nth-child(2){width:16%}.mxt th:nth-child(3){width:16%}.mxt th:nth-child(4){width:12%}.mxt th:last-child{width:14%}
.mxt td small{display:block;color:var(--silver-lo);font-size:12px;margin-top:2px}

.mx-rounds>button.on{background:var(--sheen);color:var(--on-ink);border-color:transparent}.mx-rounds>button.on small{color:var(--on-ink-2)}
.mx-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

.mx-chip b{color:var(--silver-hi)}
.mx-chip.s-open{border-color:var(--accent)}.mx-chip.s-agreed{border-color:var(--d1)}.mx-chip.s-conceded{border-color:var(--d4)}

.mxi td{vertical-align:top}.mxi td:first-child{color:var(--silver-lo);padding-top:16px}
.mxi tr.s-agreed td:first-child{box-shadow:inset 3px 0 0 var(--d1)}.mxi tr.s-conceded td:first-child{box-shadow:inset 3px 0 0 var(--d4)}.mxi tr.s-open td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

/* Century Gothic is wide and geometric: tighten display sizes slightly and keep weights light */

label.bk-file{cursor:pointer}
.bk-warn:empty{display:none}

/* ============================================================
   INTERFACE REFRESH: moving light background, defined controls
   ============================================================ */
:root{--r:8px;--r-sm:6px;--card:rgba(30,21,23,.72);--card-hi:rgba(42,29,33,.9);--edge:rgba(220,170,178,.16);--edge-hi:rgba(220,170,178,.42);
  --beam:rgba(255,226,233,.075);--orb1:rgba(122,43,58,.34);--orb2:rgba(220,170,178,.10);--lift:0 14px 34px -14px rgba(0,0,0,.75),0 0 0 1px var(--edge-hi);--press:0 4px 10px -6px rgba(0,0,0,.6)}
:root[data-mode="light"]{--card:rgba(255,253,250,.82);--card-hi:#FFFFFF;--edge:rgba(122,43,58,.13);--edge-hi:rgba(122,43,58,.38);
  --beam:rgba(255,255,255,.85);--orb1:rgba(238,207,212,.75);--orb2:rgba(255,236,228,.9);--lift:0 14px 30px -16px rgba(80,30,40,.35),0 0 0 1px var(--edge-hi);--press:0 3px 8px -5px rgba(80,30,40,.35)}

/* background: two slow glows and a soft beam of light that sweeps across */
#bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#bgfx .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9}
#bgfx .orb.a{width:62vmax;height:62vmax;left:-18vmax;top:-26vmax;background:radial-gradient(circle,var(--orb1),transparent 65%);animation:drift-a 38s ease-in-out infinite alternate}
#bgfx .orb.b{width:52vmax;height:52vmax;right:-20vmax;bottom:-24vmax;background:radial-gradient(circle,var(--orb2),transparent 65%);animation:drift-b 46s ease-in-out infinite alternate}
#bgfx .beam{position:absolute;top:-40%;left:0;width:34vw;min-width:280px;height:180%;background:linear-gradient(90deg,transparent 0%,var(--beam) 50%,transparent 100%);filter:blur(18px);transform:translateX(-60vw) rotate(14deg);animation:sweep 14s cubic-bezier(.45,.05,.35,1) infinite}
@keyframes sweep{0%{transform:translateX(-60vw) rotate(14deg)}55%,100%{transform:translateX(140vw) rotate(14deg)}}
@keyframes drift-a{to{transform:translate(14vmax,10vmax) scale(1.08)}}
@keyframes drift-b{to{transform:translate(-12vmax,-8vmax) scale(1.1)}}
@media (prefers-reduced-motion:reduce){#bgfx .beam{display:none}#bgfx .orb{animation:none}*{transition:none!important}}

/* let the background show between surfaces */
.hero{background:transparent;border-bottom-color:var(--edge)}
.tabs{background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom-color:var(--edge)}
.tools{background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom-color:var(--edge)}
.bar{border-bottom-color:var(--edge)}

/* shared interaction model: every clickable thing lifts on hover, presses on click, rings on focus */
.btn,.ag,.mx-card,.nrow,.gl,.presets button,.seg button,.tabs-in>button,.mx-rounds>button,.nav button,.gear,.opt button,.lnk,.back{transition:transform .14s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease,color .18s ease,filter .18s ease}
button:focus-visible,a:focus-visible,label.btn:focus-within,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* buttons */
.btn{border-radius:var(--r-sm);padding:10px 18px;min-height:40px;justify-content:center;font-weight:600;letter-spacing:.1em}
.btn.silver{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 16px -8px rgba(0,0,0,.7)}
.btn.silver:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 22px -10px rgba(0,0,0,.8)}
.btn.ghost{background:var(--card);border:1px solid var(--edge-hi);color:var(--silver-hi)}
.btn.ghost:hover{transform:translateY(-1px);background:var(--card-hi);border-color:var(--accent);color:var(--silver-hi)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.985);box-shadow:var(--press);filter:brightness(.97)}
.btn.sm{min-height:34px}
.lnk{display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:2px 2px;text-decoration:none;font-weight:600}
.lnk:hover{color:var(--silver-hi);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.lnk:active{transform:translateY(1px)}
.lnk.inline{display:inline;padding:0;font-weight:inherit}
.back{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--edge);border-radius:999px;background:var(--card)}
.back:hover{border-color:var(--edge-hi);color:var(--silver-hi);transform:translateX(-2px)}
.gear{border-radius:var(--r-sm)!important}
.gear:hover{border-color:var(--accent)!important;color:var(--silver-hi)}
.nav button{border-radius:var(--r-sm) var(--r-sm) 0 0}
.nav button:hover{background:var(--card)}
.nav button.on{border-bottom:2px solid var(--accent)}
.tabs-in>button{border-radius:999px;padding:9px 16px}
.tabs-in>button:not(.on){border:1px solid var(--edge);background:var(--card)}
.tabs-in>button:not(.on):hover{border-color:var(--edge-hi);transform:translateY(-1px)}
.tabs-in>button:active{transform:translateY(1px)}
.seg{border-radius:var(--r-sm);border-color:var(--edge-hi);background:var(--card)}
.seg button:not([aria-pressed="true"]):hover{background:var(--card-hi)}
.seg button:active{transform:scale(.98)}
.presets button{border-radius:var(--r-sm);background:var(--card);border-color:var(--edge-hi)}
.presets button:not(.on):hover{border-color:var(--accent);transform:translateY(-1px)}
.presets button:active{transform:scale(.98)}
.mx-rounds>button{border-radius:var(--r-sm)}
.mx-rounds>button:not(.on):hover{border-color:var(--edge-hi);transform:translateY(-1px)}

/* agreements: each one is a clear card */
.branches{gap:30px}
.branch h3{padding-left:0;margin-bottom:12px}
.branch h3::before{display:none}
.branch ul{border-left:0;padding:0;display:grid;gap:10px}
.ag{background:var(--card);border:1px solid var(--edge);border-radius:var(--r);padding:16px 44px 16px 18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ag::before{display:none}
.ag::after{content:"›";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:24px;line-height:1;color:var(--silver-lo);transition:transform .18s ease,color .18s ease}
.ag:hover{transform:translateY(-2px);background:var(--card-hi);border-color:var(--edge-hi);box-shadow:var(--lift)}
.ag:hover::after{color:var(--accent);transform:translate(4px,-50%)}
.ag:hover .ag-n{text-decoration:none;color:var(--silver-hi)}
.ag:active{transform:translateY(0) scale(.99);box-shadow:var(--press)}
.ag-n{font-size:18px;font-weight:600}
.ag-p{color:var(--accent)}

/* other cards and rows */
.mx-card{border-radius:var(--r);background:var(--card);border-color:var(--edge);backdrop-filter:blur(6px);position:relative;padding-right:44px}
.mx-card::after{content:"›";position:absolute;right:18px;top:22px;font-size:24px;color:var(--silver-lo);transition:transform .18s,color .18s}
.mx-card:hover{transform:translateY(-2px);border-color:var(--edge-hi);box-shadow:var(--lift);background:var(--card-hi)}
.mx-card:hover::after{color:var(--accent);transform:translateX(4px)}
.mx-card:active{transform:scale(.99);box-shadow:var(--press)}
.nrow{border-radius:var(--r-sm);border-bottom-color:var(--edge);padding:10px 8px}
.nrow:hover{background:var(--card-hi);box-shadow:inset 3px 0 0 var(--accent)}
.nrow:active{transform:scale(.99)}
.gl{border-radius:var(--r-sm)}
.gl:hover{background:var(--card-hi);box-shadow:inset 3px 0 0 var(--accent)}
.opt{border-radius:var(--r-sm)}
.panel,.dlg,.cx-f,.deal-sum{border-radius:var(--r)}
.panel{border-color:var(--edge);background:var(--onyx)}
.dlg{border-color:var(--edge-hi)}
.cl.neg{cursor:pointer}
.cl.neg:hover{box-shadow:inset 3px 0 0 var(--rd,var(--accent))}
input,select,textarea{border-radius:var(--r-sm)!important;transition:border-color .18s ease,box-shadow .18s ease}
input:hover,select:hover,textarea:hover{border-color:var(--edge-hi)}
.counts{gap:10px}
.counts span{background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:6px 14px}
.cat>h2::after{background:linear-gradient(90deg,var(--edge-hi),transparent)}
.paper{border-radius:4px}
.nav button{white-space:nowrap}
.mx input,.mx select{min-height:40px}
@media (max-width:700px){
  .bar .gear{order:1;margin-left:auto}
  .bar .nav{order:2}
  .counts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .counts span{padding:6px 12px;font-size:10px}
  .hero-cta .btn{flex:1 1 auto}
}

.pf select{width:100%;background:var(--black);border:1px solid var(--line-hi);color:var(--silver-hi);font:inherit;font-size:13.5px;padding:8px 10px;border-radius:var(--r-sm,6px);min-height:38px}
.pf-n{color:var(--silver-lo);font-size:12px;line-height:1.45}
.sig-r .line+.line,.sig-r .line:not(:first-child){margin-top:22px}
/* published notices and letters */
.paper .intro p{margin:0 0 12px;line-height:1.7}
.paper .lt-head{margin:0 0 26px;font-size:15px;line-height:1.6}
.paper .lt-from{text-align:right;margin-bottom:18px}
.paper .lt-date{text-align:right;margin:0 0 18px}
.paper .lt-to{margin-bottom:18px}
.paper .lt-via{font-style:italic;margin:0 0 14px}
.paper .lt-re{margin:14px 0 0}
.paper .lt-p{margin:0 0 14px;line-height:1.7}
.paper .cl.lt h3{font-size:14px;letter-spacing:.02em}
.paper .lt-sign{margin-top:28px;line-height:1.7}.paper .lt-sig{margin-top:44px}
/* ============================================================
   COUNTERPART SME
   ============================================================ */
.bar .brand .sub{color:var(--accent)}
.sme{max-width:1100px;margin:0 auto;padding-bottom:80px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tile{display:grid;gap:6px;text-align:left;padding:20px 22px;border:1px solid var(--edge);background:var(--card);border-radius:var(--r);backdrop-filter:blur(6px);transition:transform .14s,box-shadow .18s,border-color .18s,background-color .18s}
.tile b{font-size:17px;color:var(--silver-hi);font-weight:600}
.tile span{color:var(--silver);font-size:13.5px;line-height:1.45}
.tile:hover{transform:translateY(-2px);border-color:var(--edge-hi);box-shadow:var(--lift);background:var(--card-hi)}
.tile:active{transform:scale(.99)}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wiz{max-width:860px;padding-top:28px}
.steps{list-style:none;margin:0 0 18px;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--silver-lo);padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--edge);background:var(--card)}
.steps li span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--graphite);color:var(--silver);font-size:11px;letter-spacing:0}
.steps li.on{border-color:var(--accent);color:var(--silver-hi)}
.steps li.on span{background:var(--accent);color:var(--on-ink)}
.steps li.done span{background:var(--d1);color:#fff}
.wiz-card{background:var(--onyx);border:1px solid var(--edge);border-radius:12px;padding:clamp(20px,4vw,40px);box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.wiz-card h2{font-family:var(--display);font-weight:500;font-size:clamp(26px,3.4vw,34px);color:var(--silver-hi);margin:0 0 8px;line-height:1.15}
.wiz-d{color:var(--silver);margin:0 0 22px;font-size:15px}
.wiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:10px}
.q{font-size:15px;color:var(--silver-hi);margin:22px 0 10px;font-weight:600}
.opts-l{display:grid;gap:10px}
.opts-l.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt-l{display:grid;gap:4px;text-align:left;padding:15px 18px;border:1px solid var(--edge-hi);border-radius:var(--r);background:var(--card);transition:transform .14s,border-color .18s,box-shadow .18s,background-color .18s;position:relative}
.opt-l b{color:var(--silver-hi);font-size:15.5px;font-weight:600}
.opt-l span{color:var(--silver-lo);font-size:13px}
.opt-l:hover{border-color:var(--accent);transform:translateY(-1px);background:var(--card-hi)}
.opt-l:active{transform:scale(.99)}
.opt-l.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--card-hi)}
.opt-l.chk{padding-left:50px}
.opt-l.chk::before{content:"";position:absolute;left:18px;top:50%;width:18px;height:18px;margin-top:-9px;border:1.5px solid var(--edge-hi);border-radius:5px;background:var(--black)}
.opt-l.chk.on::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--onyx)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:9px 16px;border-radius:999px;border:1px solid var(--edge-hi);background:var(--card);color:var(--silver);font-size:13.5px;transition:all .16s}
.pill:hover{border-color:var(--accent);color:var(--silver-hi)}
.pill.on{background:var(--sheen);color:var(--on-ink);border-color:transparent}
.ask{margin-top:22px;padding-top:6px;border-top:1px solid var(--edge)}
.ask h3{font-size:15px;color:var(--silver-hi);margin:14px 0 10px}
.pp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pp .fld.wide{grid-column:1/-1}
.sme .fld,.wiz .fld,.dlg .fld{display:grid;gap:6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--silver-lo)}
.sme input,.sme select,.wiz input,.wiz select,.dlg .pp input,.dlg .pp select{width:100%;background:var(--black);border:1px solid var(--line-hi);color:var(--silver-hi);font:inherit;font-size:14.5px;letter-spacing:0;text-transform:none;padding:10px 12px;border-radius:var(--r-sm);min-height:44px}
.sme input:disabled{opacity:.6}
.pf legend{color:var(--silver-hi);font-size:13px;padding:0 4px}
.counts span b{color:var(--silver-hi)}
.chip{font-style:normal;display:inline-block;padding:3px 10px;border-radius:999px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--edge-hi)}
.chip.st-draft{color:var(--silver)}
.chip.st-out{color:var(--d3);border-color:var(--d3)}
.chip.st-signed{color:var(--d1);border-color:var(--d1)}
.sv{font-size:11px;letter-spacing:.08em;text-transform:none;color:var(--silver-lo);margin-left:8px}
.sv.ok::before{content:"● ";color:var(--d1)}
.due{display:grid;gap:8px}
.due-r{display:grid;grid-template-columns:180px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;padding:14px 18px;border:1px solid var(--edge);border-radius:var(--r);background:var(--card)}
.due-r b{color:var(--silver-hi)}.due-r span{color:var(--silver)}.due-r em{font-style:normal;color:var(--silver-lo);font-size:12.5px}
.due-r.soon{border-color:var(--d4)}.due-r.soon em{color:var(--d4);font-weight:600}
.due-r:hover{border-color:var(--edge-hi);background:var(--card-hi)}
.sum-intro{display:grid;gap:16px;margin-bottom:18px}
.sum-intro p{font-family:var(--serif);font-size:17px;color:var(--silver);line-height:1.6;margin:0;max-width:70ch}
.sum-next{display:flex;gap:10px;flex-wrap:wrap}
.kt{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:16px}
.kt-r{border:1px solid var(--edge);border-top:3px solid var(--rd);border-radius:var(--r);background:var(--card);padding:16px 18px;display:grid;gap:8px;align-content:start}
.kt-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.kt-h b{color:var(--silver-hi);font-size:16px}
.kt-d{color:var(--silver-lo);font-size:13px;margin:0}
.kt-o{margin:0;color:var(--silver-hi);font-size:14.5px}
.kt-o span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--silver-lo);margin-bottom:2px}
.kt-w{margin:0;color:var(--silver);font-size:13.5px;line-height:1.5}
.kt-a{display:flex;gap:8px;margin-top:4px}
.kt-a .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.dl{display:grid;gap:8px}
.dl-r{display:grid;grid-template-columns:minmax(0,1fr) 190px 110px 28px;gap:10px;align-items:center}
.dl-n{color:var(--silver-lo);font-size:12.5px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.sg-p{border:1px dashed var(--edge-hi);border-radius:var(--r);padding:16px 18px;display:grid;gap:6px;background:var(--card)}
.sg-p.done{border-style:solid;border-color:var(--d1)}
.sg-p b{color:var(--silver-hi)}.sg-p span{color:var(--silver-lo);font-size:13px}
.sg-p img{max-width:100%;height:70px;object-fit:contain;object-position:left;background:#fff;border-radius:6px;padding:4px}
.sg-form,.sg-inv{border:1px solid var(--edge);border-radius:var(--r);background:var(--onyx);padding:20px 22px;margin:14px 0}
.sg-form h3,.sg-inv h3{margin:0 0 12px;color:var(--silver-hi);font-size:17px}
.pad{display:grid;gap:12px;max-width:680px}
.pad-tabs{display:flex;gap:8px}
#sg-pad{width:100%;height:auto;aspect-ratio:640/180;background:#fff;border-radius:var(--r-sm);border:1px solid var(--line-hi);touch-action:none;cursor:crosshair}
.pad-f{display:flex;justify-content:flex-end}
.agree{display:flex;gap:10px;align-items:flex-start;color:var(--silver);font-size:14px;text-transform:none;letter-spacing:0}
.agree input{width:18px!important;height:18px;min-height:0!important;margin-top:2px;accent-color:#9C4A58}
.howto{color:var(--silver);padding-left:20px;line-height:1.7}
.code{display:flex;gap:10px;align-items:center;margin:8px 0 6px}
.code code{font-size:18px;letter-spacing:.08em;padding:10px 14px;border-radius:var(--r-sm);background:var(--black);border:1px solid var(--edge-hi);color:var(--silver-hi);user-select:all}
.law.ok{border-left-color:var(--d1)}
.paper.plain{white-space:normal}
.paper.plain p{margin:0 0 12px}
.disc{color:var(--silver-lo);font-size:12.5px;margin-top:26px;max-width:80ch}
@media (max-width:760px){.opts-l.three,.pp,.sg{grid-template-columns:1fr}.due-r{grid-template-columns:1fr}.dl-r{grid-template-columns:1fr 1fr}.steps li{font-size:0;padding:4px}.steps li span{font-size:11px}}

.sme-disc{margin-top:18px}.sme-disc p{margin:0;padding:12px 16px;border:1px solid var(--line-hi);border-left:2px solid var(--d3);background:var(--graphite);font-size:13px;line-height:1.55;color:var(--silver)}
.sme-disc b{color:var(--silver-hi);font-weight:600}.sme-disc .lnk,.wiz-disc .lnk{font-size:inherit}
.wiz-disc{margin:14px auto 0;max-width:760px}
.ab p{margin:0 0 10px;line-height:1.6;color:var(--silver)}
.look{border:1px solid var(--line-hi);border-left:2px solid var(--d4);background:var(--graphite);padding:12px 14px;margin:6px 0 4px}.look b{display:block;color:var(--silver-hi);font-weight:600;margin-bottom:4px}.look p{margin:0;font-size:13px;line-height:1.55;color:var(--silver)}
.look.ok{border-left-color:var(--d1)}

/* ================= Counterpart SME look: aubergine night, blush accent, soft pills ================= */
:root{
  --black:#170F1C; --onyx:#1E1524; --graphite:#241A2B; --slate:#2E2236;
  --line:rgba(255,255,255,.07); --line-hi:rgba(255,255,255,.12);
  --silver-hi:#F7F3F8; --silver:#DCD3E0; --silver-lo:#A99DB0; --muted:#A99DB0;
  --sheen:#F2B5CB; --on-ink:#1C1020; --on-ink-2:#4A3550; --sheen-text:linear-gradient(#F7F3F8,#F7F3F8);
  --accent:#F2B5CB; --bar:rgba(23,15,28,.82); --glow:#3E2A4A; --switch-on:#8C5A78;
  --card:#211827; --card-hi:#2A1F31; --edge:rgba(255,255,255,.07); --edge-hi:rgba(255,255,255,.14);
  --sheet:#0F0A13; --raise:#241A2B; --raise-hi:#30243A;
  --r:20px; --r-sm:14px; --lift:none; --press:none;
  --dw:700; --wm-ls:-.01em; --wm-fs:20px;
}
:root[data-mode="light"]{
  --black:#F5F2F6; --onyx:#FFFFFF; --graphite:#EFEAF1; --slate:#E6DFE9;
  --line:rgba(28,16,32,.08); --line-hi:rgba(28,16,32,.14);
  --silver-hi:#1C1020; --silver:#3D3243; --silver-lo:#6E6375; --muted:#6E6375;
  --sheen:#1C1020; --on-ink:#FFFFFF; --sheen-text:linear-gradient(#1C1020,#1C1020);
  --accent:#C0577F; --bar:rgba(245,242,246,.86); --glow:#E9DDEE; --switch-on:#1C1020;
  --card:#FFFFFF; --card-hi:#FFFFFF; --edge:rgba(28,16,32,.08); --edge-hi:rgba(28,16,32,.16);
  --sheet:#FFFFFF; --raise:#F1ECF3; --raise-hi:#E8E1EC;
}
#bgfx{display:none}
body{background:var(--black);font-size:15px}
/* sentence case everywhere outside the document itself */
body :not(.paper):not(.paper *){text-transform:none!important;letter-spacing:normal}
/* header */
.bar{background:var(--bar);border-bottom:0;gap:18px;padding-block:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.wm{font-weight:700;font-size:20px;letter-spacing:-.01em!important;background:none;color:var(--silver-hi)}
.bar .brand .sub{border:0;padding:3px 9px;border-radius:999px;background:var(--raise);color:var(--silver-lo);font-size:12px;font-weight:600}
.nav{gap:2px}
.nav button{font-size:14px;color:var(--silver-lo);padding:8px 14px;border:0!important;border-radius:999px}
.nav button:hover{background:var(--raise);color:var(--silver-hi)}
.nav button.on{background:var(--raise-hi);color:var(--silver-hi)}
.gear{border:0!important;border-radius:999px!important;background:var(--raise);font-size:14px;padding:8px 14px;color:var(--silver)}
.gear:hover{background:var(--raise-hi)}
/* buttons */
.btn{border-radius:999px;font-size:14.5px;font-weight:600;padding:12px 22px;min-height:46px;box-shadow:none!important;filter:none!important}
.btn.silver{background:var(--sheen);color:var(--on-ink)}
.btn.silver:hover:not(:disabled){transform:none;background:color-mix(in srgb,var(--sheen) 88%,#fff)}
.btn.ghost{background:var(--raise);border:0;color:var(--silver-hi)}
.btn.ghost:hover{transform:none;background:var(--raise-hi)}
.btn:active:not(:disabled),.qa-b:active .qa-i,.lrow:active,.pop-t:active,.mx-card:active{transform:scale(.97)}
.btn.sm{min-height:36px;padding:8px 16px;font-size:13.5px}
.lnk{color:var(--silver-hi);text-decoration:underline;text-decoration-color:var(--edge-hi);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* labels */
.kicker,.p-sub,.p-k,.crumb,.qa-d,.svc-count,.est-note{font-size:13px!important;color:var(--silver-lo)}
.p-sub{border-bottom:0;margin:28px 0 10px;font-weight:600;color:var(--silver)!important}
/* home */
.s-hero{position:relative;overflow:hidden;background:radial-gradient(900px 420px at 85% -10%,var(--glow) 0%,transparent 70%)}
.s-hero::after{content:"";position:absolute;left:38%;right:-20%;top:-140px;height:420px;border-top:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:50%;transform:rotate(-7deg);pointer-events:none;opacity:.7}
.s-hero-in{max-width:1080px;margin:0 auto;padding:72px 0 56px;position:relative;z-index:1}
.s-greet{margin:0 0 10px;font-size:17px;font-weight:600;color:var(--silver-lo)}
.s-hero h1{margin:0 0 16px;font-size:clamp(34px,5.2vw,58px);line-height:1.04;font-weight:700;letter-spacing:-.025em!important;color:var(--silver-hi);max-width:20ch;text-wrap:balance}
.s-sub{margin:0;max-width:56ch;font-size:17px;line-height:1.55;color:var(--silver)}
.s-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.s-sheet{background:var(--sheet);border-radius:28px 28px 0 0;position:relative}
.s-sheet::before{content:"";position:absolute;top:10px;left:50%;width:44px;height:4px;margin-left:-22px;border-radius:4px;background:var(--edge-hi)}
.s-sheet-in{max-width:1080px;margin:0 auto;padding:40px 0 24px}
.qa-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:620px;margin:0 auto 28px}
.qa-b{display:grid;justify-items:center;gap:10px;color:var(--silver-hi);font-size:14px;font-weight:600;text-align:center}
.qa-i{width:68px;height:68px;border-radius:50%;background:var(--raise);display:grid;place-items:center;transition:background-color .15s,transform .12s}
.qa-i svg{width:26px;height:26px}
.qa-b:hover .qa-i{background:var(--raise-hi)}
.lrows{display:grid;gap:2px;margin:0 0 30px}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) 20px;gap:14px;align-items:center;text-align:left;padding:14px 10px;border-radius:var(--r-sm);color:var(--silver-hi);transition:background-color .15s,transform .12s}
.lrow:hover{background:var(--raise)}
.lrow-i{width:44px;height:44px;display:grid;place-items:center;color:var(--silver)}.lrow-i svg{width:26px;height:26px}
.lrow-t b{display:block;font-size:18px;font-weight:700}.lrow-t small{display:block;font-size:14.5px;color:var(--silver-lo);margin-top:2px}
.lrow-c{width:20px;height:20px;color:var(--silver-lo)}
.s-h{font-size:20px;font-weight:700;margin:6px 10px 14px;color:var(--silver-hi)}
.pop{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pop-t{display:grid;gap:6px;align-content:start;text-align:left;padding:18px;border-radius:var(--r);background:var(--raise);color:var(--silver-hi);min-height:120px;transition:background-color .15s,transform .12s}
.pop-t:hover{background:var(--raise-hi)}.pop-t b{font-size:16px;font-weight:700;line-height:1.3}.pop-t small{color:var(--silver-lo);font-size:13.5px;line-height:1.45}
.tabs{background:var(--sheet)!important;border-bottom:1px solid var(--edge);top:calc(env(safe-area-inset-top,0px) + 66px)}
.tabs-in>button{border:0!important;border-radius:999px;background:var(--raise)!important;color:var(--silver);font-size:14px;padding:9px 16px}
.tabs-in>button.on{background:var(--silver-hi)!important;color:var(--black)}
.search input{border-radius:999px!important;background:var(--raise)!important;border:0!important;padding:11px 18px!important;font-size:14.5px}
.home-list{background:var(--sheet)}
.cat>h2{font-size:22px;font-weight:700}.cat>h2::after{display:none}
/* cards and lists */
.ag,.mx-card,.gl,.ci,.gi{border-radius:var(--r)!important;border:0!important;background:var(--raise)!important;box-shadow:none!important}
.ag:hover,.mx-card:hover,.gl:hover{background:var(--raise-hi)!important;transform:none!important}
.nrow{border-bottom:0!important;border-radius:var(--r-sm)}.nrow:hover{background:var(--raise)!important;box-shadow:none!important}
.chip,.pill{border-radius:999px!important}
.pill{border:0!important;background:var(--raise)!important}.pill.on{background:var(--silver-hi)!important;color:var(--black)!important}
/* panels, dialogs, inputs */
.panel,.p-head{background:var(--onyx)}
.dlg{border-radius:24px!important;border:0!important;background:var(--onyx)!important}
.fld input,.fld select,.fld textarea{border-radius:12px!important;background:var(--raise)!important;border:1px solid transparent!important}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent)!important}
.opt{border:0!important;border-radius:var(--r-sm)!important;background:var(--raise)!important}
.qa,.df,.look,.sme-disc p,.brief,.ai-box,.law{border-radius:var(--r-sm)!important;border:0!important;background:var(--raise)!important}
.df.warn,.look:not(.ok){box-shadow:inset 3px 0 0 var(--d4)!important}
.s-foot{margin:28px 10px 0;max-width:72ch;font-size:13.5px;line-height:1.6;color:var(--silver-lo)}.s-foot .lnk{margin:0;font-size:inherit;color:var(--silver)}
.wiz-card{border-radius:24px!important;border:0!important;background:var(--onyx)!important}
.tile,.opt-l{border-radius:var(--r-sm)!important;border:0!important;background:var(--raise)!important}
.tile.on,.opt-l.on{box-shadow:inset 0 0 0 2px var(--accent)!important}
.steps li span{border-radius:50%}
.hero{background:radial-gradient(900px 380px at 85% -10%,var(--glow) 0%,transparent 70%)!important;border-bottom:0!important}
.hero h1{font-weight:700!important;letter-spacing:-.025em!important}
.tools{background:var(--black);border-bottom:1px solid var(--edge)}
@media (max-width:720px){
  .s-hero-in{padding:40px 0 36px}.s-hero h1{font-size:34px}.s-sub{font-size:16px}
  .qa-row{gap:6px}.qa-i{width:60px;height:60px}.qa-b{font-size:13px}
  .s-sheet-in{padding-top:34px}.lrow-t b{font-size:16.5px}.lrow-t small{font-size:13.5px}
  .s-hero::after{left:20%;top:-180px}
}
@media (prefers-reduced-motion:reduce){.btn,.qa-i,.lrow,.pop-t{transition:none}}
/* page base is the sheet; the hero carries the colour */
:root{--black:#120C16;--sheet:#120C16}
:root[data-mode="light"]{--black:#FFFFFF;--sheet:#FFFFFF;--onyx:#FFFFFF}

 ["Indemnity with conduct and remedies",0,[["{S} shall indemnify {B} against all losses, liabilities, damages, costs (including reasonable legal fees) and expenses arising out of or in connection with any IPR Claim, provided that {B}:",["notifies {S} in writing of the IPR Claim promptly, and in any event within ten (10) Business Days of becoming aware of it;","makes no admission and enters into no settlement in relation to the IPR Claim without {S}'s prior written consent;","allows {S} sole conduct of the defence and settlement of the IPR Claim at {S}'s cost; and","gives {S} such reasonable assistance as it requests, at {S}'s cost."]],["If any IPR Claim is made, or in {S}'s reasonable opinion is likely to be made, {S} may at its option and expense:",["procure for {B} the right to continue using the affected items;","modify or replace the affected items so that they become non-infringing without any material reduction in performance or functionality; or","if neither of the above is reasonably practicable, terminate this Agreement in respect of the affected items and refund to {B} any Charges paid in advance for them."]]],
  "Solid protection, but you must follow the notice and conduct steps exactly or risk losing the cover.","The market position. You run the litigation and have ways to limit the damage if a claim lands."],
 ["Capped, with exclusions",1,["{S} shall indemnify {B} against all losses, liabilities, damages, costs and expenses arising out of or in connection with any IPR Claim, subject to {B} complying with the notice and conduct requirements reasonably specified by {S}.",["Clause {N}.1 shall not apply to the extent that an IPR Claim arises from:",["any modification of the affected items not made by or on behalf of {S};","{S}'s compliance with any specification, design or instruction provided by {B}; or","use of the affected items in combination with any item not supplied, or approved in writing, by {S}."]],"{S}'s liability under this clause is subject to the limitations of liability in this Agreement."],
  "Real gaps. Many infringement claims arise from how items are configured or combined, and those are excluded.","You only answer for problems you actually caused, and within your cap."],
 ["Fix or refund only",2,[["If an IPR Claim is made, {S}'s sole obligation, and {B}'s sole and exclusive remedy, shall be for {S}, at its option and expense, to:",["procure for {B} the right to continue using the affected items;","modify or replace the affected items so that they become non-infringing; or","terminate this Agreement in respect of the affected items and refund any Charges paid in advance for them."]]],
  "If you are sued, you bear the legal costs and any damages yourself.","Your only exposure is the cost of a fix or a refund."]]},

term:{t:"Termination for Convenience",g:["termination","penalties"],
 d:"Says whether a party can end the contract early without the other side having done anything wrong.",
 n:"A fee payable on exercising a right to terminate, rather than on breach, is generally outside the rule against penalties (Cavendish Square Holding v Makdessi [2015] UKSC 67).",
 o:[
 ["{B} may exit on 30 days",-2,["{B} may terminate this Agreement, in whole or in part, at any time by giving not less than thirty (30) days' written notice to {S}.","{B} shall have no liability to {S} in respect of any termination under clause {N}.1, other than to pay any sums which have accrued due to {S} at the date of termination."],
  "Maximum flexibility. You can leave as soon as your needs change.","Revenue becomes unpredictable, and you may lose the customer before recovering your set-up costs."],
 ["Mutual, after a minimum period",0,["Either party may terminate this Agreement by giving not less than ninety (90) days' written notice to the other, provided that no such notice may expire before the first anniversary of the Effective Date."],
  "You are committed for a year, then free to leave on fair notice.","A guaranteed first year and reasonable warning of any exit."],
 ["Exit on payment of a fee",1,["{B} may terminate this Agreement by giving not less than ninety (90) days' written notice to {S}, subject to paying {S} the Termination Fee within thirty (30) days of the date of termination.","The parties agree that the Termination Fee is proportionate to {S}'s legitimate interest in the continued performance of this Agreement."],
  "You can leave, but it will cost you a meaningful sum.","You recover much of the revenue you were counting on.",{"Termination Fee":"an amount equal to fifty per cent (50%) of the Charges that would have been payable from the date of termination until the expiry of the Initial Term"}],
 ["No early exit",2,["Neither party may terminate this Agreement for convenience before the expiry of the Initial Term."],
  "You are locked in for the full term, even if the contract stops suiting your business.","Your revenue is secure for the whole term."]]},

tmb:{t:"Termination for Cause",g:["termination"],
 d:"Says when a party can end the contract because the other has broken it or become insolvent.",
 n:"Without an express right, a party can terminate only for repudiatory breach, which is a high bar. Under the Corporate Insolvency and Governance Act 2020, a supplier generally cannot terminate a supply contract because the customer enters an insolvency procedure (Insolvency Act 1986, s.233B).",
 pre:["Either party may terminate this Agreement with immediate effect by giving written notice to the other party if the other party suspends, or threatens to suspend, payment of its debts, is unable to pay its debts within the meaning of section 123 of the Insolvency Act 1986, has an administrator, receiver or liquidator appointed, enters into any composition or arrangement with its creditors, or is subject to any analogous event in any jurisdiction, in each case to the extent permitted by law."],
 o:[
 ["Low threshold for {B}",-2,[["{B} may terminate this Agreement with immediate effect by giving written notice to {S} if {S}:",["commits any breach of this Agreement and fails to remedy it within ten (10) Business Days of being notified in writing to do so; or","commits a material breach of this Agreement, or a series of breaches which together amount to a material breach, whether or not capable of remedy."]]],
  "An easy exit if the other side underperforms.","You could lose the contract over minor or one-off problems."],
 ["Material breach, 30-day cure",0,["Either party may terminate this Agreement with immediate effect by giving written notice to the other party if the other party commits a material breach of this Agreement which is irremediable or, if remediable, which it fails to remedy within thirty (30) days of being notified in writing to do so."],
  "The market position. A clear exit, with a fair window for the other side to put things right.","A fair standard, and time to fix problems before you lose the contract."],
 ["Material breach after escalation",1,["Either party may terminate this Agreement by giving written notice to the other party if the other party commits a material breach of this Agreement which it fails to remedy within sixty (60) days of being notified in writing to do so, provided that the matter has first been referred for resolution under the dispute resolution procedure in this Agreement."],
  "You may have to live with poor performance for two months or more before you can leave.","Real time and a process to fix problems before the contract is at risk."],
 ["Narrow rights only",2,["{B} may terminate this Agreement by giving written notice to {S} only if {S} commits a material breach of this Agreement which is incapable of remedy.","{S} may terminate this Agreement by giving written notice to {B} if {B} fails to pay any undisputed amount within sixty (60) days of its due date."],
  "You are close to stuck, even when performance is poor.","Very hard for the other side to end the contract, while you keep an exit for non-payment."]]},

pay:{t:"Charges and Payment",g:["penalties"],
 d:"Sets how and when invoices are raised and paid, and what happens if payment is late or disputed.",
 n:"If a contract has no substantial remedy for late payment, the Late Payment of Commercial Debts (Interest) Act 1998 implies interest at 8% above the Bank of England base rate.",
 o:[
 ["60 days, withholding and set-off",-2,["{S} shall invoice {B} monthly in arrears for the Charges due in respect of the preceding month.","{B} shall pay each valid and properly rendered invoice within sixty (60) days of its receipt.","{B} may withhold payment of any amount which it disputes in good faith, pending resolution of the dispute.","{B} may set off any amount owed to it by {S} against any amount payable by it to {S}."],
  "You keep your cash longer and have leverage if things go wrong.","Slow cashflow, and payment can be held up by any dispute or cross-claim."],
 ["30 days, disputes notified",0,["{S} shall invoice {B} monthly in arrears for the Charges due in respect of the preceding month.","{B} shall pay each valid invoice within thirty (30) days of its receipt, save for any amount disputed in good faith which {B} notifies to {S}, with reasons, within ten (10) Business Days of receipt. {B} shall pay the undisputed balance in accordance with this clause.","Interest shall accrue on any overdue amount at two per cent (2%) a year above the Bank of England base rate from time to time, from the due date until the date of actual payment."],
  "A standard timescale, and you can hold back genuinely disputed sums if you raise them promptly.","Fair terms, and the notice requirement stops late or tactical disputes."],
 ["In advance, no set-off",1,["{S} shall invoice {B} monthly in advance.","{B} shall pay each invoice within thirty (30) days of the date of the invoice. All amounts due under this Agreement shall be paid in full without any set-off, counterclaim, deduction or withholding, other than any deduction required by law.","Interest shall accrue on any overdue amount at four per cent (4%) a year above the Bank of England base rate from time to time, accruing daily from the due date until payment, whether before or after judgment."],
  "You pay before the work is done, and you cannot hold back money even when you have a claim.","Firm terms and compensation for late payment."],
 ["Annually in advance, suspension",2,["The Charges are payable annually in advance. {S} shall invoice {B} on the Effective Date and on each anniversary of it.","{B} shall pay each invoice within fourteen (14) days of the date of the invoice, without any set-off, counterclaim, deduction or withholding.","If any amount remains unpaid seven (7) days after its due date, {S} may, without liability, suspend performance of all or any of its obligations until payment is made in full."],
  "You pay a year up front and can be cut off within days of a late payment.","The best possible cashflow and strong leverage."]]},

"war-s":{t:"Warranties",g:["warranties"],
 d:"The promises the supplier makes about how the services will be performed and what will be delivered.",
 n:"Section 13 of the Supply of Goods and Services Act 1982 implies a term that a business supplier will use reasonable care and skill. Between businesses it can be excluded only if the exclusion is reasonable.",
 df:{"Good Industry Practice":GIP_DEF},
 o:[
 ["Enhanced standard",-2,[["{S} warrants and undertakes that:",["it shall perform the Services with the highest level of skill, care and diligence and in accordance with Good Industry Practice;","the Deliverables shall conform with the Specification and be fit for any purpose expressly or impliedly made known to {S};","the Services and the Deliverables shall comply with all applicable laws; and","all personnel used to perform the Services shall be suitably skilled, experienced and qualified."]],"If {S} breaches clause {N}.1, {S} shall, at {B}'s option and without prejudice to any other right or remedy of {B}, promptly re-perform the relevant Services or refund the Charges paid for them."],
  "Wide promises, and you choose the remedy.","The highest level of skill is a tougher standard than the law implies, and fitness for purpose can make you liable even where you were careful."],
 ["Reasonable skill and care",0,[["{S} warrants that:",["it shall perform the Services with reasonable skill and care and in accordance with Good Industry Practice; and","the Deliverables shall conform in all material respects with the Specification for ninety (90) days from their acceptance."]],"{S} shall, at its own cost, promptly re-perform any Services, or correct any Deliverables, which {B} notifies to {S} as not complying with clause {N}.1 within ninety (90) days of their performance or acceptance."],
  "The market position. A measurable standard with a clear fix.","A standard you can plan around, with a defined warranty period."],
 ["Statutory standard only",2,["{S} shall perform the Services with reasonable skill and care.","Except as expressly set out in this Agreement, all warranties, conditions and other terms implied by statute or common law, including those implied by sections 13 to 16 of the Supply of Goods and Services Act 1982, are excluded to the fullest extent permitted by law."],
  "Thin protection, and no warranty that the Deliverables will actually work.","Minimal exposure, provided a court accepts the exclusion as reasonable."]]},

war:{t:"Warranties",g:["warranties"],
 d:"The promises the seller makes about the quality of what is supplied, and the remedy if it is faulty.",
 n:"Sections 13 to 15 of the Sale of Goods Act 1979 imply terms about description, quality and fitness for purpose. Between businesses these can be excluded only if reasonable, and the implied term as to title (s.12) can never be excluded.",
 o:[
 ["Full warranties, 24 months",-2,[["{S} warrants that, for twenty-four (24) months from the date of delivery, {D} shall:",["conform in all respects with their description and the Specification;","be of satisfactory quality within the meaning of the Sale of Goods Act 1979;","be fit for any purpose held out by {S} or made known to {S} by {B} before the relevant order;","be free from defects in design, materials and workmanship; and","comply with all applicable laws."]],"If any of {D} do not comply with clause {N}.1, {B} may, without prejudice to its other rights and remedies, reject them and require {S}, at {B}'s option, to repair or replace them, or to refund the price paid for them, in each case at {S}'s cost."],
  "Wide promises over a long period, and you choose the remedy.","You carry the risk of faults for two years, including fitness for purposes you may not control."],
 ["Specification, 12 months",0,["{S} warrants that, for twelve (12) months from the date of delivery, {D} shall conform in all material respects with the Specification and be free from material defects in design, materials and workmanship.","If {B} notifies {S} in writing of a breach of clause {N}.1 within that period, {S} shall, at its option, repair or replace the defective items, or refund the price paid for them.","{S} shall not be liable for any defect arising from fair wear and tear, wilful damage, negligence, abnormal storage or working conditions, or failure to follow {S}'s written instructions."],
  "The market position. Clear cover for a year, with sensible exclusions.","A fair, measurable standard, and you choose the cheapest fix."],
 ["90 days, sole remedy",1,["{S} warrants that, for ninety (90) days from the date of delivery, {D} shall conform in all material respects with the Specification.","{S}'s only obligation, and {B}'s sole remedy, for breach of clause {N}.1 shall be, at {S}'s option, to repair or replace the defective items or to refund the price paid for them.","Except as set out in this clause, all warranties, conditions and other terms implied by statute or common law, including the terms implied by sections 13 to 15 of the Sale of Goods Act 1979, are excluded to the fullest extent permitted by law."],
  "Short cover, and you cannot claim the wider losses a fault causes.","Limited exposure, and you decide how faults are fixed."],
 ["Supplied as is",2,["{D} are supplied as is. All warranties, conditions and other terms implied by statute or common law are excluded to the fullest extent permitted by law."],
  "No promises at all. You carry the whole risk of defects.","Minimal risk, though a court may disapply the exclusion if it is unreasonable."]]},

fm:{t:"Force Majeure",g:["force-majeure"],
 d:"Excuses a party from performing when events outside its control get in the way, and says what happens if they last.",
 n:"English law has no general doctrine of force majeure. Relief exists only if the contract provides it, and the separate doctrine of frustration applies only in extreme cases. A duty to overcome force majeure does not require a party to accept performance other than as the contract provides (RTI v MUR Shipping [2024] UKSC 18).",
 df:{"Good Industry Practice":GIP_DEF},
 o:[
 ["Narrow, with early exit",-2,[["In this clause, “Force Majeure Event” means an event or circumstance beyond the reasonable control of the affected party, the effects of which could not have been prevented or avoided by the exercise of Good Industry Practice, but excluding:",["any industrial action involving the workforce of the affected party or of any of its subcontractors;","any failure or delay of a subcontractor or supplier, unless itself caused by a Force Majeure Event; and","any event whose effects would have been prevented or mitigated by a business continuity plan prepared in accordance with Good Industry Practice."]],"Provided it complies with clause {N}.3, a party shall not be in breach of this Agreement to the extent its performance is prevented or delayed by a Force Majeure Event. {B} shall not be liable to pay for anything which, as a result, is not provided.","The affected party shall notify the other party within two (2) Business Days of becoming aware of the Force Majeure Event and shall use all reasonable endeavours to mitigate its effect.","If a Force Majeure Event prevents or delays {S}'s performance for more than thirty (30) days, {B} may terminate this Agreement immediately by written notice."],
  "Few excuses for non-performance, you stop paying for what you do not receive, and you can leave quickly.","Supply chain and workforce problems stay with you, and the customer can walk away after a month."],
 ["Market standard, mutual",0,[["In this clause, “Force Majeure Event” means any event or circumstance beyond a party's reasonable control, including:",["acts of God, flood, drought, earthquake or other natural disaster;","epidemic or pandemic;","terrorist attack, civil war, civil commotion or riot, war or armed conflict;","nuclear, chemical or biological contamination; and","any law or action taken by a government or public authority."]],"Neither party shall be in breach of this Agreement, nor liable for any delay or failure in performing its obligations, to the extent such delay or failure results from a Force Majeure Event, provided that it promptly notifies the other party and uses all reasonable endeavours to mitigate the effect of the Force Majeure Event.","If a Force Majeure Event prevents a party from performing all or a material part of its obligations for more than ninety (90) days, either party may terminate this Agreement by giving written notice to the other."],
  "The market position. Balanced relief with a duty to work around problems.","Fair relief for events genuinely beyond your control."],
 ["Broad, no exit",2,["In this clause, “Force Majeure Event” means any cause beyond {S}'s reasonable control, including acts of God, natural disaster, epidemic or pandemic, war, terrorism, riot, any law or action of a government or public authority, any shortage of labour, materials or energy, any increase in costs, any failure of a utility, transport or telecommunications network, any cyber attack and any failure or delay of a subcontractor or supplier.","{S} shall not be liable for any delay or failure to perform its obligations resulting from a Force Majeure Event, and the time for performance shall be extended by a period equivalent to that during which performance is prevented."],
  "The other side has many excuses, and you cannot leave however long it lasts.","Wide protection for a long list of everyday business problems."]]},

ip:{t:"Intellectual Property",g:["ip"],
 d:"Decides who owns the intellectual property in the work produced, and what each side may do with it.",
 n:"Copyright in work created by an independent contractor stays with the contractor unless assigned. An assignment of copyright must be in writing and signed by the assignor (Copyright, Designs and Patents Act 1988, s.90(3)), and moral rights can be waived but not assigned (s.87).",
 df:{"Intellectual Property Rights":IPR_DEF},
 o:[
 ["{B} owns everything",-2,["{S} assigns to {B}, with full title guarantee and free from all third-party rights, by way of present assignment of present and future rights, all Intellectual Property Rights in the Deliverables, with effect from their creation.","{S} shall procure the irrevocable and unconditional waiver of all moral rights in the Deliverables to which any individual is or may be entitled.","{S} shall, at {B}'s request, promptly execute all documents and do all things reasonably required to secure and perfect {B}'s rights under this clause."],
  "You own what you paid for and can use, adapt or sell it without restriction.","You may give away rights in your own tools and methods if they end up in the work."],
 ["{B} owns bespoke, {S} keeps background",0,["{S} assigns to {B}, with full title guarantee, by way of present assignment of present and future rights, all Intellectual Property Rights in the Deliverables, excluding {S}'s Background IPR.","{S} grants to {B} a perpetual, irrevocable, worldwide, royalty-free, non-exclusive licence, with the right to sub-license to members of {B}'s group and its contractors, to use, copy and modify any of {S}'s Background IPR incorporated in the Deliverables, for the purpose of receiving and using the Services and the Deliverables.","Each party shall retain ownership of its Background IPR."],
  "The market position. You own what was made for you and can keep using everything it relies on.","You keep your core tools and can reuse them for other clients.",{"Background IPR":"Intellectual Property Rights owned by or licensed to a party before the Effective Date, or developed independently of this Agreement"}],
 ["{S} owns, perpetual licence",1,["All Intellectual Property Rights in the Deliverables shall vest in and remain with {S}.","{S} grants to {B} a perpetual, non-exclusive, non-transferable, royalty-free licence to use the Deliverables for its internal business purposes."],
  "You can use the work forever, but cannot sell it, transfer it or stop competitors getting the same thing.","You keep ownership and can reuse the work across your business."],
 ["{S} owns, licence ends",2,["All Intellectual Property Rights in the Deliverables shall vest in and remain with {S}.","{S} grants to {B} a non-exclusive, non-transferable licence to use the Deliverables for its internal business purposes during the term of this Agreement. The licence shall terminate automatically on the termination or expiry of this Agreement.","Nothing in this Agreement restricts {S} from using the Deliverables, or any know-how gained in performing the Services, for any other purpose."],
  "You could lose the right to use work you paid for when the contract ends.","Full ownership, and strong leverage to keep the customer renewing."]]},

conf:{t:"Confidentiality",g:["confidentiality"],
 d:"Controls how each party may use and share the other's confidential information, and for how long.",
 df:{"Confidential Information":"all information of a confidential nature relating to the business, affairs, customers, clients or suppliers of a party or of any member of its group, disclosed to the other party in connection with this Agreement, other than information which is or becomes public (other than through a breach of this Agreement), was lawfully in the recipient's possession before disclosure, or is independently developed by the recipient"},
 o:[
 ["One-way, without time limit",-2,["{S} shall keep the Confidential Information of {B} confidential, shall use it only to perform its obligations under this Agreement, and shall not disclose it to any person other than those of its employees and professional advisers who need to know it for that purpose and who are bound by equivalent obligations of confidence.","The obligations in this clause shall survive termination or expiry of this Agreement without limit in time."],
  "Your information is protected for good, with nothing owed in return.","You carry the obligations alone and indefinitely."],
 ["Mutual, five years",0,["Each party shall keep the Confidential Information of the other party confidential and shall not use it for any purpose other than to exercise its rights and perform its obligations under this Agreement.",["Each party may disclose the other party's Confidential Information:",["to its employees, officers, representatives, subcontractors and advisers who need to know it for the purpose in clause {N}.1, provided that it ensures they comply with this clause as if they were a party; and","as required by law, a court of competent jurisdiction or any governmental or regulatory authority."]],"This clause shall survive termination or expiry of this Agreement for five (5) years."],
  "The market position. Balanced and long-lasting.","Fair and mutual, with a clear end date."],
 ["Mutual, marked information, two years",1,["Each party shall keep confidential any information of the other party which is marked as confidential at the time of its disclosure, and shall not disclose it to any third party save as required by law.","This clause shall survive termination or expiry of this Agreement for two (2) years."],
  "Anything you forget to mark is unprotected, and protection ends soon after the contract.","Simple to manage and short-lived."]]},

asg:{t:"Assignment and Subcontracting",g:["boilerplate"],
 d:"Says whether a party can transfer the contract, or hand the work to someone else.",
 n:"An assignment transfers only the benefit of a contract. Transferring the burden needs a novation, which requires the other party's agreement in any event.",
 o:[
 ["{B} free, {S} restricted",-2,["{B} may assign, novate or otherwise transfer any or all of its rights and obligations under this Agreement to any member of its group, or to any purchaser of all or part of its business, on written notice to {S}.","{S} shall not assign, novate, subcontract or otherwise transfer any of its rights or obligations under this Agreement without {B}'s prior written consent. {S} shall remain responsible for the acts and omissions of its subcontractors as if they were its own.","{B} may terminate this Agreement by written notice if {S} undergoes a change of control within the meaning of section 1124 of the Corporation Tax Act 2010."],
  "You can restructure or sell freely, control who does the work, and leave if the supplier changes hands.","You cannot sell your business or outsource without the customer's permission."],
 ["Mutual consent, group transfers allowed",0,["Neither party shall assign, novate or otherwise transfer any of its rights or obligations under this Agreement without the prior written consent of the other party, such consent not to be unreasonably withheld or delayed.","Either party may assign this Agreement to a member of its group on written notice to the other, provided that the assignee shall assign it back before ceasing to be a member of that group."],
  "The market position. Balanced, with group reorganisations allowed.","Balanced, and consent cannot be refused without a good reason."],
 ["{S} free, {B} restricted",2,["{S} may at any time assign, novate, subcontract or deal in any other manner with any or all of its rights and obligations under this Agreement.","{B} shall not assign, novate or otherwise transfer any of its rights or obligations under this Agreement without {S}'s prior written consent."],
  "Someone you did not choose could end up performing the contract.","Maximum freedom to restructure, sell or outsource."]]},

gl:{t:"Governing Law and Jurisdiction",g:["disputes"],
 d:"Chooses English law and decides where any dispute will be heard.",
